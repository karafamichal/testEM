<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="icon" href="/mark.png?v=1.20">
<link rel="alternate" hreflang="sk" href="{{url_sk}}">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="stylesheet" href="/brand.css">
<style>
  /* Plan&Ride website (2.15.1): Zastávka blue on cool paper, pill buttons, the original logo in blue. */
  :root { --sign: #1D4FB8; --accent: #1D4FB8; --ink: #14181D; --paper: #F4F6F8; --surface: #FFFFFF;
    --line: #E7EBF0; --muted: #56606C; --band: #1D4FB8; --on-band: #FFFFFF; --band-muted: #DCE6FB; --chip: #E1E9FA; --on-chip: #14398A;
    --amber: #1D4FB8; --ok: #1E8A4C; --bad: #B42318; --focus: #1D4FB8; --logo-pin: #1D4FB8; --logo-bus: #1F2935; --logo-hole: #FFFFFF;
    color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --sign: #8AB4FF; --accent: #8AB4FF; --ink: #E8ECF1; --paper: #101317; --surface: #171B21;
      --line: #222831; --muted: #A8B2BE; --band: #1F2935; --band-muted: #A8B2BE; --chip: #1F2D4A; --on-chip: #C9D8FF;
      --amber: #8AB4FF; --ok: #4CC47F; --bad: #FF6B61; --focus: #8AB4FF; --logo-pin: #8AB4FF; --logo-bus: #FFFFFF; --logo-hole: #101317;
      color-scheme: dark; }
    :root:not([data-theme="light"]) .btn:not(.quiet) { color: #101317; }
  }
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  header.site { background: var(--surface); border-bottom: 1px solid var(--line); }
  header.site .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 14px; padding-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 24px; }
  .brand .logo { width: 48px; height: 36px; }
  .brand > span b { color: var(--accent); }
  .lg-pin { fill: var(--logo-pin); } .lg-bus { fill: var(--logo-bus); } .lg-hole { fill: var(--logo-hole); }
  .lg-route { fill: none; stroke: var(--logo-pin); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
  .lg-node { fill: var(--logo-hole); stroke: var(--logo-pin); stroke-width: 7; }
  nav.site { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  nav.site a { color: var(--ink); text-decoration: none; padding: 8px 12px; border-radius: 999px; font-weight: 500; }
  nav.site a[aria-current="page"] { background: var(--chip); color: var(--on-chip); }
  .lang { font-size: 14px; color: var(--muted); }
  .lang a { color: var(--muted); }
  main { flex: 1; padding: 40px 0 56px; }
  main h1 { font-size: clamp(36px, 6vw, 64px); line-height: 1.02; margin: 0 0 14px; }
  main h2 { font-size: 30px; margin: 40px 0 10px; }
  main h3 { font-size: 21px; margin: 24px 0 6px; }
  main p, main li { max-width: 68ch; }
  main ul { padding-left: 22px; }
  main li { margin: 6px 0; }
  main code { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 0.92em; }
  main hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; }
  .hero-logo { width: 260px; height: auto; }
  .badge { display: inline-block; background: var(--chip); color: var(--on-chip); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  .lead { font-size: 20px; color: var(--muted); }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 24px 0 8px; }
  .btn { text-decoration: none; border-radius: 999px; min-height: 52px; padding: 0 24px; display: inline-flex; align-items: center; background: var(--accent); color: #fff; }
  .btn.quiet { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .btn[aria-disabled] { cursor: default; }
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 40px; }
  .card { background: var(--surface); border-radius: 18px; padding: 22px; }
  .card h3 { margin: 0 0 6px; font-size: 21px; }
  .card p { margin: 0; color: var(--muted); }
  /* A full-width green band, e.g. "Built with riders" on the home page. */
  .band { background: var(--band); color: var(--on-band); border-radius: 22px; padding: 32px; margin: 40px 0 8px; }
  .band h2 { margin: 0 0 8px; color: var(--on-band); font-size: 34px; }
  .band p { color: var(--band-muted); margin: 0; }
  /* What's new: each version a big heading, its sections as small labels. */
  .page-changelog main h2 { font-size: 40px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); }
  .page-changelog main h1 + h2 { border-top: 0; padding-top: 0; }
  .page-changelog main h3 { display: inline-block; font: 600 14px/1 var(--body); background: var(--chip); color: var(--on-chip); border-radius: 999px; padding: 6px 12px; margin: 18px 0 4px; }
  footer.site { border-top: 1px solid var(--line); background: var(--surface); font-size: 14px; color: var(--muted); }
  footer.site .wrap { display: flex; gap: 16px; flex-wrap: wrap; padding-top: 18px; padding-bottom: 18px; }
  footer.site a { color: var(--muted); }
  footer.site .admin { margin-left: auto; }
  @media (max-width: 640px) {
    .hero { grid-template-columns: 1fr; }
    .hero-logo { width: 150px; order: -1; }
    nav.site { margin-left: 0; width: 100%; }
    .band { padding: 24px; }
  }
</style>
</head>
<body class="page-{{page}}">
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{home_url}}"><svg class="logo" viewBox="30 34 190 140" aria-hidden="true"><path class="lg-pin" d="M62 38a28 28 0 0 1 28 28c0 21-28 48-28 48S34 87 34 66a28 28 0 0 1 28-28z"/><circle class="lg-hole" cx="62" cy="66" r="12"/><path class="lg-route" d="M104 102H120a15 15 0 0 1 0 30H88a15 15 0 0 0 0 30H158"/><circle class="lg-node" cx="96" cy="102" r="8"/><circle class="lg-node" cx="166" cy="162" r="8"/><path class="lg-bus" d="M138 62a16 16 0 0 1 16-16h35a16 16 0 0 1 16 16v47a6 6 0 0 1-6 6h-55a6 6 0 0 1-6-6z"/><rect class="lg-bus" x="127" y="72" width="7" height="18" rx="3"/><rect class="lg-bus" x="209" y="72" width="7" height="18" rx="3"/><rect class="lg-bus" x="144" y="113" width="12" height="10" rx="3"/><rect class="lg-bus" x="187" y="113" width="12" height="10" rx="3"/><rect class="lg-hole" x="154" y="54" width="35" height="6" rx="3"/><rect class="lg-hole" x="145" y="68" width="53" height="28" rx="4"/><circle class="lg-hole" cx="152" cy="105" r="5"/><circle class="lg-hole" cx="191" cy="105" r="5"/></svg><span>Plan<b>&amp;</b>Ride</span></a>
    <nav class="site" aria-label="{{nav_label}}">{{{nav}}}</nav>
    <span class="lang">{{{lang_switch}}}</span>
  </div>
</header>
<main><div class="wrap">
{{{content}}}
</div></main>
<footer class="site">
  <div class="wrap">
    <span>© {{year}} Plan&amp;Ride</span>
    <a href="mailto:ksjd.apps@gmail.com">ksjd.apps@gmail.com</a>
    <a href="https://github.com/karafamichal/testEM">GitHub</a>
    <a class="admin" href="/dashboard">{{admin_label}}</a>
  </div>
</footer>
</body>
</html>
