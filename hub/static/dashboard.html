  const selectedKey = selected ? decodeURIComponent(selected) : "";
  const reports = await api("community/reports" + (selectedKey ? "?trip=" + encodeURIComponent(selectedKey) : ""));
  view.innerHTML = `
    <div class="page-head"><h1>Community</h1>
      <div class="stats">
        <div class="stat"><b>${stats.activeTrips}</b><span>buses with live reports</span></div>
        <div class="stat"><b>${stats.reportsToday}</b><span>reports in 24 h</span></div>
      </div>
    </div>
    <div class="section">
      <p class="muted" style="max-width:75ch;margin:0 0 14px">Riders who opted in say where their bus really is: with buttons on the follow notification, or automatically from their phone while riding (only the stop is sent). Phones on the bus from the last 3 minutes beat taps. Each rider counts once per bus; the newest reports weigh most, and reports far from the rest are ignored.</p>
      <h2>${communityFilter.day ? "Buses on " + esc(communityFilter.day) : "Buses in the last 6 hours"}${communityFilter.line ? ", line " + esc(communityFilter.line) : ""}</h2>
      <form class="row" id="c-filter" style="gap:8px;margin:0 0 12px;flex-wrap:wrap">
        <label>Day <input type="date" name="day" value="${esc(communityFilter.day)}"></label>
        <label>Line <input name="line" size="6" value="${esc(communityFilter.line)}" placeholder="all"></label>
        <button class="btn" type="submit">Show</button>
        ${communityFilter.day || communityFilter.line ? '<button class="btn quiet" type="button" id="c-reset">Last 6 hours</button>' : ""}
      </form>
      ${trips.length ? `<div class="table-wrap"><table class="grid">
        <thead><tr><th>Line</th><th>Trip</th><th>Delay now</th><th>Last reported</th><th>Worst</th><th>Usually</th><th>Riders</th><th>Source</th><th>Last report</th></tr></thead>
        <tbody>${trips.slice(0, showAll.trips ? trips.length : LIST_LIMIT).map((t) => {
          const p = tripParts(t.trip_key), d = delayText(t.delay?.delaySeconds), l = delayText(t.last_delay), w = delayText(t.max_delay);
          const h = t.history, u = h ? delayText(h.delaySeconds) : null;
          return `<tr class="click" data-trip="${esc(t.trip_key)}" aria-selected="${t.trip_key === selectedKey}" tabindex="0">
            <td><span class="plate line">${esc(t.line || p.line)}</span></td>
            <td>${esc(p.first)}<div class="muted small">departs ${esc(p.start)}</div></td>
            <td>${t.delay ? `<span class="delay ${d.cls}">${d.text}</span>` : '<span class="muted">–</span>'}</td>
            <td><span class="delay ${l.cls}">${l.text}</span><div class="muted small">at ${esc(t.last_stop || "–")}</div></td>
            <td><span class="delay ${w.cls}">${w.text}</span></td>
            <td>${h ? `<span class="delay ${u.cls}">${u.text}</span><div class="muted small">late ${h.lateRuns} of ${h.runs} ${dayTypeLabel[h.dayType] || ""}</div>` : '<span class="muted">–</span>'}</td>
            <td>${t.riders} <span class="muted small">(${t.n} reports)</span></td>
            <td>${t.delay ? (t.delay.source === "gps" ? "riders' phones" : "taps") : '<span class="muted">–</span>'}</td>
            <td>${ago(t.last)}</td></tr>`;
        }).join("")}</tbody></table></div>${more("trips", trips.length)}`
        : `<div class="empty" style="padding:20px 0"><h2>No reports${communityFilter.day ? " that day" : " yet"}</h2><p>When riders share where their bus is (buttons or their phone), the bus shows up here with its delay.</p></div>`}
    </div>
    <div class="section">
      <h2>${selectedKey ? "Reports for this bus" : "Latest reports"}</h2>
      ${selectedKey ? `<p><a href="#community">Show all reports</a></p>` : ""}
      ${reports.length ? `<div class="table-wrap"><table class="grid">
        <thead><tr><th>When</th><th>Line</th><th>Stop</th><th>Delay</th><th>Type</th><th>Rider</th><th>From</th><th></th></tr></thead>
        <tbody>${reports.slice(0, showAll.reports ? reports.length : LIST_LIMIT).map((r) => {
          const d = delayText(r.delay_s);
          return `<tr><td>${ago(r.created_at)}</td><td><span class="plate line">${esc(r.line)}</span></td>
            <td>${esc(r.stop_name)} <span class="muted small">#${r.stop_index + 1}</span></td>
            <td><span class="delay ${d.cls}">${d.text}</span></td>
            <td>${esc(kindLabel[r.kind] || r.kind || "tap")}</td>
            <td><code title="Random id, new for every followed bus">${esc(r.reporter.slice(0, 8))}</code>${r.blocked ? ' <span class="error-text small">blocked</span>' : ""}</td>
            <td>${esc(r.platform)}</td>
            <td class="row"><button class="btn quiet" data-del="${r.id}" type="button">Delete</button>
              <button class="btn danger" data-block="${esc(r.reporter)}" data-unblock="${r.blocked ? 1 : ""}" type="button">${r.blocked ? "Unblock" : "Block rider"}</button></td></tr>`;
        }).join("")}</tbody></table></div>${more("reports", reports.length)}` : `<p class="muted">No reports.</p>`}
    </div>
    <div class="section" id="c-stats"></div>`;
  renderRiderStats();
  $("#c-filter").onsubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    communityFilter = { day: f.get("day") || "", line: (f.get("line") || "").trim() };
    renderCommunity(selected);
  };
  $("#c-reset") && ($("#c-reset").onclick = () => { communityFilter = { day: "", line: "" }; renderCommunity(selected); });
  view.querySelectorAll("[data-more]").forEach((b) => b.onclick = () => { showAll[b.dataset.more] = true; renderCommunity(selected); });
  view.querySelectorAll("[data-trip]").forEach((tr) => {
    const go = () => location.hash = "community/" + encodeURIComponent(tr.dataset.trip);
    tr.onclick = go; tr.onkeydown = (e) => e.key === "Enter" && go();
  });
  view.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    await api("community/delete", { id: Number(b.dataset.del) }); toast("Report deleted"); renderCommunity(selected);
  });
  view.querySelectorAll("[data-block]").forEach((b) => b.onclick = async () => {
    await api("community/block", { reporter: b.dataset.block, unblock: !!b.dataset.unblock });
    toast(b.dataset.unblock ? "Rider unblocked" : "Rider blocked; their reports no longer count"); renderCommunity(selected);
  });
}

// ------------------------------------------------------------------ timetable

const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const dayClock = (ms) => new Date(ms).toLocaleString([], { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
const localInput = (d = new Date()) => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const kb = (n) => n == null ? "–" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " kB";
const epochOf = (v) => Math.floor(new Date(v || Date.now()).getTime() / 1000);
let ttPoll = null;

// ------------------------------------------------------------------ map: stops, buses now, editing stops and road traces

let mapState = null;

function renderMap(stationId = null) {
  // Changing only the station in the address (#map/<id>) keeps the map, and opens that station.
  if (stationId && mapState && $("#map")) return showStation(stationId, true);
  clearInterval(mapState?.timer);
  view.innerHTML = `
    <div class="page-head"><h1>Map</h1><span class="muted small legend">
      <span><i class="dot" style="background:#1E8A4C"></i>live (the bus's GPS, riders' phones or reports)</span>
      <span><i class="dot" style="background:#5f6b7a"></i>by the timetable</span>
      <span><i class="dot" style="background:#C77700"></i>late</span>
      <span><i class="dot" style="background:#1D4FB8"></i>stop (mint: moved by hand)</span></span></div>
    <p class="muted small" id="map-people"></p>
    <div class="op-filter small" id="op-filter"></div>
    <div class="map-wrap" id="map-wrap"><div id="map"></div>
      <aside class="map-panel"><button class="side-x" id="side-x" type="button" title="Close the panel (full-screen map)" aria-label="Close the panel">✕</button>
      <div class="map-side" id="map-side"></div></aside></div>`;
  // Lines are easy to click: within 8 px counts (a 6 px line at a town zoom was hard to hit).
  const map = L.map("map", { preferCanvas: true, renderer: L.canvas({ tolerance: 8 }) }).setView([48.736, 19.146], 13);
  // OpenStreetMap's tile servers refuse requests without a Referer (403): send our origin with them.
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors",
    referrerPolicy: "strict-origin-when-cross-origin" }).addTo(map);
  mapState = { map, stops: L.layerGroup().addTo(map), buses: L.layerGroup().addTo(map), trip: L.layerGroup().addTo(map), tripId: null, edit: null };
  // The panel closes for a full-screen map; the ? button on the map opens it again (help, or the stop being edited).
  const Toggle = L.Control.extend({ onAdd() {
    const b = L.DomUtil.create("button", "map-toggle");
    b.type = "button"; b.textContent = "?"; b.title = "Show or hide the panel (help, the stop you're editing)"; b.setAttribute("aria-label", b.title);
    L.DomEvent.disableClickPropagation(b);
    b.onclick = () => sidePanel($("#map-wrap").classList.contains("closed"));
    return b;
  } });
  new Toggle({ position: "topright" }).addTo(map);
  $("#side-x").onclick = () => sidePanel(false);
  sideHelp();
  const load = () => { loadStops(); loadBuses(); };
  map.on("moveend", load);
  if (stationId) showStation(stationId, true);
  map.on("click", (e) => mapState.mapClick?.(e));
  load();
  mapLive();
  // Buses move: refresh while the map is the page shown.
  mapState.timer = setInterval(() => { if (location.hash.startsWith("#map")) loadBuses(); else clearInterval(mapState.timer); }, 10000);
}

/**
 * Everyone on the map over a WebSocket: who has which stop or trip open (a stop open elsewhere can't be saved here),
 * and the others' edits shown as soon as they're saved. Comes back by itself if the connection drops.
 */
function mapLive() {
  const state = mapState;
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/admin/api/map/live?tab=${MAP_TAB}`);
  state.ws = ws;
  ws.onopen = () => sendFocus();
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "presence") { state.editors = m.editors.filter((p) => p.tab !== MAP_TAB); showPeople(); }
    if (m.type === "changed") othersSaved(m);
  };
  ws.onclose = () => { if (mapState === state && location.hash.startsWith("#map")) setTimeout(() => { if (mapState === state) mapLive(); }, 3000); };
}

/** Tell the others what this tab has open. */
function sendFocus() {
  const ws = mapState?.ws;
  if (ws?.readyState === 1) ws.send(JSON.stringify({ type: "focus", station: mapState.stationId || null, trip: mapState.tripId || null }));
  setTimeout(showPeople); // once the panel just opened is drawn
}

function showPeople() {
  const people = mapState.editors || [];
  const el = $("#map-people");
  if (el) el.textContent = people.length ? "Also on the map: " + people.map((p) => p.name + (p.station ? ` (stop ${p.station})` : p.trip ? " (a trip)" : "")).join(", ") : "";
  const warn = $("#st-busy");
  if (warn) {
    const who = people.find((p) => p.station && p.station === mapState.stationId);
    warn.hidden = !who;
    if (who) warn.textContent = `${who.name} is editing this stop right now: wait until they're done, or your changes won't be saved.`;
  }
}

/** Someone else saved: show it here too, keeping the map where it is. */
function othersSaved(m) {
  toast(`${m.by} saved ${m.station ? "a stop" : "a road trace"}`);
  loadStops();
  if (m.station && m.station === mapState.stationId && !mapState.busy) showStation(m.station);
  if ((m.segment || m.trip) && mapState.tripId) (mapState.busy ? redrawTrip : showTripOnMap)(mapState.tripId);
}

/** The open trip's lines drawn again, leaving the panel (an editor in use there) as it is. */
async function redrawTrip(tripId) {
  const t = await api("map/trip?id=" + encodeURIComponent(tripId));
  if (mapState.tripId === tripId) drawTrip(t, false);
}

function bbox() {
  const b = mapState.map.getBounds();
  return [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map((x) => x.toFixed(5)).join(",");
}

/** Open or close the map's side panel; closed, the map takes the whole width. */
function sidePanel(open) {
  $("#map-wrap")?.classList.toggle("closed", !open);
  setTimeout(() => mapState?.map.invalidateSize(), 0);
}

function sideHelp() {
  if (mapState && (mapState.stationId || mapState.tripId)) { mapState.stationId = null; sendFocus(); }
  $("#map-side").innerHTML = `<h2>Map</h2>
    <form id="line-find" class="row"><input id="line-q" placeholder="Line (34, 60101), stop, or from > to" aria-label="Find a line, a stop's lines or a connection">
      <button class="primary">Find line</button></form>
    <div id="line-routes"></div>
    <div class="row map-tools"><button type="button" id="map-todo">To-do</button><button type="button" id="map-history">History</button>
      <button type="button" id="map-bulk">Snap an operator</button></div>
    <div class="row"><button type="button" id="new-stop">New stop here</button><span class="muted small" id="new-stop-hint"></span></div>
    <p class="muted">Buses on the road now: green ones are where riders' phones or reports put them, grey ones where the timetable does. Stops show from zoom 14.</p>
    <p class="muted"><b>A stop:</b> click it to move it, give it more places (with the lines that stop at each), a zone (circle or shape), or make it a central station whose platforms are other stops. All of it is kept through every timetable update.</p>
    <p class="muted small">Purple dots: extra places. Green ring: central station; green dots and dashed lines: its platforms. Shaded: zones.</p>
    <p class="muted"><b>Platforms:</b> a stop's places and sub-stations are numbered on the map and in this panel (the one you're editing lights up). Each has a platform number and its directions: which lines leave from it and the towns they head for. A bus goes to the one whose direction fits it best, so one line can leave from different platforms each way.</p>
    <p class="muted small">✕ closes this panel for a full-screen map; the ? button on the map opens it again.</p>
    <p class="muted"><b>Road traces:</b> click a bus to see its trip, or find a line above to get every way it goes, also when none of its buses is on the road. Snap it to the roads (OpenStreetMap routing), or click a part between two stops to draw it by hand: drag the points, click the map to add one, right-click a point to remove it.</p>`;
  bindLineFind();
}

/** What's still wrong on the map, most used first; a click opens a bus that drives it. */
async function sideTodo(tab = "straight") {
  const side = $("#map-side");
  side.innerHTML = `<h2>Map to-do</h2><p class="muted small">Loading…</p>`;
  const todo = await api("map/todo");
  const tabs = [["straight", "Straight parts"], ["unplaced", "Stops without a place"], ["detours", "Long detours"]];
  const hint = { straight: "Parts between two stops still drawn as a straight line. Open one and snap it, or use Snap an operator.",
    unplaced: "Stops the timetable doesn't place. Open the bus and use Place on map for the stop.",
    detours: "Traces over three times longer than the way between their stops: loops or wrong roads. Open one and fix it with checkpoints." }[tab];
  const items = todo[tab];
  side.innerHTML = `<h2>Map to-do</h2>
    <div class="seg" role="tablist" style="margin-bottom:10px">${tabs.map(([k, l]) => `<button type="button" role="tab" data-todo="${k}" aria-pressed="${k === tab}">${l} ${todo.counts[k]}</button>`).join("")}</div>
    <p class="muted small">${hint}</p>
    <ol class="todo-list">${items.map((x, i) => `<li><button type="button" class="link" data-open-todo="${i}">${esc(x.name || `${x.fromName} → ${x.toName}`)}</button>
      <span class="muted small">${x.uses} trip${x.uses === 1 ? "" : "s"}${x.times ? `, ${x.times}× the distance` : ""}, line ${esc(x.line || "")}</span></li>`).join("") || `<li class="muted">Nothing here.</li>`}</ol>
    <div class="row"><button type="button" id="todo-back">Back</button></div>`;
  side.querySelectorAll("[data-todo]").forEach((b) => b.onclick = () => sideTodo(b.dataset.todo));
  side.onclick = (e) => {
    const b = e.target.closest("[data-open-todo]");
    if (b && items[Number(b.dataset.openTodo)]?.tripId) showTripOnMap(items[Number(b.dataset.openTodo)].tripId).then(fitTrip);
  };
  $("#todo-back").onclick = sideHelp;
}

/** Every map change, newest first; one can be undone when nothing newer changed the same thing. */
async function sideHistory() {
  const side = $("#map-side");
  const { history } = await api("map/history");
  const names = { stop: "moved stop", "stop/reset": "stop back to timetable", station: "stop set-up", child: "sub-station", "child/remove": "sub-station removed",
    segment: "drawn by hand", "segment/reset": "straight again", via: "checkpoints", route: "stops of a way", snap: "snapped" };
  side.innerHTML = `<h2>Map history</h2>
    <p class="muted small">Who changed what on the map. Undo puts it back as it was; undo newer changes of the same thing first.</p>
    <ol class="hist-list">${history.map((h) => `<li class="${h.undone_at ? "undone" : ""}"><div><b>${esc(names[h.action] || h.action)}</b> ${esc(h.what)}</div>
      <div class="muted small">${esc(h.username)}, ${ago(h.created_at)}${h.undone_at ? ", undone" : ""}</div>
      ${h.undone_at ? "" : `<button type="button" data-undo="${h.id}">Undo</button>`}</li>`).join("") || `<li class="muted">No changes yet.</li>`}</ol>
    <div class="row"><button type="button" id="hist-back">Back</button></div>`;
  side.onclick = async (e) => {
    const b = e.target.closest("[data-undo]");
    if (!b) return;
    try { await api(`map/history/${b.dataset.undo}/undo`, {}); toast("Undone"); loadStops(); if (mapState.tripId) redrawTrip(mapState.tripId); sideHistory(); }
    catch (err) { toast(err.message); }
  };
  $("#hist-back").onclick = sideHelp;
}

/** Snaps an operator's straight parts in the background (one a second), with its progress. */
async function sideBulk() {
  const side = $("#map-side");
  const { status, operators } = await api("map/bulk");
  side.innerHTML = `<h2>Snap an operator</h2>
    <p class="muted small">Snaps the parts still drawn straight on every line of one operator, the most used first (up to 600 a run, one a second, so
      the public routers aren't overloaded). Parts drawn by hand stay as they are. You can keep working meanwhile.</p>
    ${status.running ? `<p><b>Snapping ${esc(status.operator)}</b>: ${status.done + status.failed} of ${status.total} done, ${status.failed} couldn't be routed.</p>
      <progress max="${status.total}" value="${status.done + status.failed}" style="width:100%"></progress>
      <div class="row"><button type="button" id="bulk-stop">Stop</button></div>`
      : `${status.finished ? `<p class="small">Last run: ${esc(status.operator)}, ${status.done} snapped, ${status.failed} couldn't be routed, ${ago(status.finished)} by ${esc(status.by)}.</p>` : ""}
      <label class="field">Operator<select class="input" id="bulk-op">${operators.map((o) => `<option>${esc(o)}</option>`).join("")}</select></label>
      <div class="row"><button type="button" class="primary" id="bulk-go">Start snapping</button></div>`}
    <div class="row"><button type="button" id="bulk-back">Back</button></div>`;
  $("#bulk-back").onclick = () => { clearTimeout(sideBulk.t); sideHelp(); };
  if (status.running) {
    $("#bulk-stop").onclick = async () => { await api("map/bulk", { operator: "stop" }); sideBulk(); };
    clearTimeout(sideBulk.t); sideBulk.t = setTimeout(() => { if ($("#bulk-back")) sideBulk(); }, 3000);
    return;
  }
  $("#bulk-go").onclick = async () => {
    try { const r = await api("map/bulk", { operator: $("#bulk-op").value }); toast(`Snapping ${r.total} parts`); sideBulk(); } catch (err) { toast(err.message); }
  };
}

function bindLineFind() {
  if ($("#map-todo")) { $("#map-todo").onclick = () => sideTodo(); $("#map-history").onclick = sideHistory; $("#map-bulk").onclick = sideBulk; }
  // A stop the timetable lacks (for a line added under Lines): click the map where it is, then name it.
  const add = $("#new-stop");
  if (add) add.onclick = () => {
    $("#new-stop-hint").textContent = "Click the map where the stop is";
    mapState.mapClick = async (e) => {
      mapState.mapClick = null;
      $("#new-stop-hint").textContent = "";
      const name = prompt("The stop's name, with its town (e.g. Zvolen, Nová ulica)");
      if (!name?.trim()) return;
      try {
        await api("stops/new", { name: name.trim(), lat: e.latlng.lat, lon: e.latlng.lng });
        toast("Stop added: in the timetable in about half a minute");
        setTimeout(loadStops, 35000);
      } catch (err) { toast(err.message); }
    };
  };
  const form = $("#line-find");
  if (form) form.onsubmit = (e) => { e.preventDefault(); const q = $("#line-q").value.trim(); if (q) findLine(q); };
}

/** Every way a line goes (one trip each); opening one shows it like a bus on the road. */
async function findLine(q) {
  const box = $("#line-routes");
  box.innerHTML = `<p class="muted small">Looking…</p>`;
  const r = await api("map/lines?q=" + encodeURIComponent(q));
  showOps(r.routes.map((x) => x.operator));
  const all = r.routes.length;
  r.routes = r.routes.filter((x) => !hiddenOps.has(x.operator));
  if (!r.routes.length) { box.innerHTML = `<p class="muted small">${all ? `${esc(q)}: only buses of hidden operators.` : `Nothing for ${esc(q)}: try a line number, a stop, or two stops as "from > to".`}</p>`; return; }
  box.innerHTML = `<ul class="line-routes">${r.routes.map((x, i) => `<li><button type="button" data-route="${i}">
    <b>${esc(x.line)}</b> ${esc(x.from)} → ${esc(x.to)}<br><span class="muted small">${x.stops} stops · ${x.trips} trip${x.trips === 1 ? "" : "s"} · ${esc(x.operator)}</span></button></li>`).join("")}</ul>`;
  box.onclick = (e) => {
    const b = e.target.closest("[data-route]");
    if (b) showTripOnMap(r.routes[Number(b.dataset.route)].tripId).then(fitTrip);
  };
}

/** Moves the map to the trip just opened (a line found by number may run far from where the map is). */
function fitTrip() {
  const layers = mapState.trip.getLayers();
  if (layers.length) mapState.map.fitBounds(L.featureGroup(layers).getBounds().pad(0.15));
}

async function loadStops() {
  const { map, stops } = mapState;
  stops.clearLayers();
  if (map.getZoom() < 14) return;
  const r = await api("map/stations?bbox=" + bbox());
  const at = Object.fromEntries(r.stations.map((s) => [s.id, s]));
  for (const s of r.stations) {
    // What was set up by hand: the zone, extra places, and the line to the central station.
    if (s.zone) stops.addLayer(zoneLayer(s.zone, { interactive: false }));
    for (const p of s.places || []) {
      stops.addLayer(L.circleMarker([p.lat, p.lon], { radius: 4, color: "#fff", weight: 1, fillColor: "#7C3AED", fillOpacity: 1 })
        .bindTooltip(esc([s.name, p.label, (p.lines || []).join(", ")].filter(Boolean).join(" · "))));
      stops.addLayer(L.polyline([[s.lat, s.lon], [p.lat, p.lon]], { color: "#7C3AED", weight: 1, dashArray: "3 4", interactive: false }));
    }
    if (s.parent && at[s.parent]) stops.addLayer(L.polyline([[s.lat, s.lon], [at[s.parent].lat, at[s.parent].lon]], { color: "#0F766E", weight: 2, dashArray: "6 5", interactive: false }));
    // bubblingMouseEvents: a click on a stop isn't also a click on the map (adding a place, a zone corner).
    const m = L.circleMarker([s.lat, s.lon], { bubblingMouseEvents: false, radius: s.central ? 9 : 6, color: s.central ? "#0F766E" : "#fff", weight: s.central ? 4 : 2,
      fillColor: s.moved ? "#6EE7A8" : s.parent ? "#0F766E" : "#1D4FB8", fillOpacity: 1 });
    m.bindTooltip(esc(s.name) + (s.central ? " (central)" : "") + (s.parent && at[s.parent] ? ` (platform of ${esc(at[s.parent].name)})` : ""));
    m.on("click", () => stopClicked(s));
    stops.addLayer(m);
  }
}

function zoneLayer(z, options = {}) {
  const style = { color: "#0F766E", weight: 2, fillOpacity: 0.12, ...options };
  return z.type === "circle" ? L.circle([z.lat, z.lon], { radius: z.radius, ...style }) : L.polygon(z.points, style);
}

/** A stop clicked: its panel, or (choosing a sub-station for a central station) that stop becomes one. */
function stopClicked(s) {
  if (mapState.pick) return mapState.pick(s);
  showStation(s.id);
}

/**
 * A station's panel: move it; extra places (each may say which lines board there); a zone (circle or drawn shape);
 * central station with sub-stations (other stops that are its platforms for some lines). Everything survives timetable updates.
 */
async function showStation(id, center = false) {
  const { map } = mapState;
  endEditing();
  const st = await api("map/station?id=" + encodeURIComponent(id));
  if (center) map.setView([st.lat, st.lon], 17);
  mapState.stationId = st.id;
  sendFocus();
  // The address names the station: a link to it, and reload keeps it open.
  history.replaceState(null, "", "#map/" + encodeURIComponent(st.id));
  const layer = L.layerGroup().addTo(map);
  mapState.editing = { layer, cleanup: [] };
  const side = $("#map-side");
  sidePanel(true);
  const lines = (l) => (l || []).join(", ");
  side.innerHTML = `<h2>${esc(st.name)}</h2>
    <p class="busy-note" id="st-busy" hidden></p>
    <p class="muted small">${esc(st.id)}${st.moved ? " · moved by hand" : ""}${st.central ? " · central station" : ""}${st.parent ? ` · platform of <a href="#" data-open="${esc(st.parent.id)}">${esc(st.parent.name)}</a>` : ""}</p>
    <h3>Position</h3>
    <div class="row"><button id="st-move">Move</button>${st.moved ? '<button id="st-unmove">Back to the timetable\'s place</button>' : ""}</div>
    <h3>Places and platforms</h3>
    <p class="muted small">Numbered spots where buses stop (each side of the road, a stand further away). Give each a platform number and its directions: the lines that leave from it and the towns they head for (where they end, or pass on the way). A bus goes to the one whose direction fits it best.</p>
    ${unassignedNote(st)}
    <datalist id="dir-options">${directionOptions(st.serving, ...st.children.map((c) => c.serving))}</datalist>
    <datalist id="pf-options">${platformNumbers(st.serving, ...st.children.map((c) => c.serving))}</datalist>
    <div id="st-places">${st.places.map((p, i) => placeRow(p, i, st.serving)).join("")}</div>
    <div class="row"><button id="st-add-place">Add a place (click the map)</button><button class="primary" id="st-save-places">Save places</button></div>
    <h3>Zone</h3>
    <p class="muted small">The area that counts as this station (being in it is being at the stop).</p>
    <div class="row"><button data-zone="circle">Circle</button><button data-zone="polygon">Draw a shape</button>${st.zone ? '<button data-zone="none">Remove zone</button>' : ""}</div>
    <div id="st-zone-edit"></div>
    <h3>Central station</h3>
    <label class="row"><input type="checkbox" id="st-central" ${st.central ? "checked" : ""} ${st.parent ? "disabled" : ""}> Central station: other stops are its platforms</label>
    <div id="st-children">${st.central ? `<p class="muted small">${st.children.length} sub-station(s), numbered in green on the map</p>${st.children.map((c, n) => childRow(c, n, st.serving)).join("") || '<p class="muted small">No sub-stations yet.</p>'}
      <div class="row"><button id="st-add-child">Add a sub-station (click a stop on the map)</button></div>` : ""}</div>
    <div class="row"><button id="st-close">Close</button></div>`;

  // Draw what's set up, editable.
  // Numbered markers, the same numbers as the cards; a click on either lights both up.
  const numIcon = (n, kind = "") => L.divIcon({ className: "pnum " + kind, html: String(n), iconSize: [22, 22] });
  const placeMarkers = [];
  const addPlaceMarker = (p) => {
    const i = placeMarkers.length;
    const m = L.marker([p.lat, p.lng ?? p.lon], { draggable: true, icon: numIcon(i + 1) }).addTo(layer);
    m.on("click", () => select("place", i));
    placeMarkers.push(m);
    return m;
  };
  st.places.forEach((p) => addPlaceMarker(p));
  const childMarkers = st.children.map((c, n) => c.lat == null ? null
    : L.marker([c.lat, c.lon], { icon: numIcon(n + 1, "child") }).addTo(layer).on("click", () => select("child", n)));
  const select = (kind, i) => {
    side.querySelectorAll(".spot.on").forEach((x) => x.classList.remove("on"));
    [...placeMarkers, ...childMarkers].forEach((m) => m?.getElement()?.classList.remove("on"));
    const card = side.querySelector(kind === "place" ? `.place-row[data-i="${i}"]` : `.child-row[data-n="${i}"]`);
    const m = kind === "place" ? placeMarkers[i] : childMarkers[i];
    card?.classList.add("on");
    card?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    m?.getElement()?.classList.add("on");
    if (m) map.panTo(m.getLatLng());
  };
  const servingOf = (spot) => {
    if (!spot.classList.contains("child-row")) return st.serving;
    const c = st.children[Number(spot.dataset.n)];
    return c.serving.lines.length ? c.serving : st.serving;
  };
  // Directions: add one (empty, or a suggested way out), remove one; a number badge shows its spot on the map.
  // One handler each (the panel is reused for every stop, so listeners would pile up).
  side.onclick = (e) => {
    const badge = e.target.closest("[data-select]");
    if (badge) { const spot = badge.closest(".spot"); select(spot.classList.contains("child-row") ? "child" : "place", Number(spot.dataset.i ?? spot.dataset.n)); }
    const add = e.target.closest("[data-add-dir]");
    if (add) { const spot = add.closest(".spot"); $(".dirs", spot).insertAdjacentHTML("beforeend", dirRow({ name: "", lines: [], towards: [] }, servingOf(spot))); }
    const del = e.target.closest("[data-del-dir]");
    if (del) del.closest(".dir").remove();
  };
  side.onchange = (e) => {
    if (!e.target.matches("[data-suggest]") || e.target.value === "") return;
    const spot = e.target.closest(".spot");
    const way = (servingOf(spot).directions || [])[Number(e.target.value)];
    if (way) $(".dirs", spot).insertAdjacentHTML("beforeend", dirRow({ name: wayName(way), lines: way.lines, towards: way.headsigns }, servingOf(spot)));
    e.target.value = "";
  };
  if (st.zone) layer.addLayer(zoneLayer(st.zone));
  L.circleMarker([st.lat, st.lon], { radius: 10, color: "#6EE7A8", weight: 3, fill: false }).addTo(layer);

  side.querySelectorAll("[data-open]").forEach((a) => a.onclick = (e) => { e.preventDefault(); showStation(a.dataset.open); });
  bindLinePickers(side);
  // On a phone the panel is under the pinned map: scroll so the panel starts right under it.
  if (matchMedia("(max-width: 900px)").matches) window.scrollTo({ top: side.getBoundingClientRect().top + scrollY - $("#map").offsetHeight, behavior: "smooth" });
  // Close goes back to where you came from: the bus being edited (its line redrawn with the stop as it is now), else the help.
  $("#st-close").onclick = () => {
    endEditing();
    history.replaceState(null, "", "#map");
    mapState.stationId = null;
    if (mapState.tripId) { sendFocus(); showTripOnMap(mapState.tripId); } else sideHelp();
  };

  // Position
  $("#st-move").onclick = () => {
    const m = L.marker([st.lat, st.lon], { draggable: true }).addTo(layer);
    $("#st-move").outerHTML = '<button class="primary" id="st-move-save">Save position</button>';
    $("#st-move-save").onclick = async () => { const p = m.getLatLng(); await api("map/stop", { id: st.id, lat: p.lat, lon: p.lng }); toast("Position saved"); loadStops(); showStation(st.id); };
  };
  if (st.moved) $("#st-unmove").onclick = async () => { await api("map/stop/reset", { id: st.id }); toast("Back where the timetable has it"); loadStops(); showStation(st.id); };

  // Places
  const placesBox = $("#st-places");
  placesBox.onclick = (e) => {
    const del = e.target.closest("[data-del-place]");
    if (!del) return;
    const i = Number(del.dataset.delPlace);
    layer.removeLayer(placeMarkers[i]); placeMarkers[i] = null;
    del.closest(".place-row").remove();
  };
  $("#st-add-place").onclick = () => {
    toast("Click the map where the place is");
    mapState.mapClick = (e) => {
      mapState.mapClick = null;
      const i = placeMarkers.length;
      addPlaceMarker(e.latlng);
      placesBox.insertAdjacentHTML("beforeend", placeRow({ label: "", lines: [] }, i, st.serving));
      select("place", i);
    };
  };
  $("#st-save-places").onclick = async () => {
    const places = [];
    placesBox.querySelectorAll(".place-row").forEach((row) => {
      const m = placeMarkers[Number(row.dataset.i)];
      if (!m) return;
      const p = m.getLatLng();
      places.push({ lat: p.lat, lon: p.lng, ...readSpot(row) });
    });
    await api("map/station", { id: st.id, places });
    toast("Places saved"); loadStops(); showStation(st.id);
  };

  // Zone
  side.querySelectorAll("[data-zone]").forEach((b) => b.onclick = () => editZone(st, b.dataset.zone, layer));

  // Central and sub-stations
  $("#st-central").onchange = async (e) => {
    if (!e.target.checked && st.children.length && !confirm("Its sub-stations become ordinary stops again. Continue?")) { e.target.checked = true; return; }
    await api("map/station", { id: st.id, central: e.target.checked });
    loadStops(); showStation(st.id);
  };
  if (st.central) {
    $("#st-add-child").onclick = () => {
      toast("Click the stop that is one of its platforms");
      mapState.pick = async (child) => {
        mapState.pick = null;
        if (child.id === st.id) return toast("That's the central station itself");
        await api("map/child", { parent: st.id, child: child.id, label: "", lines: "" });
        toast(child.name + " is now a platform of " + st.name); loadStops(); showStation(st.id);
      };
    };
    $("#st-children").onclick = async (e) => {
      const row = e.target.closest(".child-row");
      if (!row) return;
      if (e.target.closest("[data-child-save]")) {
        await api("map/child", { parent: st.id, child: row.dataset.id, ...readSpot(row) });
        toast("Saved"); loadStops();
      }
      if (e.target.closest("[data-child-remove]")) { await api("map/child/remove", { child: row.dataset.id }); loadStops(); showStation(st.id); }
      if (e.target.closest("[data-open]")) { e.preventDefault(); showStation(row.dataset.id); }
    };
  }
}

/**
 * Lines as a writable field plus a tick list of the lines that stop there (with where they go); ticking adds or
 * removes a line in the field, typing works too.
 */
function linesPicker(chosen, serving) {
  const picked = new Set(chosen || []);
  const extra = [...picked].filter((l) => !serving.lines.some((x) => x.line === l));
  const options = [...serving.lines, ...extra.map((line) => ({ line, headsigns: [] }))];
  return `<div class="lines-pick"><input class="input" data-lines placeholder="Lines (34, 60101)" value="${esc([...picked].join(", "))}">
    <details><summary>Choose lines${options.length ? ` (${options.length})` : ""}</summary>
      <div class="pick-tools"><button type="button" data-all>All</button><button type="button" data-none>None</button></div>
      ${options.map((o) => `<label class="pick"><input type="checkbox" value="${esc(o.line)}" ${picked.has(o.line) ? "checked" : ""}>
        <b>${esc(o.line)}</b> <span class="muted small">${esc(o.headsigns.join(", "))}</span></label>`).join("") || '<p class="muted small">No timetable lines stop here.</p>'}
    </details></div>`;
}

/** Keeps a lines picker's field and ticks in step (one handler for the whole panel). */
function bindLinePickers(root) {
  if (root.dataset.pickers) return; // once per panel: it is reused for every stop
  root.dataset.pickers = "1";
  const sync = (box) => {
    const field = $("[data-lines]", box);
    const typed = field.value.split(/[,\s]+/).filter(Boolean);
    const listed = [...box.querySelectorAll(".pick input")].map((c) => c.value);
    const ticked = [...box.querySelectorAll(".pick input:checked")].map((c) => c.value);
    field.value = [...typed.filter((l) => !listed.includes(l)), ...ticked].join(", ");
  };
  root.addEventListener("change", (e) => {
    const box = e.target.closest(".lines-pick");
    if (!box) return;
    if (e.target.matches("[data-lines]")) {
      const typed = new Set(e.target.value.split(/[,\s]+/).filter(Boolean));
      box.querySelectorAll(".pick input").forEach((c) => (c.checked = typed.has(c.value)));
    } else sync(box);
  });
  root.addEventListener("click", (e) => {
    const box = e.target.closest(".lines-pick");
    if (!box || !e.target.matches("[data-all], [data-none]")) return;
    box.querySelectorAll(".pick input").forEach((c) => (c.checked = e.target.matches("[data-all]")));
    sync(box);
  });
}

/** A way out of the stop, as a direction's name: "Smer Krupina / Dudince / Babina" ("Smer Zvolen: Západ / Tulská" in a town). */
function wayName(w) {
  const heads = w.headsigns.slice(0, 3);
  const town = heads[0]?.split(",")[0];
  if (heads.length > 1 && heads.every((h) => h.startsWith(town + ","))) return `Smer ${town}: ` + heads.map((h) => h.slice(town.length + 1).trim()).join(" / ");
  return "Smer " + heads.join(" / ");
}

/** Suggestions for a direction's name: the ways out grouped by the next stop, then each destination. */
function directionOptions(...servings) {
  const names = new Set();
  servings.forEach((x) => (x.directions || []).forEach((w) => names.add(wayName(w))));
  servings.forEach((x) => x.lines.forEach((l) => l.headsigns.forEach((h) => names.add("Smer " + h))));
  return [...names].map((n) => `<option value="${esc(n)}">`).join("");
}

/** Platform number suggestions: the timetable's platform numbers here, then 1 to 30. */
function platformNumbers(...servings) {
  const codes = new Set(servings.flatMap((x) => x.platforms));
  for (let n = 1; n <= 30; n++) codes.add(String(n));
  return [...codes].sort((a, b) => a.padStart(4, "0").localeCompare(b.padStart(4, "0"))).map((c) => `<option value="${esc(c)}">`).join("");
}

/** A place's or sub-station's directions; one set up before directions existed has its lines as its only one. */
function spotDirections(p) {
  return p.directions?.length ? p.directions : p.lines?.length ? [{ name: p.label || "", lines: p.lines, towards: [] }] : [];
}

/** Lines that stop here but aren't in any direction yet (only once something is set up). */
function unassignedNote(st) {
  const spots = [...st.places, ...st.children];
  if (!spots.length) return "";
  const lines = new Set([...st.serving.lines, ...st.children.flatMap((c) => c.serving.lines)].map((l) => l.line));
  const done = new Set(spots.flatMap((p) => spotDirections(p).flatMap((d) => d.lines)));
  const left = [...lines].filter((l) => !done.has(l));
  return left.length ? `<p class="small unassigned">Lines here without a platform yet: ${esc(left.join(", "))}</p>`
    : '<p class="small muted">Every line here has a platform.</p>';
}

/** What a card says: its label, platform number and directions (for saving). */
function readSpot(row) {
  return {
    label: $("[data-label]", row).value,
    platform: $("[data-platform]", row).value,
    directions: [...row.querySelectorAll(".dir")].map((d) => ({ name: $("[data-dname]", d).value, lines: $("[data-lines]", d).value, towards: $("[data-towards]", d).value })),
  };
}

function dirRow(d, serving) {
  return `<div class="dir"><div class="row"><input class="input" data-dname list="dir-options" placeholder="Direction (e.g. Smer Krupina)" value="${esc(d.name || "")}" style="flex:1">
      <button type="button" data-del-dir title="Remove this direction" aria-label="Remove this direction">✕</button></div>
    ${linesPicker(d.lines, serving)}
    <input class="input" data-towards placeholder="Towards: towns or stops, separated by ; (Krupina; Dudince)" value="${esc((d.towards || []).join("; "))}"></div>`;
}

/** A card's directions, with buttons to add one, empty or one of the ways out of the stop. */
function spotFields(p, serving) {
  const ways = serving.directions || [];
  return `<div class="dirs">${spotDirections(p).map((d) => dirRow(d, serving)).join("")}</div>
    <div class="row"><button type="button" data-add-dir>+ Direction</button>
      ${ways.length ? `<select class="input" data-suggest style="flex:1;min-width:0"><option value="">Add a way out of the stop…</option>
        ${ways.map((w, k) => `<option value="${k}">${esc(wayName(w))} (next: ${esc(w.next)}; ${esc(w.lines.join(", "))})</option>`).join("")}</select>` : ""}</div>`;
}

function placeRow(p, i, serving) {
  return `<div class="spot place-row" data-i="${i}">
    <div class="spot-head"><button type="button" class="pnum-badge" data-select title="Show it on the map">${i + 1}</button>
      <input class="input" data-platform list="pf-options" placeholder="Platform" aria-label="Platform number" value="${esc(p.platform || "")}" style="width:84px">
      <input class="input" data-label placeholder="Name (optional)" aria-label="Name" value="${esc(p.label || "")}" style="flex:1;min-width:0">
      <button type="button" data-del-place="${i}" title="Remove this place" aria-label="Remove this place">✕</button></div>
    ${spotFields(p, serving)}</div>`;
}

function childRow(c, n, parentServing) {
  return `<div class="spot child-row" data-id="${esc(c.id)}" data-n="${n}">
    <div class="spot-head"><button type="button" class="pnum-badge" data-select title="Show it on the map">${n + 1}</button>
      <input class="input" data-platform list="pf-options" placeholder="Platform" aria-label="Platform number" value="${esc(c.platform || "")}" style="width:84px">
      <a href="#" data-open style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</a></div>
    <input class="input" data-label placeholder="Label shown to riders (optional)" aria-label="Label" value="${esc(c.label)}">
    ${spotFields(c, c.serving.lines.length ? c.serving : parentServing)}
    <div class="row"><button class="primary" data-child-save>Save</button><button data-child-remove>Remove</button></div></div>`;
}

/** The station's zone: a circle (drag its centre, set the radius) or a shape (click the map for each corner). */
function editZone(st, kind, layer) {
  const box = $("#st-zone-edit");
  if (kind === "none") {
    api("map/station", { id: st.id, zone: null }).then(() => { toast("Zone removed"); loadStops(); showStation(st.id); });
    return;
  }
  if (kind === "circle") {
    const z = st.zone?.type === "circle" ? st.zone : { lat: st.lat, lon: st.lon, radius: 80 };
    const circle = L.circle([z.lat, z.lon], { radius: z.radius, color: "#0F766E", fillOpacity: 0.15 }).addTo(layer);
    const center = L.marker([z.lat, z.lon], { draggable: true }).addTo(layer);
    center.on("drag", () => circle.setLatLng(center.getLatLng()));
    box.innerHTML = `<div class="row"><label>Radius <input class="input" type="number" id="zone-r" min="10" max="3000" value="${z.radius}" style="width:90px"> m</label>
      <button class="primary" id="zone-save">Save circle</button></div>`;
    $("#zone-r").oninput = (e) => circle.setRadius(Number(e.target.value) || 10);
    $("#zone-save").onclick = async () => {
      const c = center.getLatLng();
      await api("map/station", { id: st.id, zone: { type: "circle", lat: c.lat, lon: c.lng, radius: Number($("#zone-r").value) } });
      toast("Zone saved"); loadStops(); showStation(st.id);
    };
    return;
  }
  const points = (st.zone?.type === "polygon" ? st.zone.points : []).map((p) => L.latLng(p[0], p[1]));
  const shape = L.polygon(points, { color: "#0F766E", fillOpacity: 0.15 }).addTo(layer);
  const corners = L.layerGroup().addTo(layer);
  const redraw = () => {
    shape.setLatLngs(points);
    corners.clearLayers();
    points.forEach((p, i) => {
      const v = L.marker(p, { draggable: true, icon: L.divIcon({ className: "vertex", iconSize: [12, 12] }) }).addTo(corners);
      v.on("drag", (e) => { points[i] = e.target.getLatLng(); shape.setLatLngs(points); });
      v.on("contextmenu", () => { points.splice(i, 1); redraw(); });
    });
  };
  redraw();
  mapState.mapClick = (e) => { points.push(e.latlng); redraw(); };
  box.innerHTML = `<p class="muted small">Click the map for each corner; drag corners; right-click one to remove it.</p>
    <div class="row"><button class="primary" id="zone-save">Save shape</button><button id="zone-clear">Start over</button></div>`;
  $("#zone-clear").onclick = () => { points.length = 0; redraw(); };
  $("#zone-save").onclick = async () => {
    if (points.length < 3) return toast("A shape needs at least 3 corners");
    mapState.mapClick = null;
    await api("map/station", { id: st.id, zone: { type: "polygon", points: points.map((p) => [p.lat, p.lng]) } });
    toast("Zone saved"); loadStops(); showStation(st.id);
  };
}

/** Leave whatever the station panel was editing. */
function endEditing() {
  if (!mapState) return;
  mapState.mapClick = null;
  mapState.pick = null;
  if (mapState.editing) { mapState.map.removeLayer(mapState.editing.layer); mapState.editing = null; }
}

/**
 * Operators shown on the map (buses now, lines found): untick one to hide it, so a busy map stays readable. Every
 * operator seen gets a box; the ones hidden are remembered in this browser.
 */
const hiddenOps = new Set((() => { try { return JSON.parse(localStorage.getItem("mapHiddenOps") || "[]"); } catch { return []; } })());
const seenOps = new Set();
function showOps(operators) {
  const before = seenOps.size;
  operators.forEach((o) => o && seenOps.add(o));
  const box = $("#op-filter");
  if (!box || (seenOps.size === before && box.childElementCount)) return;
  box.innerHTML = "Operators: " + [...seenOps].sort().map((o) =>
    `<label><input type="checkbox" data-op="${esc(o)}" ${hiddenOps.has(o) ? "" : "checked"}> ${esc(o)}</label>`).join(" ");
  box.onchange = (e) => {
    const o = e.target.dataset.op;
    if (!o) return;
    e.target.checked ? hiddenOps.delete(o) : hiddenOps.add(o);
    try { localStorage.setItem("mapHiddenOps", JSON.stringify([...hiddenOps])); } catch { /* private window: this visit only */ }
    loadBuses();
    if ($("#line-q")?.value.trim() && $("#line-routes")?.childElementCount) findLine($("#line-q").value.trim());
  };
}

async function loadBuses() {
  const r = await api("map/vehicles?bbox=" + bbox());
  const { buses } = mapState;
  buses.clearLayers();
  showOps(r.vehicles.map((v) => v.operator));
  for (const v of r.vehicles.filter((x) => !hiddenOps.has(x.operator))) {
    const late = v.delay != null && v.delay >= 600 ? "very" : v.delay != null && v.delay >= 180 ? "late" : "";
    const icon = L.divIcon({ className: "", html: `<div class="bus-icon ${v.live ? "live" : ""} ${late}">${esc(v.line)}</div>`, iconSize: null });
    const m = L.marker([v.lat, v.lon], { icon });
    const d = delayText(v.delay);
    m.bindTooltip(`${esc(v.line)} → ${esc(v.headsign)}<br>next: ${esc(v.next)}<br>${v.live ? `${d.text} (${v.source === "gps" ? "riders' phones" : v.source === "bus" ? "the bus's own GPS" : "reports"})` : "timetable"}`);
    m.on("click", () => showTripOnMap(v.tripId));
    buses.addLayer(m);
  }
}

async function showTripOnMap(tripId) {
  const t = await api("map/trip?id=" + encodeURIComponent(tripId));
  mapState.busy = null; // the trip's own panel again: no editor open
  const opened = mapState.tripId !== tripId;
  mapState.tripId = tripId;
  mapState.stationId = null;
  if (opened) sendFocus();
  drawTrip(t, opened);
  const side = $("#map-side");
  sidePanel(true);
  side.innerHTML = `<h2>${esc(t.line)} → ${esc(t.headsign)}</h2><p class="muted small">${esc(t.operator)} · ${esc(tripId)}
      <button type="button" class="link" id="trip-close">Close trip</button></p>
    <p class="muted">${t.segments.filter((s) => s.traced).length} of ${t.segments.length} parts follow the roads. Click a part to draw it by hand.</p>
    <div class="row"><button class="primary" id="snap">Snap to roads</button><button id="snap-missing">Snap only the straight parts</button>
      <button id="trip-via" title="Points the bus must pass, for a part that's routed along the wrong roads">Checkpoints…</button>${t.routeKey ? `<button id="own-stops">Edit stops</button>` : ""}</div>
    <p class="muted small" id="trip-via-hint">${t.ownStops ? "Stops set by hand for this way." : ""}</p>
    <div id="snap-progress"></div>
    ${t.stops.some((s) => s.lat == null) ? `<p class="muted small">Stops marked "Place on map" have no place on the map (the timetable doesn't say where they are), so the parts
      around them can't be drawn: press "Place on map" and click the map where the stop is.</p>` : ""}
    <ol class="small" id="trip-stops">${t.stops.map((s, i) => `<li>${esc(s.name)} <span class="muted">${new Date(s.departure).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
      ${s.lat == null ? `<button type="button" class="link" data-place="${i}">Place on map</button>` : ""}</li>`).join("")}</ol>`;
  // A stop without a position: the next click on the map puts it there (kept like a stop moved by hand).
  $("#trip-stops").onclick = (e) => {
    const b = e.target.closest("[data-place]");
    if (!b) return;
    const stop = t.stops[Number(b.dataset.place)];
    b.textContent = "now click the map where it is…";
    mapState.mapClick = async (ev) => {
      mapState.mapClick = null;
      try { await api("map/stop", { id: stop.id, lat: ev.latlng.lat, lon: ev.latlng.lng }); toast(stop.name + " placed"); } catch (err) { toast(err.message); }
      showTripOnMap(tripId);
    };
  };
  // Part by part, with a progress bar: it takes about a second a part, and it should be clear it's working.
  const snap = async (keep) => {
    const todo = t.segments.filter((x) => x.points.length >= 2 && !(keep && x.traced));
    if (!todo.length) return toast("Every part already follows the roads");
    side.querySelectorAll("button").forEach((b) => (b.disabled = true));
    $("#snap-progress").innerHTML = `<p class="small"><span id="snap-text"></span></p><progress id="snap-bar" max="${todo.length}" value="0"></progress>`;
    let done = 0, failed = 0, skipped = 0;
    for (const [i, seg] of todo.entries()) {
      $("#snap-text").textContent = `Snapping to roads: part ${i + 1} of ${todo.length}…`;
      try {
        const r = await api("map/snap", { id: tripId, keep, from: seg.from, to: seg.to });
        done += r.snapped; failed += r.failed; skipped += r.snapped || r.failed ? 0 : 1;
        if (r.trip) drawTrip(r.trip, false); // each part shows on the map as it's done
      } catch (e) { failed++; }
      $("#snap-bar").value = i + 1;
    }
    toast(`Snapped ${done} part(s)` + (failed ? `, ${failed} couldn't be routed` : "") + (skipped ? `, ${skipped} drawn by hand kept` : ""));
    showTripOnMap(tripId);
  };
  $("#snap").onclick = () => snap(false);
  $("#snap-missing").onclick = () => snap(true);
  $("#trip-close").onclick = () => { mapState.trip.clearLayers(); mapState.tripId = null; sendFocus(); sideHelp(); };
  if ($("#own-stops")) $("#own-stops").onclick = () => editOwnStops(t, tripId);
  // Checkpoints: pick the part of the line they're for, then set them on the map.
  mapState.pickVia = false;
  $("#trip-via").onclick = () => {
    mapState.pickVia = !mapState.pickVia;
    $("#trip-via-hint").textContent = mapState.pickVia ? "Now click the part of the line that goes the wrong way" : t.ownStops ? "Stops set by hand for this way." : "";
    $("#trip-via").classList.toggle("primary", mapState.pickVia);
  };
}

/**
 * A city way's stops by hand, for every bus of it (S.A.D. leaves some out, e.g. line 1 towards Zeleznicna stanica):
 * add the missing ones in order, remove wrong ones. The bus keeps its own times; added stops get times by distance.
 */
function editOwnStops(t, tripId) {
  const side = $("#map-side");
  let list = t.stops.map((x) => ({ id: x.id, name: x.name }));
  let at = null; // adding a stop after list[at - 1]
  mapState.busy = "stops";
  const draw = () => {
    side.innerHTML = `<h2>Stops of ${esc(t.line)} → ${esc(t.headsign)}</h2>
      <p class="muted small">For every bus of this way. Add a stop with + where it belongs; ✕ removes one. The bus's own times stay,
      the stops you add get times by distance. Saved stops are used right away.</p>
      <ol class="own-stops">${list.map((x, i) => `<li${at === i + 1 ? ' class="adding"' : ""}><span>${esc(x.name)}</span>
        <button type="button" class="link" data-del="${i}" title="Remove">✕</button>
        <button type="button" class="link" data-add="${i}" title="Add a stop after this one">+</button></li>`).join("")}</ol>
      <div id="own-find" ${at == null ? "hidden" : ""}><p class="small">Add after ${esc(list[at - 1]?.name || "")}:</p>
        <input class="input" id="own-q" placeholder="Stop name" autocomplete="off" style="width:100%"><div id="own-hits"></div></div>
      <div class="row"><button class="primary" id="own-save">Save</button>${t.ownStops ? `<button id="own-reset">Back to the timetable's stops</button>` : ""}<button id="own-cancel">Cancel</button></div>`;
    side.querySelector(".own-stops").onclick = (e) => {
      const del = e.target.closest("[data-del]"), add = e.target.closest("[data-add]");
      if (del) { list.splice(Number(del.dataset.del), 1); at = null; draw(); }
      if (add) { at = Number(add.dataset.add) + 1; draw(); $("#own-q").focus(); }
    };
    let timer = null;
    $("#own-q").oninput = (e) => {
      clearTimeout(timer);
      const q = e.target.value.trim();
      timer = setTimeout(async () => {
        if (q.length < 2) return ($("#own-hits").innerHTML = "");
        const r = await api("timetable/stops?q=" + encodeURIComponent(q) + "&n=8");
        $("#own-hits").innerHTML = r.stops.map((x, i) => `<button type="button" class="link" data-hit="${i}">${esc(x.name)}</button>`).join("<br>");
        $("#own-hits").onclick = (ev) => {
          const b = ev.target.closest("[data-hit]");
          if (b) { const x = r.stops[Number(b.dataset.hit)]; list.splice(at, 0, { id: x.id, name: x.name }); at = null; draw(); }
        };
      }, 250);
    };
    const save = async (stations) => {
      $("#own-save").disabled = true;
      try { await api("map/route", { trip: tripId, stations }); } catch (err) { $("#own-save").disabled = false; return toast(err.message); }
      const before = t.stops.map((x) => x.id).join("|");
      await showTripOnMap(tripId);
      const now = (await api("map/trip?id=" + encodeURIComponent(tripId))).stops.map((x) => x.id).join("|");
      toast(stations.length < 2 ? "Back to the timetable's stops" : now !== before ? "Stops saved"
        : "Not used: the list has to keep the bus's own stops, in their order");
    };
    $("#own-save").onclick = () => save(list.map((x) => x.id));
    if ($("#own-reset")) $("#own-reset").onclick = () => save([]);
    $("#own-cancel").onclick = () => showTripOnMap(tripId);
  };
  draw();
}

function drawTrip(t, fit = true) {
  const { map, trip } = mapState;
  trip.clearLayers();
  const bounds = [];
  t.segments.forEach((seg) => {
    if (seg.points.length < 2) return;
    // bubblingMouseEvents: the click picking a part isn't also a click on the map (a checkpoint or point added at once).
    const line = L.polyline(seg.points, { bubblingMouseEvents: false, color: seg.traced ? "#1D4FB8" : "#8A94A6", weight: 6, opacity: 0.85, dashArray: seg.traced ? null : "8 8" });
    line.on("click", () => { if (mapState.pickVia) { mapState.pickVia = false; editVias(t, seg); } else editSegment(t, seg); });
    trip.addLayer(line);
    bounds.push(...seg.points);
  });
  t.stops.forEach((s) => { if (s.lat != null) trip.addLayer(L.circleMarker([s.lat, s.lon], { radius: 5, color: "#fff", weight: 2, fillColor: "#14213D", fillOpacity: 1 }).bindTooltip(esc(s.name))); });
  // Across stops without a position the line can't be drawn: a thin dashed connector, naming what's missing.
  let last = null, missing = [];
  t.stops.forEach((s) => {
    if (s.lat == null) { if (last) missing.push(s.name); return; }
    if (last && missing.length) trip.addLayer(L.polyline([[last.lat, last.lon], [s.lat, s.lon]], { color: "#C77700", weight: 3, dashArray: "4 8" })
      .bindTooltip("No place on the map yet: " + esc(missing.join(", ")) + " (Place on map, in the panel)"));
    last = s; missing = [];
  });
  t.segments.forEach((seg) => (seg.via || []).forEach((p, i) => trip.addLayer(L.circleMarker(p, { radius: 6, color: "#fff", weight: 2, fillColor: "#F59E0B", fillOpacity: 1 })
    .bindTooltip(`Checkpoint ${i + 1}: click to move or remove`).on("click", (e) => { L.DomEvent.stop(e); editVias(t, seg); }))));
  if (bounds.length && fit) map.fitBounds(bounds, { padding: [30, 30] });
}

/** Draw one stop-to-stop part by hand: its inner points can be dragged, added (click the map) or removed (right-click). */
function editSegment(t, seg) {
  const { map, trip } = mapState;
  mapState.busy = "segment";
  const ends = [seg.points[0], seg.points.at(-1)];
  let inner = seg.points.slice(1, -1).map((p) => L.latLng(p[0], p[1]));
  const layer = L.layerGroup().addTo(map);
  const redraw = () => {
    layer.clearLayers();
    layer.addLayer(L.polyline([ends[0], ...inner, ends[1]], { color: "#6EE7A8", weight: 5 }));
    inner.forEach((p, i) => {
      const v = L.marker(p, { draggable: true, icon: L.divIcon({ className: "vertex", iconSize: [12, 12] }) });
      v.on("drag", (e) => { inner[i] = e.target.getLatLng(); layer.getLayers()[0].setLatLngs([ends[0], ...inner, ends[1]]); });
      v.on("contextmenu", () => { inner.splice(i, 1); redraw(); });
      layer.addLayer(v);
    });
  };
  // A click on the map adds a point where it fits best (between the two nearest neighbours along the line).
  const add = (e) => {
    const all = [L.latLng(...ends[0]), ...inner, L.latLng(...ends[1])];
    let best = 0, bestCost = Infinity;
    for (let i = 0; i < all.length - 1; i++) {
      const cost = map.distance(all[i], e.latlng) + map.distance(e.latlng, all[i + 1]) - map.distance(all[i], all[i + 1]);
      if (cost < bestCost) { bestCost = cost; best = i; }
    }
    inner.splice(best, 0, e.latlng);
    redraw();
  };
  map.on("click", add);
  trip.eachLayer((l) => l.setStyle && l.setStyle({ opacity: 0.3 }));
  redraw();
  const side = $("#map-side");
  sidePanel(true);
  side.innerHTML = `<h2>Drawing a part by hand</h2><p class="muted">Drag the points along the road; click the map to add one; right-click a point to remove it.</p>
    <label class="row">Line ends at <select id="seg-end"><option>Loading the stop's places…</option></select></label>
    <p class="muted small">The place picked here is where every bus of this part stops, before any direction set up; Save with no points
      for a straight line to it.</p>
    <div class="row"><button class="primary" id="seg-save">Save</button><button id="seg-reset">Straight line again</button><button id="seg-cancel">Cancel</button></div>
    <p class="muted"><b>Or checkpoints:</b> when snapping takes the wrong roads, set a few points the bus must pass and it's routed through them,
      now and every time this part is snapped again.</p>
    <div class="row"><button id="seg-via">Checkpoints${seg.via?.length ? ` (${seg.via.length})` : ""}</button></div>`;
  const end = () => { map.off("click", add); map.removeLayer(layer); showTripOnMap(mapState.tripId); };
  $("#seg-via").onclick = () => { map.off("click", add); map.removeLayer(layer); editVias(t, seg); };
  $("#seg-cancel").onclick = end;
  // The spots of the stop the part goes to: its own point, its places (platforms) and sub-stations.
  api("map/station?id=" + encodeURIComponent(seg.to)).then((st) => {
    const spots = [{ lat: st.lat, lon: st.lon, name: "The stop's own point" },
      ...(st.places || []).map((p, i) => ({ lat: p.lat, lon: p.lon, name: `Place ${i + 1}${p.platform ? ` · platform ${p.platform}` : ""}${p.label ? ` · ${p.label}` : ""}` })),
      ...(st.children || []).map((c) => ({ lat: c.lat, lon: c.lon, name: `${c.name}${c.platform ? ` · platform ${c.platform}` : ""}` }))]
      .filter((x) => x.lat != null);
    const close = (x) => map.distance(L.latLng(x.lat, x.lon), L.latLng(...ends[1])) < 2;
    $("#seg-end").innerHTML = spots.map((x, i) => `<option value="${i}" ${close(x) ? "selected" : ""}>${esc(x.name)}</option>`).join("");
    $("#seg-end").onchange = (e) => { const x = spots[Number(e.target.value)]; ends[1] = [x.lat, x.lon]; redraw(); };
  }).catch(() => { $("#seg-end").innerHTML = `<option>Couldn't load the stop</option>`; });
  // Saved with its end: the part then ends exactly at the place picked, and the bus stops there.
  $("#seg-save").onclick = async () => { await api("map/segment", { from: seg.from, to: seg.to, points: [...inner.map((p) => [p.lat, p.lng]), ends[1]] }); toast("Saved"); end(); };
  $("#seg-reset").onclick = async () => { await api("map/segment/reset", { from: seg.from, to: seg.to }); toast("Straight again"); end(); };
}

/**
 * Checkpoints for one part: points the bus must pass, in order, whenever the part is snapped to the roads (when the
 * router takes the wrong streets). Click the map to add one, drag to move, right-click to remove.
 */
function editVias(t, seg) {
  mapState.viaEnd?.(true); // another part's checkpoints were open: leave them
  const { map, trip } = mapState;
  mapState.busy = "checkpoints";
  let via = (seg.via || []).map((p) => L.latLng(p[0], p[1]));
  const ends = [L.latLng(...seg.points[0]), L.latLng(...seg.points.at(-1))];
  const layer = L.layerGroup().addTo(map);
  const redraw = () => {
    layer.clearLayers();
    layer.addLayer(L.polyline([ends[0], ...via, ends[1]], { color: "#F59E0B", weight: 3, dashArray: "6 6" }));
    if ($("#via-list")) listVias();
    via.forEach((p, i) => {
      const v = L.marker(p, { draggable: true, icon: L.divIcon({ className: "", html: `<div class="via-pin">${i + 1}</div>`, iconSize: null }) });
      v.on("dragend", (e) => { via[i] = e.target.getLatLng(); redraw(); });
      v.on("contextmenu", () => { via.splice(i, 1); redraw(); });
      layer.addLayer(v);
    });
  };
  // A click adds a checkpoint where it fits best along the way (between its two nearest neighbours).
  const add = (e) => {
    const all = [ends[0], ...via, ends[1]];
    let best = 0, bestCost = Infinity;
    for (let i = 0; i < all.length - 1; i++) {
      const cost = map.distance(all[i], e.latlng) + map.distance(e.latlng, all[i + 1]) - map.distance(all[i], all[i + 1]);
      if (cost < bestCost) { bestCost = cost; best = i; }
    }
    via.splice(best, 0, e.latlng);
    redraw();
  };
  map.on("click", add);
  trip.eachLayer((l) => l.setStyle && l.setStyle({ opacity: 0.3 }));
  const side = $("#map-side");
  sidePanel(true);
  side.innerHTML = `<h2>Checkpoints</h2>
    <p class="muted">Click the map on the roads the bus really takes: it's routed through the checkpoints in order. Drag one to move it,
      right-click to remove it. They're kept: every later snap of this part goes through them too, for every line that uses it.</p>
    <ol class="own-stops" id="via-list"></ol>
    <div class="row"><button class="primary" id="via-route">Route through checkpoints</button><button id="via-clear">Remove all</button><button id="via-cancel">Cancel</button></div>
    <p class="muted small">Each stretch between checkpoints is routed on its own; one the router can only do the long way is drawn straight
      between them, so put them along the road the bus really takes.</p>
    <div id="via-progress"></div>`;
  const listVias = () => {
    $("#via-list").innerHTML = via.map((p, i) => `<li><span>Checkpoint ${i + 1}</span><button type="button" class="link" data-via-del="${i}" title="Remove">✕</button></li>`).join("")
      || `<li class="muted small">None yet: click the map.</li>`;
  };
  $("#via-list").onclick = (e) => { const d = e.target.closest("[data-via-del]"); if (d) { via.splice(Number(d.dataset.viaDel), 1); redraw(); } };
  const end = (quiet) => { map.off("click", add); map.removeLayer(layer); mapState.viaEnd = null; if (quiet !== true) showTripOnMap(mapState.tripId); };
  mapState.viaEnd = end;
  const save = async (points) => {
    side.querySelectorAll("button").forEach((b) => (b.disabled = true));
    $("#via-progress").innerHTML = `<p class="small muted">Routing…</p>`;
    try {
      await api("map/via", { from: seg.from, to: seg.to, points });
      const r = await api("map/snap", { id: mapState.tripId, from: seg.from, to: seg.to, force: true });
      toast(r.snapped ? (points.length ? "Routed through the checkpoints" : "Checkpoints removed, snapped again") : "Couldn't route it: try moving a checkpoint");
    } catch (err) { toast(err.message); }
    end();
  };
  redraw();
  $("#via-route").onclick = () => save(via.map((p) => [p.lat, p.lng]));
  $("#via-clear").onclick = () => save([]);
  $("#via-cancel").onclick = end;
}

    $("#tt-board").innerHTML = `<h3 style="margin:6px 0">${esc(name)} <span class="muted small">${s.lat != null ? s.lat.toFixed(5) + ", " + s.lon.toFixed(5) : "no position"} · id <code>${esc(id)}</code></span></h3>
      ${r.departures.length ? `<div class="table-wrap"><table class="grid"><thead><tr><th>Departs</th><th>Line</th><th>To</th><th>Operator</th><th>Feed</th></tr></thead>
      <tbody>${r.departures.map((d) => `<tr class="click" data-trip="${esc(d.tripId)}" tabindex="0"><td>${dayClock(d.at)}</td>
        <td><span class="plate line">${esc(d.line)}</span></td><td>${esc(d.headsign)}</td><td>${esc(d.operator)}</td><td><code>${esc(d.feed)}</code></td></tr>`).join("")}</tbody></table></div>`
        : '<p class="muted">No departures after this time.</p>'}`;
    bindTrips();
  };
  const search = async () => {
    const q = new FormData(stopForm).get("q").trim();
    if (!q) { $("#tt-stop-list").innerHTML = ""; return; }
    const r = await api("timetable/stops?q=" + encodeURIComponent(q));
    $("#tt-stop-list").innerHTML = r.stops.length ? `<div class="row" style="gap:6px;margin-bottom:12px">${r.stops.map((s) =>
      `<button class="btn quiet" type="button" data-stop="${esc(s.id)}">${esc(s.name)}</button>`).join("")}</div>` : '<p class="muted">No stop matches.</p>';
    view.querySelectorAll("[data-stop]").forEach((b) => b.onclick = () => board(b.dataset.stop, b.textContent).catch((err) => toast(err.message)));
  };
  let timer;
  stopForm.oninput = () => { clearTimeout(timer); timer = setTimeout(() => search().catch((err) => toast(err.message)), 200); };
  stopForm.onsubmit = (e) => e.preventDefault();
  $("#tt-plan-form").onsubmit = (e) => run(e.submitter, async () => {
    const f = new FormData(e.target);
    const q = new URLSearchParams({ from: f.get("from"), to: f.get("to"), time: epochOf(f.get("time")), n: 6, direct: f.get("direct") ? 1 : 0 });
    const r = await api("timetable/plan?" + q);
    $("#tt-plan-out").innerHTML = `<p class="muted small">${esc(r.from.name)} → ${esc(r.to.name)}</p>` + (r.connections.length ? r.connections.map((c) => `
      <div class="card" style="margin-bottom:10px"><div><strong>${dayClock(c.departure)} → ${clock(c.arrival)}</strong>
        <span class="muted small">${Math.round((c.arrival - c.departure) / 60000)} min</span></div>
        ${c.legs.map((l) => l.type === "walk"
          ? `<div class="muted small">walk ${esc(l.from.name)} → ${esc(l.to.name)}, ${Math.round((l.arrival - l.departure) / 60000)} min</div>`
          : `<div data-trip="${esc(l.tripId)}" tabindex="0" style="cursor:pointer"><span class="plate line">${esc(l.line)}</span>
             ${clock(l.departure)} ${esc(l.from.name)} → ${clock(l.arrival)} ${esc(l.to.name)} <span class="muted small">${esc(l.operator)}</span></div>`).join("")}
      </div>`).join("") : '<p class="muted">No connection found in the next two days.</p>');
    bindTrips();
  })(e);
}

const run = (btn, fn) => async (e) => {
  e?.preventDefault();
  btn.disabled = true;
  try { await fn(); } catch (err) { toast(err.message); } finally { btn.disabled = false; }
};
const field = (name, label, value, attrs = "") =>

// New bug reports and rider reports appear without reloading. While you type (a reply,
// a filter) the page is left alone and only the counters update.
function liveUpdates() {
  const events = new EventSource("/admin/api/events");
  let timer;
  const changed = (kind) => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const page = location.hash.slice(1).split("/")[0] || "bugs";
      const shown = kind === "community" ? page === "community" : ["bugs", "bug", "ideas", "idea"].includes(page);
      const typing = document.activeElement?.matches("input, textarea, select") ||
        [...document.querySelectorAll("textarea")].some((t) => t.value.trim());
      if (shown && !typing) {
        const y = scrollY;
        route().then(() => scrollTo(0, y));
      } else {
        refreshCounts();
        if (kind === "bugs") toast("New report");
      }
    }, 1000);
  };
  events.addEventListener("bugs", () => changed("bugs"));
  events.addEventListener("community", () => changed("community"));
}

// ---- phone tables: give each cell its column name, shown before the value when rows become cards
new MutationObserver(() => {
  view.querySelectorAll("table.grid").forEach((table) => {
    const heads = [...table.querySelectorAll("thead th")].map((th) => th.textContent.trim());
    if (!heads.length) return;
    table.querySelectorAll("tbody tr").forEach((tr) => [...tr.children].forEach((td, i) => {
      if (heads[i] && td.dataset.label !== heads[i]) td.dataset.label = heads[i];
    }));
  });
}).observe(view, { childList: true, subtree: true });

// ---- image viewer: reporters' photos open over the page (not a new tab), with zoom and pan
(() => {
  const box = document.getElementById("viewer"), img = box.querySelector("img");
  let list = [], at = 0, scale = 1, x = 0, y = 0;
  const pointers = new Map();
  let pinch = null, drag = null, swipeX = null, lastTap = 0;
  const draw = () => {
    img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
    box.classList.toggle("zoomed", scale > 1);
  };
  const reset = () => { scale = 1; x = 0; y = 0; draw(); };
  const show = (i) => {
    at = (i + list.length) % list.length;
    img.src = list[at];
    box.querySelector(".v-count").textContent = list.length > 1 ? `${at + 1} / ${list.length}` : "";
    box.querySelector(".v-prev").hidden = box.querySelector(".v-next").hidden = list.length < 2;
    reset();
  };
  const close = () => { box.hidden = true; img.removeAttribute("src"); };
  const zoomAt = (factor, cx, cy) => {
    const next = Math.min(8, Math.max(1, scale * factor));
    // keep the point under the finger/cursor where it is
    const ox = cx - window.innerWidth / 2 - x, oy = cy - window.innerHeight / 2 - y;
    x -= ox * (next / scale - 1); y -= oy * (next / scale - 1);
    scale = next;
    if (scale === 1) { x = 0; y = 0; }
    draw();
  };
  document.addEventListener("click", (e) => {
    const link = e.target.closest("a[data-view]");
    if (!link || e.ctrlKey || e.metaKey || e.button !== 0) return; // ctrl/middle click: a new tab, as before
    e.preventDefault();
    list = [...link.parentElement.querySelectorAll("a[data-view]")].map((a) => a.href);
    box.hidden = false;
    show(list.indexOf(link.href));
  });
  box.querySelector(".v-close").onclick = close;
  box.querySelector(".v-prev").onclick = () => show(at - 1);
  box.querySelector(".v-next").onclick = () => show(at + 1);
  box.addEventListener("click", (e) => { if (e.target === box) close(); });
  document.addEventListener("keydown", (e) => {
    if (box.hidden) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(at - 1);
    if (e.key === "ArrowRight") show(at + 1);
  });
  box.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
  img.addEventListener("dblclick", (e) => { scale > 1 ? reset() : zoomAt(2.5, e.clientX, e.clientY); });
  img.addEventListener("pointerdown", (e) => {
    img.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), scale };
      drag = swipeX = null;
    } else {
      drag = { x: e.clientX - x, y: e.clientY - y };
      swipeX = scale === 1 ? e.clientX : null;
      // double tap on touch screens (dblclick isn't sent for touch everywhere)
      if (e.pointerType === "touch") {
        if (Date.now() - lastTap < 300) { scale > 1 ? reset() : zoomAt(2.5, e.clientX, e.clientY); drag = swipeX = null; }
        lastTap = Date.now();
      }
    }
    e.preventDefault();
  });
  img.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      zoomAt((pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d) / scale, (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else if (drag && scale > 1) {
      x = e.clientX - drag.x; y = e.clientY - drag.y; draw();
    }
  });
  const up = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (swipeX !== null && list.length > 1 && Math.abs(e.clientX - swipeX) > 60) show(at + (e.clientX < swipeX ? 1 : -1));
    swipeX = null;
    if (!pointers.size) drag = null;
  };
  img.addEventListener("pointerup", up);
  img.addEventListener("pointercancel", up);
})();
</script>
</body>
</html>
