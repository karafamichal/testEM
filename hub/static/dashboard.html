<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emhub</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/brand.css">
<style>
  body { display: grid; grid-template-columns: 220px 1fr; min-height: 100dvh; }

  /* ---- rail */
  .rail { background: var(--rail); color: var(--rail-text); display: flex; flex-direction: column; padding: 20px 0 16px; position: sticky; top: 0; height: 100dvh; }
  .rail-brand { padding: 0 20px 18px; }
  .rail-brand strong { font-family: var(--display); font-size: 28px; color: #fff; display: block; line-height: 1; }
  .rail-brand span { font-size: 13px; }
  .rail nav { display: flex; flex-direction: column; }
  .rail nav a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; color: inherit; text-decoration: none; font-weight: 500;
    border-left: 4px solid transparent;
  }
  .rail nav a:hover { color: #fff; background: rgba(255,255,255,0.04); }
  .rail nav a[aria-current="page"] { color: #fff; border-left-color: var(--amber); background: rgba(255,255,255,0.06); }
  .rail .count { font-family: var(--display); font-weight: 700; font-size: 14px; background: var(--amber); color: #14213D; border-radius: 3px; padding: 0 7px; }
  .rail-foot { margin-top: auto; padding: 0 20px; font-size: 13px; }
  .rail-foot button { background: none; border: 0; color: var(--rail-text); padding: 0; cursor: pointer; text-decoration: underline; }

  main { min-width: 0; }
  .page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 22px 28px 14px; }
  .page-head h1 { font-size: 30px; }

  /* ---- bugs */
  .split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; border-top: 1px solid var(--line); min-height: calc(100dvh - 76px); }
  .list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100dvh - 76px); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 1; }
  .filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 4px 10px; font-size: 14px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .filters input { flex: 1 1 100%; }
  .bug-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .bug-row:hover { background: var(--surface); }
  .bug-row[aria-current="true"] { background: var(--surface); box-shadow: inset 4px 0 0 var(--sign); }
  .bug-row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bug-row .m { grid-column: 2; font-size: 13px; color: var(--muted); display: flex; gap: 10px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--muted); }
  .status.new::before { background: var(--amber); }
  .status.triaged::before { background: var(--sign); }
  .status.in_progress::before { background: var(--late); }
  .status.resolved::before { background: var(--ok); }

  .detail { padding: 22px 28px 40px; min-width: 0; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; }
  .detail-head h2 { font-size: 26px; overflow-wrap: anywhere; }
  .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 20px; margin: 18px 0; padding: 14px 0; border-block: 1px solid var(--line); font-size: 14px; }
  .meta dt { color: var(--muted); font-size: 13px; }
  .meta dd { margin: 0; overflow-wrap: anywhere; }
  .status-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--sign); }
  .desc { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 75ch; }
  .logs-tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .logs { background: #0B1426; color: #D6E2F5; font: 12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 14px; border-radius: 4px; max-height: 480px; overflow: auto; white-space: pre; }
  .logs mark { background: var(--amber); color: #14213D; }
  .logs .e { color: #FF9A8C; }
  .logs .w { color: #FFD27A; }

  .thread { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-width: 75ch; }
  .msg { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 12px 14px; }
  .msg header { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .msg.reply { border-left: 4px solid var(--sign); }
  .msg.note { border-left: 4px solid var(--amber); background: color-mix(in srgb, var(--amber) 8%, var(--surface)); }
  .msg.system, .msg.status { background: transparent; border-style: dashed; font-size: 14px; }
  .msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mail-failed { color: var(--bad); }
  .composer { margin-top: 18px; max-width: 75ch; display: flex; flex-direction: column; gap: 10px; }
  .composer-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .preview { border: 1px solid var(--line); border-radius: 4px; width: 100%; height: 520px; background: #fff; }

  .empty { padding: 60px 28px; color: var(--muted); max-width: 48ch; }
  .empty h2 { color: var(--ink); margin-bottom: 6px; }

  /* ---- community */
  .section { padding: 0 28px 28px; }
  .section h2 { font-size: 20px; margin: 10px 0 10px; }
  table.grid { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
  table.grid th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  table.grid td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.grid tr.click { cursor: pointer; }
  table.grid tr.click:hover td { background: color-mix(in srgb, var(--sign) 5%, var(--surface)); }
  table.grid tr[aria-selected="true"] td { background: color-mix(in srgb, var(--sign) 10%, var(--surface)); }
  .delay { font-family: var(--display); font-weight: 700; font-size: 17px; }
  .delay.on { color: var(--ok); }
  .delay.late { color: var(--late); }
  .delay.very { color: var(--bad); }
  .table-wrap { overflow-x: auto; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat b { font-family: var(--display); font-size: 26px; display: block; line-height: 1; }
  .stat span { font-size: 13px; color: var(--muted); }

  /* ---- settings */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; padding: 0 28px 40px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-size: 20px; }
  .card p { margin: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .kv { font-size: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--paper); padding: 1px 5px; border-radius: 3px; }
  .stack-form { display: flex; flex-direction: column; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wide-card { grid-column: 1 / -1; }
  .wide-card > form, .wide-card > p, .wide-card > .row, .wide-card > #invite-result { max-width: 760px; }
  #invite-result { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  #invite-result p { margin: 0; }
  table.grid td .btn { padding: 5px 10px; font-size: 14px; }
  .templates .list { max-height: none; }
  .editor { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .editor textarea { width: 100%; min-height: 560px; font: 12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 12px; tab-size: 2; }
  .editor .preview { height: 560px; }
  @media (max-width: 1100px) { .editor { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 4px; font-size: 14px; z-index: 10; max-width: calc(100vw - 32px); }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; gap: 6px; }
    .rail-brand { padding: 0 12px 0 0; }
    .rail-brand span { display: none; }
    .rail nav { flex-direction: row; }
    .rail nav a { padding: 6px 10px; border-left: 0; border-bottom: 3px solid transparent; gap: 6px; }
    .rail nav a[aria-current="page"] { border-bottom-color: var(--amber); }
    .rail-foot { margin: 0 0 0 auto; padding: 0; }
    .rail-foot .who { display: none; }
    .split { grid-template-columns: 1fr; }
    .list { max-height: none; border-right: 0; }
    .split.has-detail .list { display: none; }
    .split:not(.has-detail) .detail { display: none; }
    .page-head, .detail, .section { padding-left: 16px; padding-right: 16px; }
    .cards { padding: 0 16px 32px; grid-template-columns: 1fr; }
  }
  .back { display: none; }
  @media (max-width: 900px) { .back { display: inline-flex; margin-bottom: 12px; } }
</style>
</head>
<body>
<aside class="rail">
  <div class="rail-brand"><strong>emhub</strong><span>testEM operations</span></div>
  <nav>
    <a href="#bugs" data-nav="bugs">Bugs <span class="count" id="count-new" hidden></span></a>
    <a href="#ideas" data-nav="ideas">Suggestions <span class="count" id="count-ideas" hidden></span></a>
    <a href="#community" data-nav="community">Community</a>
    <a href="#timetable" data-nav="timetable">Timetable</a>
    <a href="#site" data-nav="site">Website</a>
    <a href="#settings" data-nav="settings">Settings</a>
  </nav>
  <div class="rail-foot">
    <div class="who">Signed in as <strong id="me-name"></strong></div>
    <form method="post" action="/auth/logout"><button type="submit">Sign out</button></form>
  </div>
</aside>
<main id="view"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = $("#view");
const STATUSES = ["new", "triaged", "in_progress", "resolved", "closed"];
const label = (s) => s.replace("_", " ").replace(/^./, (c) => c.toUpperCase());
let me = null;
let bugFilter = { status: "open", q: "" };

async function api(path, body) {
  const res = await fetch("/admin/api/" + path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (res.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

function toast(text) {
  const el = $("#toast");
  el.textContent = text; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3500);
}

function ago(seconds) {
  const d = Math.max(0, Date.now() / 1000 - seconds);
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + " min ago";
  if (d < 86400) return Math.floor(d / 3600) + " h ago";
  return new Date(seconds * 1000).toLocaleDateString();
}
const when = (s) => new Date(s * 1000).toLocaleString();

function delayText(sec) {
  if (sec == null) return { text: "–", cls: "" };
  const m = Math.round(sec / 60);
  if (m <= 0 && m >= -1) return { text: m < 0 ? m + " min" : "on time", cls: "on" };
  if (m < 0) return { text: m + " min", cls: "on" };
  return { text: "+" + m + " min", cls: m >= 10 ? "very" : "late" };
}

// ------------------------------------------------------------------ router

async function route() {
  const [page, arg] = location.hash.slice(1).split("/");
  document.querySelectorAll("[data-nav]").forEach((a) =>
    a.setAttribute("aria-current", (a.dataset.nav === ({ bug: "bugs", idea: "ideas", templates: "settings" }[page] || page || "bugs")) ? "page" : "false"));
  try {
    if (page === "community") return await renderCommunity(arg);
    if (page === "timetable") return await renderTimetable();
    if (page === "settings") return await renderSettings(arg);
    if (page === "templates") return await renderTemplates(arg);
    if (page === "site") return await renderSite(arg);
    if (page === "ideas" || page === "idea") return await renderBugs(page === "idea" ? Number(arg) : null, "feature");
    return await renderBugs(page === "bug" ? Number(arg) : null, "bug");
  } catch (e) {
    if (e.message !== "signed out") view.innerHTML = `<div class="empty"><h2>Couldn't load this page</h2><p>${esc(e.message)}</p></div>`;
  }
}
addEventListener("hashchange", route);

async function refreshCounts() {
  const s = await api("stats");
  const n = s.bugs.new || 0;
  const el = $("#count-new");
  el.textContent = n; el.hidden = !n;
  const ideas = $("#count-ideas"), i = (s.ideas || {}).new || 0;
  ideas.textContent = i; ideas.hidden = !i;
  return s;
}

// ------------------------------------------------------------------ bugs

// kind: "bug" (Bugs) or "feature" (Suggestions); both are reports with the same detail view.
async function renderBugs(selectedId, kind = "bug") {
  const ideas = kind === "feature";
  const params = new URLSearchParams({ kind });
  if (bugFilter.status !== "all") params.set("status", bugFilter.status);
  if (bugFilter.q) params.set("q", bugFilter.q);
  const [bugs] = await Promise.all([api("bugs?" + params), refreshCounts()]);
  const filters = [["open", "Open"], ...STATUSES.map((s) => [s, label(s)]), ["all", "All"]];
  view.innerHTML = `
    <div class="page-head"><h1>${ideas ? "Suggestions" : "Bugs"}</h1><span class="muted small">${bugs.length} shown</span></div>
    <div class="split ${selectedId ? "has-detail" : ""}">
      <div class="list">
        <div class="filters">
          ${filters.map(([v, l]) => `<button type="button" data-status="${v}" aria-pressed="${bugFilter.status === v}">${l}</button>`).join("")}
          <input class="input" type="search" placeholder="Search title, text, name or email" value="${esc(bugFilter.q)}" aria-label="Search bugs">
        </div>
        ${bugs.length ? bugs.map((b) => `
          <a class="bug-row" href="#${ideas ? "idea" : "bug"}/${b.id}" aria-current="${b.id === selectedId}">
            <span class="plate">${b.code}</span>
            <span class="t">${esc(b.title)}</span>
            <span class="m"><span class="status ${b.status}">${label(b.status)}</span><span>${esc(b.category)}</span><span>${esc(b.platform)}</span><span>${ago(b.updated_at)}</span></span>
          </a>`).join("") : `<div class="empty"><h2>No ${ideas ? "suggestions" : "reports"} here</h2><p>${ideas ? "Feature ideas" : "Reports"} sent from the app and the web version appear in this list. Try another filter.</p></div>`}
      </div>
      <section class="detail" id="detail">${selectedId ? "" : `<div class="empty"><h2>Pick a report</h2><p>Select ${ideas ? "a suggestion" : "a bug"} on the left to read it${ideas ? "" : ", look at the logs"} and reply to the reporter.</p></div>`}</section>
    </div>`;
  view.querySelectorAll("[data-status]").forEach((b) => b.onclick = () => { bugFilter.status = b.dataset.status; renderBugs(selectedId, kind); });
  const search = $(".filters input", view);
  search.oninput = () => { clearTimeout(search.t); search.t = setTimeout(() => { bugFilter.q = search.value.trim(); renderBugs(selectedId, kind).then(() => { const s = $(".filters input"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }); }, 300); };
  if (selectedId) await renderBug(selectedId);
}

function highlightLogs(text, needle) {
  return text.split("\n").filter((l) => !needle || l.toLowerCase().includes(needle.toLowerCase())).map((line) => {
    let h = esc(line);
    if (needle) h = h.replace(new RegExp(esc(needle).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
    const cls = /\bE\/|\bERROR\b|Exception|FATAL/.test(line) ? "e" : /\bW\/|\bWARN/.test(line) ? "w" : "";
    return cls ? `<span class="${cls}">${h}</span>` : h;
  }).join("\n");
}

async function renderBug(id) {
  const bug = await api("bugs/" + id);
  const detail = $("#detail");
  const mailNote = (m) => m.mail_status ? `<span class="${m.mail_status.startsWith("failed") ? "mail-failed" : ""}">email ${esc(m.mail_status)}</span>` : "";
  const kindLabel = { reply: "Reply to reporter", note: "Internal note", status: "Status change", system: "System" };
  detail.innerHTML = `
    <a class="btn quiet back" href="#${bug.kind === "feature" ? "ideas" : "bugs"}">Back to list</a>
    <div class="detail-head"><span class="plate big">${bug.code}</span><h2>${esc(bug.title)}</h2></div>
    <dl class="meta">
      <div><dt>Reporter</dt><dd>${esc(bug.name || "No name given")}</dd></div>
      <div><dt>Email</dt><dd>${bug.email ? `<a href="mailto:${esc(bug.email)}">${esc(bug.email)}</a>` : "No email given"}</dd></div>
      <div><dt>Platform</dt><dd>${esc(bug.platform)} ${esc(bug.app_version)}</dd></div>
      <div><dt>Device</dt><dd>${esc(bug.device || "Unknown")}</dd></div>
      <div><dt>Category</dt><dd>${esc(bug.category)}</dd></div>
      <div><dt>Sent</dt><dd>${when(bug.created_at)}</dd></div>
      <div><dt>Consent given</dt><dd>${when(bug.consent_at)}</dd></div>
    </dl>
    <div class="status-bar">
      <label class="field" style="flex-direction:row;align-items:center;gap:8px">Status
        <select id="status">${STATUSES.map((s) => `<option value="${s}" ${s === bug.status ? "selected" : ""}>${label(s)}</option>`).join("")}</select>
      </label>
      <label class="small" ${bug.email ? "" : "hidden"}><input type="checkbox" id="notify" checked> Email the reporter about status changes</label>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="report">Report</button>
      <button role="tab" aria-selected="false" data-tab="logs">Logs (${bug.logs ? bug.logs.split("\n").length : 0} lines)</button>
    </div>
    <div data-panel="report"><p class="desc">${esc(bug.description)}</p></div>
    <div data-panel="logs" hidden>
      ${bug.logs ? `<div class="logs-tools"><input class="input" id="log-filter" type="search" placeholder="Filter lines" style="flex:1"><button class="btn quiet" id="log-dl" type="button">Download</button></div><div class="logs" id="logs"></div>` : `<p class="muted">No logs were attached.</p>`}
    </div>
    <ol class="thread">${bug.messages.map((m) => `
      <li class="msg ${m.kind}"><header><span>${kindLabel[m.kind] || m.kind}${m.author ? " by " + esc(m.author) : ""}</span><span>${mailNote(m)} ${ago(m.created_at)}</span></header><p>${esc(m.body)}</p></li>`).join("")}
    </ol>
    <div class="composer">
      <label class="field">${bug.email ? "Reply to " + esc(bug.name || bug.email) : "Internal note (the reporter left no email)"}
        <textarea id="body" rows="6" placeholder="${bug.email ? "Write to the reporter. It goes out as a formatted email with the bug id." : "Only admins see notes."}"></textarea>
      </label>
      <div class="composer-actions">
        ${bug.email ? `<button class="btn" id="send" type="button">Send reply</button>
        <label class="small">and set status to <select id="reply-status">${STATUSES.map((s) => `<option value="${s}" ${s === bug.status ? "selected" : ""}>${label(s)}</option>`).join("")}</select></label>
        <button class="btn quiet" id="preview" type="button">Preview email</button>` : ""}
        <button class="btn quiet" id="note" type="button">Add internal note</button>
      </div>
      <iframe class="preview" id="preview-frame" title="Email preview" sandbox hidden></iframe>
    </div>`;

  detail.querySelectorAll("[data-tab]").forEach((t) => t.onclick = () => {
    detail.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", x === t));
    detail.querySelectorAll("[data-panel]").forEach((p) => p.hidden = p.dataset.panel !== t.dataset.tab);
  });
  if (bug.logs) {
    const logs = $("#logs"), filter = $("#log-filter");
    const paint = () => logs.innerHTML = highlightLogs(bug.logs, filter.value.trim());
    filter.oninput = paint; paint();
    $("#log-dl").onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([bug.logs], { type: "text/plain" }));
      a.download = bug.code + "-logs.txt"; a.click();
    };
  }
  $("#status").onchange = async (e) => {
    await api(`bugs/${id}/status`, { status: e.target.value, notify: $("#notify")?.checked });
    toast("Status set to " + label(e.target.value)); renderBugs(id, bug.kind);
  };
  const body = $("#body");
  const act = (btn, fn) => btn && (btn.onclick = async () => {
    if (!body.value.trim()) { body.focus(); return toast("Write something first"); }
    btn.disabled = true;
    try { await fn(); } catch (e) { toast(e.message); } finally { btn.disabled = false; }
  });
  act($("#send"), async () => {
    await api(`bugs/${id}/reply`, { body: body.value, status: $("#reply-status").value });
    toast("Reply sent to " + bug.email); renderBugs(id, bug.kind);
  });
  act($("#note"), async () => { await api(`bugs/${id}/note`, { body: body.value }); toast("Note added"); renderBugs(id, bug.kind); });
  act($("#preview"), async () => {
    const { html } = await api("preview", { bugId: id, body: body.value });
    const frame = $("#preview-frame"); frame.srcdoc = html; frame.hidden = false;
  });
}

// ------------------------------------------------------------------ community

function tripParts(key) {
  // City/regional buses from sadzv: sadzv|lineId|trip|date|line; planner trips: line|first stop|first departure (ms)
  const parts = key.split("|");
  if (parts[0] === "sadzv") return { line: parts[4] || "", first: "trip " + parts[2], start: parts[3] };
  const [line, first, ms] = parts;
  const t = Number(ms);
  return { line, first, start: t ? new Date(t).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "" };
}
const kindLabel = { gps: "rider's phone", departed: "left the stop (phone)", passed: "drove past (phone)", arrival: "at the stop", position: "tap" };
const dayTypeLabel = { workday: "workdays", saturday: "Saturdays", sunday: "Sundays" };
// Which buses the table shows: the last 6 hours (no day) or any day, optionally one line.
let communityFilter = { day: "", line: "" };

async function renderCommunity(selected) {
  const params = new URLSearchParams(Object.entries(communityFilter).filter(([, v]) => v));
  const [trips, stats] = await Promise.all([api("community/trips" + (params.size ? "?" + params : "")), refreshCounts()]);
  const selectedKey = selected ? decodeURIComponent(selected) : "";
  const reports = await api("community/reports" + (selectedKey ? "?trip=" + encodeURIComponent(selectedKey) : ""));
  view.innerHTML = `
    <div class="page-head"><h1>Community</h1>
      <div class="stats">
        <div class="stat"><b>${stats.activeTrips}</b><span>buses with live reports</span></div>
        <div class="stat"><b>${stats.reportsToday}</b><span>reports in 24 h</span></div>
      </div>
    </div>
    <div class="section">
      <p class="muted" style="max-width:75ch;margin:0 0 14px">Riders who opted in say where their bus really is: with buttons on the follow notification, or automatically from their phone while riding (only the stop is sent). Phones on the bus from the last 3 minutes beat taps. Each rider counts once per bus; the newest reports weigh most, and reports far from the rest are ignored.</p>
      <h2>${communityFilter.day ? "Buses on " + esc(communityFilter.day) : "Buses in the last 6 hours"}${communityFilter.line ? ", line " + esc(communityFilter.line) : ""}</h2>
      <form class="row" id="c-filter" style="gap:8px;margin:0 0 12px;flex-wrap:wrap">
        <label>Day <input type="date" name="day" value="${esc(communityFilter.day)}"></label>
        <label>Line <input name="line" size="6" value="${esc(communityFilter.line)}" placeholder="all"></label>
        <button class="btn" type="submit">Show</button>
        ${communityFilter.day || communityFilter.line ? '<button class="btn quiet" type="button" id="c-reset">Last 6 hours</button>' : ""}
      </form>
      ${trips.length ? `<div class="table-wrap"><table class="grid">
        <thead><tr><th>Line</th><th>Trip</th><th>Delay now</th><th>Last reported</th><th>Worst</th><th>Usually</th><th>Riders</th><th>Source</th><th>Last report</th></tr></thead>
        <tbody>${trips.map((t) => {
          const p = tripParts(t.trip_key), d = delayText(t.delay?.delaySeconds), l = delayText(t.last_delay), w = delayText(t.max_delay);
          const h = t.history, u = h ? delayText(h.delaySeconds) : null;
          return `<tr class="click" data-trip="${esc(t.trip_key)}" aria-selected="${t.trip_key === selectedKey}" tabindex="0">
            <td><span class="plate line">${esc(t.line || p.line)}</span></td>
            <td>${esc(p.first)}<div class="muted small">departs ${esc(p.start)}</div></td>
            <td>${t.delay ? `<span class="delay ${d.cls}">${d.text}</span>` : '<span class="muted">–</span>'}</td>
            <td><span class="delay ${l.cls}">${l.text}</span><div class="muted small">at ${esc(t.last_stop || "–")}</div></td>
            <td><span class="delay ${w.cls}">${w.text}</span></td>
            <td>${h ? `<span class="delay ${u.cls}">${u.text}</span><div class="muted small">late ${h.lateRuns} of ${h.runs} ${dayTypeLabel[h.dayType] || ""}</div>` : '<span class="muted">–</span>'}</td>
            <td>${t.riders} <span class="muted small">(${t.n} reports)</span></td>
            <td>${t.delay ? (t.delay.source === "gps" ? "riders' phones" : "taps") : '<span class="muted">–</span>'}</td>
            <td>${ago(t.last)}</td></tr>`;
        }).join("")}</tbody></table></div>`
        : `<div class="empty" style="padding:20px 0"><h2>No reports${communityFilter.day ? " that day" : " yet"}</h2><p>When riders share where their bus is (buttons or their phone), the bus shows up here with its delay.</p></div>`}
    </div>
    <div class="section">
      <h2>${selectedKey ? "Reports for this bus" : "Latest reports"}</h2>
      ${selectedKey ? `<p><a href="#community">Show all reports</a></p>` : ""}
      ${reports.length ? `<div class="table-wrap"><table class="grid">
        <thead><tr><th>When</th><th>Line</th><th>Stop</th><th>Delay</th><th>Type</th><th>Rider</th><th>From</th><th></th></tr></thead>
        <tbody>${reports.map((r) => {
          const d = delayText(r.delay_s);
          return `<tr><td>${ago(r.created_at)}</td><td><span class="plate line">${esc(r.line)}</span></td>
            <td>${esc(r.stop_name)} <span class="muted small">#${r.stop_index + 1}</span></td>
            <td><span class="delay ${d.cls}">${d.text}</span></td>
            <td>${esc(kindLabel[r.kind] || r.kind || "tap")}</td>
            <td><code title="Random id, new for every followed bus">${esc(r.reporter.slice(0, 8))}</code>${r.blocked ? ' <span class="error-text small">blocked</span>' : ""}</td>
            <td>${esc(r.platform)}</td>
            <td class="row"><button class="btn quiet" data-del="${r.id}" type="button">Delete</button>
              <button class="btn danger" data-block="${esc(r.reporter)}" data-unblock="${r.blocked ? 1 : ""}" type="button">${r.blocked ? "Unblock" : "Block rider"}</button></td></tr>`;
        }).join("")}</tbody></table></div>` : `<p class="muted">No reports.</p>`}
    </div>`;
  $("#c-filter").onsubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    communityFilter = { day: f.get("day") || "", line: (f.get("line") || "").trim() };
    renderCommunity(selected);
  };
  $("#c-reset") && ($("#c-reset").onclick = () => { communityFilter = { day: "", line: "" }; renderCommunity(selected); });
  view.querySelectorAll("[data-trip]").forEach((tr) => {
    const go = () => location.hash = "community/" + encodeURIComponent(tr.dataset.trip);
    tr.onclick = go; tr.onkeydown = (e) => e.key === "Enter" && go();
  });
  view.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    await api("community/delete", { id: Number(b.dataset.del) }); toast("Report deleted"); renderCommunity(selected);
  });
  view.querySelectorAll("[data-block]").forEach((b) => b.onclick = async () => {
    await api("community/block", { reporter: b.dataset.block, unblock: !!b.dataset.unblock });
    toast(b.dataset.unblock ? "Rider unblocked" : "Rider blocked; their reports no longer count"); renderCommunity(selected);
  });
}

// ------------------------------------------------------------------ timetable

const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const dayClock = (ms) => new Date(ms).toLocaleString([], { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
const localInput = (d = new Date()) => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const kb = (n) => n == null ? "–" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " kB";
const epochOf = (v) => Math.floor(new Date(v || Date.now()).getTime() / 1000);
let ttPoll = null;

async function renderTimetable() {
  clearTimeout(ttPoll);
  const st = await api("timetable/status");
  if (location.hash.slice(1).split("/")[0] !== "timetable") return;
  const feeds = Object.entries(st.feeds);
  view.innerHTML = `
    <div class="page-head"><h1>Timetable</h1>
      <div class="stats">
        <div class="stat"><b>${st.trips.toLocaleString()}</b><span>trips</span></div>
        <div class="stat"><b>${st.stations.toLocaleString()}</b><span>stations</span></div>
        <div class="stat"><b>${st.builtAt ? ago(st.builtAt) : "–"}</b><span>${st.busy ? "updating now…" : "last built"}</span></div>
      </div>
      <button class="btn" id="tt-update" type="button" ${st.busy ? "disabled" : ""}>Update now</button>
    </div>
    <div class="section">
      <p class="muted" style="max-width:80ch;margin:0 0 14px">The app's planner, other carriers on the boards and bus stop lists come from these GTFS feeds
        (<code>${esc(st.source)}</code>). Every night at 04:30 changed feeds are downloaded and the timetable is rebuilt;
        a feed that fails to download keeps its previous file. The app asks <code>/api/v1/timetable/…</code> with its app key.</p>
      <h2>Search</h2>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="stops" aria-selected="true">Stops and departures</button>
        <button type="button" role="tab" data-tab="plan" aria-selected="false">Connections</button>
      </div>
      <div id="tt-stops">
        <form class="row" id="tt-stop-form" style="gap:8px;margin-bottom:10px">
          <input class="input" name="q" placeholder="Stop, e.g. zvol zla po kon or bb as" autocomplete="off" style="flex:1 1 280px">
          <label>From <input type="datetime-local" name="time" value="${localInput()}"></label>
        </form>
        <div id="tt-stop-list"></div>
        <div id="tt-board"></div>
      </div>
      <div id="tt-plan" hidden>
        <form class="row" id="tt-plan-form" style="gap:8px;margin-bottom:10px;flex-wrap:wrap">
          <input class="input" name="from" placeholder="From" required style="flex:1 1 200px">
          <input class="input" name="to" placeholder="To" required style="flex:1 1 200px">
          <input type="datetime-local" name="time" value="${localInput()}">
          <label class="small"><input type="checkbox" name="direct"> Direct only</label>
          <button class="btn" type="submit">Search</button>
        </form>
        <div id="tt-plan-out"></div>
      </div>
      <div id="tt-trip"></div>
    </div>
    <div class="section">
      <h2>Feeds</h2>
      <div class="table-wrap"><table class="grid">
        <thead><tr><th>Feed</th><th>Trips loaded</th><th>File</th><th>File date</th><th>Last download</th></tr></thead>
        <tbody>${feeds.map(([name, f]) => `<tr><td><code>${esc(name)}</code></td>
          <td>${f.trips === "failed" ? '<span class="error-text">failed to read</span>' : f.trips == null ? '<span class="muted">not loaded</span>' : f.trips.toLocaleString()}</td>
          <td>${kb(f.size)}</td><td>${f.modified ? when(f.modified) : '<span class="muted">missing</span>'}</td>
          <td>${f.result ? esc(f.result) + ` <span class="muted small">${ago(f.at)}</span>` : '<span class="muted">not since start</span>'}</td></tr>`).join("")}</tbody>
      </table></div>
      <form class="stack-form" id="tt-feeds" style="max-width:760px;margin-top:14px">
        <label class="field">Feeds to load (names from transiq, comma-separated; add <code>zsr</code> for trains)
          <textarea class="input" name="feeds" rows="3">${esc(st.feedList)}</textarea></label>
        <div class="row"><button class="btn" type="submit">Save and update</button></div>
      </form>
    </div>
    <div class="section">
      <h2>Log</h2>
      <div class="logs" style="max-height:340px">${st.log.length ? st.log.map((l) => `${esc(when(l.at))}  ${esc(l.text)}`).join("\n") : "Nothing yet."}</div>
    </div>`;
  if (st.busy) ttPoll = setTimeout(renderTimetable, 3000);
  $("#tt-update").onclick = run($("#tt-update"), async () => {
    await api("timetable/update", {}); toast("Update started"); setTimeout(renderTimetable, 1500);
  });
  $("#tt-feeds").onsubmit = (e) => run(e.submitter, async () => {
    await api("timetable/feeds", { feeds: new FormData(e.target).get("feeds") }); toast("Saved; updating"); setTimeout(renderTimetable, 1500);
  })(e);
  view.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
    view.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", x === b));
    $("#tt-stops").hidden = b.dataset.tab !== "stops";
    $("#tt-plan").hidden = b.dataset.tab !== "plan";
  });
  const stopForm = $("#tt-stop-form");
  const bindTrips = () => view.querySelectorAll("[data-trip]").forEach((el) => {
    const open = () => showTrip(el.dataset.trip).catch((err) => toast(err.message));
    el.onclick = open; el.onkeydown = (e) => e.key === "Enter" && open();
  });
  const board = async (id, name) => {
    const r = await api(`timetable/departures?stop=${encodeURIComponent(id)}&n=40&time=${epochOf(new FormData(stopForm).get("time"))}`);
    const s = r.stops[0] || {};
    $("#tt-board").innerHTML = `<h3 style="margin:6px 0">${esc(name)} <span class="muted small">${s.lat != null ? s.lat.toFixed(5) + ", " + s.lon.toFixed(5) : "no position"} · id <code>${esc(id)}</code></span></h3>
      ${r.departures.length ? `<div class="table-wrap"><table class="grid"><thead><tr><th>Departs</th><th>Line</th><th>To</th><th>Operator</th><th>Feed</th></tr></thead>
      <tbody>${r.departures.map((d) => `<tr class="click" data-trip="${esc(d.tripId)}" tabindex="0"><td>${dayClock(d.at)}</td>
        <td><span class="plate line">${esc(d.line)}</span></td><td>${esc(d.headsign)}</td><td>${esc(d.operator)}</td><td><code>${esc(d.feed)}</code></td></tr>`).join("")}</tbody></table></div>`
        : '<p class="muted">No departures after this time.</p>'}`;
    bindTrips();
  };
  const search = async () => {
    const q = new FormData(stopForm).get("q").trim();
    if (!q) { $("#tt-stop-list").innerHTML = ""; return; }
    const r = await api("timetable/stops?q=" + encodeURIComponent(q));
    $("#tt-stop-list").innerHTML = r.stops.length ? `<div class="row" style="gap:6px;margin-bottom:12px">${r.stops.map((s) =>
      `<button class="btn quiet" type="button" data-stop="${esc(s.id)}">${esc(s.name)}</button>`).join("")}</div>` : '<p class="muted">No stop matches.</p>';
    view.querySelectorAll("[data-stop]").forEach((b) => b.onclick = () => board(b.dataset.stop, b.textContent).catch((err) => toast(err.message)));
  };
  let timer;
  stopForm.oninput = () => { clearTimeout(timer); timer = setTimeout(() => search().catch((err) => toast(err.message)), 200); };
  stopForm.onsubmit = (e) => e.preventDefault();
  $("#tt-plan-form").onsubmit = (e) => run(e.submitter, async () => {
    const f = new FormData(e.target);
    const q = new URLSearchParams({ from: f.get("from"), to: f.get("to"), time: epochOf(f.get("time")), n: 6, direct: f.get("direct") ? 1 : 0 });
    const r = await api("timetable/plan?" + q);
    $("#tt-plan-out").innerHTML = `<p class="muted small">${esc(r.from.name)} → ${esc(r.to.name)}</p>` + (r.connections.length ? r.connections.map((c) => `
      <div class="card" style="margin-bottom:10px"><div><strong>${dayClock(c.departure)} → ${clock(c.arrival)}</strong>
        <span class="muted small">${Math.round((c.arrival - c.departure) / 60000)} min</span></div>
        ${c.legs.map((l) => l.type === "walk"
          ? `<div class="muted small">walk ${esc(l.from.name)} → ${esc(l.to.name)}, ${Math.round((l.arrival - l.departure) / 60000)} min</div>`
          : `<div data-trip="${esc(l.tripId)}" tabindex="0" style="cursor:pointer"><span class="plate line">${esc(l.line)}</span>
             ${clock(l.departure)} ${esc(l.from.name)} → ${clock(l.arrival)} ${esc(l.to.name)} <span class="muted small">${esc(l.operator)}</span></div>`).join("")}
      </div>`).join("") : '<p class="muted">No connection found in the next two days.</p>');
    bindTrips();
  })(e);
}

async function showTrip(id) {
  const t = await api("timetable/trip?id=" + encodeURIComponent(id));
  const box = $("#tt-trip");
  box.innerHTML = `<h3 style="margin:18px 0 6px"><span class="plate line">${esc(t.line)}</span> to ${esc(t.headsign)}
      <span class="muted small">${esc(t.operator)} · <code>${esc(id)}</code></span></h3>
    <div class="table-wrap"><table class="grid"><thead><tr><th>#</th><th>Stop</th><th>Arrives</th><th>Departs</th><th>Position</th></tr></thead>
    <tbody>${t.stops.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)}</td><td>${clock(s.arrival)}</td><td>${clock(s.departure)}</td>
      <td class="small">${s.lat != null ? `<a href="https://www.openstreetmap.org/?mlat=${s.lat}&mlon=${s.lon}#map=17/${s.lat}/${s.lon}" target="_blank" rel="noopener">${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}</a>` : '<span class="muted">unknown</span>'}</td></tr>`).join("")}</tbody></table></div>`;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ------------------------------------------------------------------ settings

const run = (btn, fn) => async (e) => {
  e?.preventDefault();
  btn.disabled = true;
  try { await fn(); } catch (err) { toast(err.message); } finally { btn.disabled = false; }
};
const field = (name, label, value, attrs = "") =>
  `<label class="field">${label}<input name="${name}" value="${esc(value)}" ${attrs}></label>`;
const secretField = (name, label, isSet) => `
  <label class="field">${label}<input name="${name}" type="password" autocomplete="new-password" placeholder="${isSet ? "Saved. Leave blank to keep it" : "Not set"}"></label>
  ${isSet ? `<label class="small"><input type="checkbox" name="${name}_clear"> Remove the saved value</label>` : ""}`;

/** Invite link for when the email didn't go out. */
function showInviteLink(r, who) {
  const box = $("#invite-result");
  box.hidden = false;
  box.innerHTML = r.mailError
    ? `<p class="error-text">The invitation email to ${esc(who)} didn't go out: ${esc(r.mailError)}</p>
       <p class="small">Send them this one-time link yourself. It works for 72 hours.</p>
       <div class="row"><input class="input" readonly value="${esc(r.link)}" style="flex:1" id="invite-link"><button class="btn quiet" type="button" id="copy-link">Copy</button></div>`
    : `<p>Invitation sent to ${esc(who)}. The link works once, for 72 hours.</p>`;
  const copy = $("#copy-link");
  if (copy) copy.onclick = () => { navigator.clipboard.writeText(r.link); toast("Link copied"); };
}

      <section class="card wide-card">
        <h2>Authentik (OpenID Connect)</h2>
        <p class="muted small">In Authentik, create an OAuth2/OpenID provider (confidential client) with this redirect URI, then paste its details here.</p>
        <div class="row"><input class="input" readonly value="${esc(cfg.redirect_uri)}" style="flex:1" aria-label="Redirect URI"><button class="btn quiet" type="button" id="copy-redirect">Copy</button></div>
        <form id="oidc-form" class="stack-form">
          ${field("oidc_issuer", "Issuer or OpenID Configuration URL", cfg.oidc_issuer, 'type="url" placeholder="https://auth.karafa.net/application/o/test-em/"')}
          ${field("oidc_client_id", "Client ID", cfg.oidc_client_id, 'autocomplete="off"')}
          ${secretField("oidc_client_secret", "Client secret", cfg.oidc_client_secret_set)}
          ${field("oidc_label", "Button name", cfg.oidc_label, 'placeholder="Authentik"')}
          <div class="row"><button class="btn" type="submit">Save Authentik settings</button><button class="btn quiet" type="button" id="test-oidc">Check connection</button></div>
        </form>
      </section>

      <section class="card wide-card">
        <h2>Email</h2>
        <form id="mail-form" class="stack-form">
          <div class="grid2">
            ${field("smtp_host", "SMTP server", cfg.smtp_host, 'placeholder="smtp.example.com" required')}
            ${field("smtp_port", "Port", cfg.smtp_port, 'inputmode="numeric" pattern="[0-9]+" required')}
            <label class="field">Security<select name="smtp_security">${["none", "starttls", "ssl"].map((v) => `<option value="${v}" ${cfg.smtp_security === v ? "selected" : ""}>${{ none: "None (port 25)", starttls: "STARTTLS (port 587)", ssl: "SSL/TLS (port 465)" }[v]}</option>`).join("")}</select></label>
            ${field("smtp_user", "Username", cfg.smtp_user, 'autocomplete="off"')}
          </div>
          ${secretField("smtp_pass", "Password", cfg.smtp_pass_set)}
          ${field("mail_from", "Sender", cfg.mail_from, 'placeholder="testEM &lt;noreply@karafa.network&gt;"')}
          ${field("mail_reply_to", "Replies go to (optional)", cfg.mail_reply_to, 'placeholder="support@karafa.network"')}
          ${field("admin_email", "New bug alerts go to (empty = every admin's email)", cfg.admin_email, 'placeholder="you@example.com"')}
          <div class="row"><button class="btn" type="submit">Save email settings</button><button class="btn quiet" id="test-mail" type="button">Send test email to me</button>
            <a class="btn quiet" href="#templates">Edit email templates</a></div>
        </form>
      </section>

    </div>`;

  $("#save-email").onclick = run($("#save-email"), async () => { await api("account/email", { email: $("#my-email").value.trim() }); toast("Email saved"); });
  const pw = $("#pw");
  pw.onsubmit = run($("button", pw), async () => { await api("account/password", Object.fromEntries(new FormData(pw))); pw.reset(); toast("Password changed. Other sessions were signed out."); });
  $("#unlink") && ($("#unlink").onclick = run($("#unlink"), async () => { await api("account/unlink", {}); toast("Authentik account unlinked"); renderSettings(); }));
  const only = $("#oidc-only");
  if (only) only.onchange = async () => {
    try {
      await api("account/oidc-only", { enabled: only.checked });
      toast(only.checked ? "From now on you sign in with " + me.oidcLabel + " only" : "Password sign-in is allowed again");
      renderSettings();
    } catch (e) { only.checked = !only.checked; toast(e.message); }
  };

  const add = $("#add-admin");
  add.onsubmit = run($("button", add), async () => {
    const data = Object.fromEntries(new FormData(add));
    const r = await api("admins", data);
    await renderSettings();
    showInviteLink(r, data.email);
  });
  view.querySelectorAll("[data-resend]").forEach((b) => b.onclick = run(b, async () => {
    const r = await api(`admins/${b.dataset.resend}/resend`, {});
    await renderSettings();
    showInviteLink(r, b.dataset.email);
  }));
  view.querySelectorAll("[data-remove]").forEach((b) => b.onclick = run(b, async () => {
    if (!confirm(`Remove ${b.dataset.name}? They lose access right away.`)) return;
    await api(`admins/${b.dataset.remove}/remove`, {});
    toast(b.dataset.name + " removed");
    renderSettings();
  }));

  $("#copy-redirect").onclick = () => { navigator.clipboard.writeText(cfg.redirect_uri); toast("Redirect URI copied"); };
  const saveForm = (form, message) => form.onsubmit = run($("button[type=submit]", form), async () => {
    const data = Object.fromEntries(new FormData(form));
    for (const k of Object.keys(data)) if (k.endsWith("_clear")) data[k] = true;
    await api("settings", data);
    toast(message);
    renderSettings();
  });
  saveForm($("#oidc-form"), "Authentik settings saved");
  saveForm($("#mail-form"), "Email settings saved");
  $("#test-oidc").onclick = run($("#test-oidc"), async () => { const r = await api("settings/test-oidc", {}); toast("Connected to " + r.issuer); });
  $("#test-mail").onclick = run($("#test-mail"), async () => { const r = await api("mail/test", {}); toast("Test email sent to " + r.to); });
}

// ------------------------------------------------------------------ website pages

async function renderSite(selected) {
  const list = await api("site");
  const current = list.find((x) => `${x.name}.${x.lang}` === selected) || list[0];
  const key = `${current.name}/${current.lang}`;
  const page = await api("site/" + key);
  view.innerHTML = `
    <div class="page-head"><h1>Website</h1><span class="muted small">The public Plan&amp;Ride pages. Slovak at /…, English at /en/….</span></div>
    <div class="split templates">
      <div class="list">
        ${list.map((x) => `<a class="bug-row" href="#site/${x.name}.${x.lang}" aria-current="${x === current}">
          <span class="plate line">${x.lang.toUpperCase()}</span>
          <span class="t">${esc(x.label)}</span>
          <span class="m">${x.custom ? `Edited${x.updated_by ? " by " + esc(x.updated_by) : ""} ${ago(x.updated_at)}` : "Default"}</span></a>`).join("")}
      </div>
      <section class="detail">
        <h2 style="font-size:24px">${esc(current.label)} <span class="muted small">(${current.lang.toUpperCase()})</span></h2>
        <p class="muted small">The page content in HTML; the header, menu and footer are added around it.
          Useful: <code>&lt;h1&gt;</code> title, <code>&lt;h2&gt;</code>/<code>&lt;h3&gt;</code> sections, <code>&lt;p class="lead"&gt;</code> intro,
          <code>&lt;a class="btn"&gt;</code> button, <code>&lt;div class="features"&gt;&lt;div class="card"&gt;</code> feature cards.
          Live at <a href="${esc(current.url)}" target="_blank" rel="noopener">${esc(me.publicUrl + current.url)}</a>.</p>
        <div class="editor">
          <textarea id="tpl" spellcheck="false" aria-label="Page HTML">${esc(page.html)}</textarea>
          <iframe id="tpl-preview" class="preview" title="Preview" sandbox></iframe>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="tpl-save" type="button">Publish</button>
          <button class="btn danger" id="tpl-reset" type="button" ${current.custom ? "" : "disabled"}>Reset to default</button>
          <span class="muted small" id="tpl-state"></span>
        </div>
      </section>
    </div>`;
  const area = $("#tpl"), frame = $("#tpl-preview"), state = $("#tpl-state");
  const preview = async () => {
    try { frame.srcdoc = (await api(`site/${key}/preview`, { html: area.value })).html; } catch (e) { state.textContent = e.message; }
  };
  area.oninput = () => {
    state.textContent = area.value === page.html ? "" : "Unpublished changes";
    clearTimeout(area.t);
    area.t = setTimeout(preview, 400);
  };
  area.onkeydown = (e) => { // Tab indents instead of leaving the editor
    if (e.key !== "Tab" || e.shiftKey) return;
    e.preventDefault();
    area.setRangeText("  ", area.selectionStart, area.selectionEnd, "end");
    area.oninput();
  };
  const sel = `${current.name}.${current.lang}`;
  $("#tpl-save").onclick = run($("#tpl-save"), async () => { await api(`site/${key}/save`, { html: area.value }); toast("Page published"); renderSite(sel); });
  $("#tpl-reset").onclick = run($("#tpl-reset"), async () => {
    if (!confirm("Replace your edits with the default page?")) return;
    await api(`site/${key}/reset`, {});
    toast("Page reset");
    renderSite(sel);
  });
  preview();
}

// ------------------------------------------------------------------ email templates

async function renderTemplates(selected) {
  const list = await api("templates");
  const name = list.some((x) => x.name === selected) ? selected : list[0].name;
  const current = list.find((x) => x.name === name);
  const tpl = await api("templates/" + name);
  document.querySelector('[data-nav="settings"]').setAttribute("aria-current", "page");
  view.innerHTML = `
    <div class="page-head"><h1>Email templates</h1><a href="#settings" class="small">Back to settings</a></div>
    <div class="split templates">
      <div class="list">
        ${list.map((x) => `<a class="bug-row" href="#templates/${x.name}" aria-current="${x.name === name}">
          <span class="t" style="grid-column:1/-1">${esc(x.label)}</span>
          <span class="m" style="grid-column:1/-1">${x.custom ? `Edited${x.updated_by ? " by " + esc(x.updated_by) : ""} ${ago(x.updated_at)}` : "Default"}</span></a>`).join("")}
      </div>
      <section class="detail">
        <h2 style="font-size:24px">${esc(current.label)}</h2>
        <p class="muted small">Placeholders: ${current.placeholders.map((p) => `<code>${p.endsWith("_html") ? "{{{" + p + "}}}" : "{{" + p + "}}"}</code>`).join(" ")}.
          <code>{{x}}</code> inserts text safely; <code>{{{x}}}</code> inserts prepared HTML (only for the <code>_html</code> values). Keep styles inline; many email apps drop <code>&lt;style&gt;</code>.</p>
        <div class="editor">
          <textarea id="tpl" spellcheck="false" aria-label="Template HTML">${esc(tpl.html)}</textarea>
          <iframe id="tpl-preview" class="preview" title="Preview with sample values" sandbox></iframe>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="tpl-save" type="button">Save template</button>
          <button class="btn danger" id="tpl-reset" type="button" ${current.custom ? "" : "disabled"}>Reset to default</button>
          <span class="muted small" id="tpl-state"></span>
        </div>
      </section>
    </div>`;
  const area = $("#tpl"), frame = $("#tpl-preview"), state = $("#tpl-state");
  const preview = async () => {
    try { frame.srcdoc = (await api(`templates/${name}/preview`, { html: area.value })).html; } catch (e) { state.textContent = e.message; }
  };
  area.oninput = () => {
    state.textContent = area.value === tpl.html ? "" : "Unsaved changes";
    clearTimeout(area.t);
    area.t = setTimeout(preview, 400);
  };
  area.onkeydown = (e) => { // Tab indents instead of leaving the editor
    if (e.key !== "Tab" || e.shiftKey) return;
    e.preventDefault();
    area.setRangeText("  ", area.selectionStart, area.selectionEnd, "end");
    area.oninput();
  };
  $("#tpl-save").onclick = run($("#tpl-save"), async () => { await api(`templates/${name}/save`, { html: area.value }); toast("Template saved"); renderTemplates(name); });
  $("#tpl-reset").onclick = run($("#tpl-reset"), async () => {
    if (!confirm("Replace your edits with the default template?")) return;
    await api(`templates/${name}/reset`, {});
    toast("Template reset");
    renderTemplates(name);
  });
  preview();
}

api("me").then((m) => { me = m; $("#me-name").textContent = m.username; route(); liveUpdates(); });

// New bug reports and rider reports appear without reloading. While you type (a reply,
// a filter) the page is left alone and only the counters update.
function liveUpdates() {
  const events = new EventSource("/admin/api/events");
  let timer;
  const changed = (kind) => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const page = location.hash.slice(1).split("/")[0] || "bugs";
      const shown = kind === "community" ? page === "community" : ["bugs", "bug", "ideas", "idea"].includes(page);
      const typing = document.activeElement?.matches("input, textarea, select") ||
        [...document.querySelectorAll("textarea")].some((t) => t.value.trim());
      if (shown && !typing) {
        const y = scrollY;
        route().then(() => scrollTo(0, y));
      } else {
        refreshCounts();
        if (kind === "bugs") toast("New report");
      }
    }, 1000);
  };
  events.addEventListener("bugs", () => changed("bugs"));
  events.addEventListener("community", () => changed("community"));
}
