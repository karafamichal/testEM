<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emhub</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/brand.css">
<style>
  body { display: grid; grid-template-columns: 220px 1fr; min-height: 100dvh; }

  /* ---- rail */
  .rail { background: var(--rail); color: var(--rail-text); display: flex; flex-direction: column; padding: 20px 0 16px; position: sticky; top: 0; height: 100dvh; }
  .rail-brand { padding: 0 20px 18px; }
  .rail-brand strong { font-family: var(--display); font-size: 28px; color: #fff; display: block; line-height: 1; }
  .rail-brand span { font-size: 13px; }
  .rail nav { display: flex; flex-direction: column; }
  .rail nav a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 20px; color: inherit; text-decoration: none; font-weight: 500;
    border-left: 4px solid transparent;
  }
  .rail nav a:hover { color: #fff; background: rgba(255,255,255,0.04); }
  .rail nav a[aria-current="page"] { color: #fff; border-left-color: var(--amber); background: rgba(255,255,255,0.06); }
  .rail .count { font-family: var(--display); font-weight: 700; font-size: 14px; background: var(--amber); color: #14213D; border-radius: 3px; padding: 0 7px; }
  .rail-foot { margin-top: auto; padding: 0 20px; font-size: 13px; }
  .rail-foot button { background: none; border: 0; color: var(--rail-text); padding: 0; cursor: pointer; text-decoration: underline; }

  main { min-width: 0; }
  .page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 22px 28px 14px; }
  .page-head h1 { font-size: 30px; }

  /* ---- bugs */
  .split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; border-top: 1px solid var(--line); min-height: calc(100dvh - 76px); }
  .list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100dvh - 76px); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 1; }
  .filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 4px 10px; font-size: 14px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .filters input { flex: 1 1 100%; }
  .bug-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .bug-row:hover { background: var(--surface); }
  .bug-row[aria-current="true"] { background: var(--surface); box-shadow: inset 4px 0 0 var(--sign); }
  .bug-row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bug-row .m { grid-column: 2; font-size: 13px; color: var(--muted); display: flex; gap: 10px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--muted); }
  .status.new::before { background: var(--amber); }
  .status.triaged::before { background: var(--sign); }
  .status.in_progress::before { background: var(--late); }
  .status.resolved::before { background: var(--ok); }

  .detail { padding: 22px 28px 40px; min-width: 0; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; }
  .detail-head h2 { font-size: 26px; overflow-wrap: anywhere; }
  .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 20px; margin: 18px 0; padding: 14px 0; border-block: 1px solid var(--line); font-size: 14px; }
  .meta dt { color: var(--muted); font-size: 13px; }
  .meta dd { margin: 0; overflow-wrap: anywhere; }
  .status-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--sign); }
  .desc { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 75ch; }
  .logs-tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .logs { background: #0B1426; color: #D6E2F5; font: 12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 14px; border-radius: 4px; max-height: 480px; overflow: auto; white-space: pre; }
  .logs mark { background: var(--amber); color: #14213D; }
  .logs .e { color: #FF9A8C; }
  .logs .w { color: #FFD27A; }

  .thread { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-width: 75ch; }
  .msg { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 12px 14px; }
  .msg header { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .msg.reply { border-left: 4px solid var(--sign); }
  .msg.note { border-left: 4px solid var(--amber); background: color-mix(in srgb, var(--amber) 8%, var(--surface)); }
  .msg.system, .msg.status { background: transparent; border-style: dashed; font-size: 14px; }
  .msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mail-failed { color: var(--bad); }
  .composer { margin-top: 18px; max-width: 75ch; display: flex; flex-direction: column; gap: 10px; }
  .composer-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .preview { border: 1px solid var(--line); border-radius: 4px; width: 100%; height: 520px; background: #fff; }

  .empty { padding: 60px 28px; color: var(--muted); max-width: 48ch; }
  .empty h2 { color: var(--ink); margin-bottom: 6px; }

  /* ---- community */
  .section { padding: 0 28px 28px; }
  .section h2 { font-size: 20px; margin: 10px 0 10px; }
  table.grid { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
  table.grid th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  table.grid td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.grid tr.click { cursor: pointer; }
  table.grid tr.click:hover td { background: color-mix(in srgb, var(--sign) 5%, var(--surface)); }
  table.grid tr[aria-selected="true"] td { background: color-mix(in srgb, var(--sign) 10%, var(--surface)); }
  .delay { font-family: var(--display); font-weight: 700; font-size: 17px; }
  .delay.on { color: var(--ok); }
  .delay.late { color: var(--late); }
  .delay.very { color: var(--bad); }
  .table-wrap { overflow-x: auto; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat b { font-family: var(--display); font-size: 26px; display: block; line-height: 1; }
  .stat span { font-size: 13px; color: var(--muted); }

  /* ---- settings */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; padding: 0 28px 40px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-size: 20px; }
  .card p { margin: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .kv { font-size: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--paper); padding: 1px 5px; border-radius: 3px; }
  .stack-form { display: flex; flex-direction: column; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wide-card { grid-column: 1 / -1; }
  .wide-card > form, .wide-card > p, .wide-card > .row, .wide-card > #invite-result { max-width: 760px; }
  #invite-result { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  #invite-result p { margin: 0; }
  table.grid td .btn { padding: 5px 10px; font-size: 14px; }
  .templates .list { max-height: none; }
  .editor { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .editor textarea { width: 100%; min-height: 560px; font: 12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 12px; tab-size: 2; }
  .editor .preview { height: 560px; }
  @media (max-width: 1100px) { .editor { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 4px; font-size: 14px; z-index: 10; max-width: calc(100vw - 32px); }

  @media (max-width: 900px) {
    /* Phones: one column that never gets wider than the screen (EM: the rail made pages 564 px wide). */
    body { grid-template-columns: minmax(0, 1fr); }
    .rail { position: sticky; top: 0; z-index: 5; height: auto; display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 10px 14px 0; }
    .rail-brand { padding: 0; }
    .rail-brand strong { font-size: 22px; }
    .rail-brand span { display: none; }
    .rail nav { grid-column: 1 / -1; flex-direction: row; overflow-x: auto; scrollbar-width: none; margin: 6px -14px 0; padding: 0 6px; }
    .rail nav::-webkit-scrollbar { display: none; }
    .rail nav a { padding: 10px 10px 9px; border-left: 0; border-bottom: 3px solid transparent; gap: 6px; white-space: nowrap; flex: none; }
    .rail nav a[aria-current="page"] { border-bottom-color: var(--amber); }
    .rail-foot { margin: 0; padding: 0; grid-column: 2; grid-row: 1; }
    .rail-foot .who { display: none; }
    /* 16 px text fields: iPhones zoom into anything smaller and stay zoomed. */
    input, select, textarea { font-size: 16px !important; }
    .page-head { padding-top: 16px; }
    .page-head h1 { font-size: 24px; }
    .detail-head h2 { font-size: 21px; }
    .filters button { padding: 7px 12px; }
    .btn { min-height: 40px; }
    .meta { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .logs { max-height: 60vh; }
    .preview, .editor .preview { height: 420px; }
    .editor textarea { min-height: 360px; }
    .stats { gap: 18px; }
    main img { max-width: 100%; }
    .split { grid-template-columns: 1fr; }
    .list { max-height: none; border-right: 0; }
    .split.has-detail .list { display: none; }
    .split:not(.has-detail) .detail { display: none; }
    .page-head, .detail, .section { padding-left: 16px; padding-right: 16px; }
    .cards { padding: 0 16px 32px; grid-template-columns: 1fr; }
  }
  .back { display: none; }
  @media (max-width: 900px) { .back { display: inline-flex; margin-bottom: 12px; } }
  /* Narrow screens: every table row becomes a small card of "label  value" lines (labels from the header). */
  @media (max-width: 700px) {
    table.grid thead { display: none; }
    table.grid, table.grid tbody, table.grid tr, table.grid td { display: block; width: 100%; }
    table.grid { border-width: 1px 1px 0; }
    table.grid tr { border-bottom: 1px solid var(--line); padding: 6px 0; }
    table.grid td { border: 0; padding: 5px 12px; text-align: right; overflow-wrap: anywhere; position: relative; }
    table.grid td[data-label] { padding-left: 42%; min-height: 30px; }
    table.grid td[data-label]::before { content: attr(data-label); position: absolute; left: 12px; top: 6px; max-width: 38%;
      color: var(--muted); font-size: 13px; text-align: left; }
    table.grid td.row { justify-content: flex-end; }
    table.grid td:empty { display: none; }
  }
  .more { margin-top: 10px; }
  /* Image viewer for reporters' photos: zoom (pinch, wheel, double tap), pan, swipe between them. */
  .viewer { position: fixed; inset: 0; z-index: 1000; background: rgba(8, 10, 12, .94); touch-action: none; overflow: hidden; }
  .viewer[hidden] { display: none; }
  .viewer img { position: absolute; left: 50%; top: 50%; max-width: 96vw; max-height: 88vh; transform-origin: center;
    user-select: none; -webkit-user-drag: none; cursor: zoom-in; }
  .viewer.zoomed img { cursor: grab; }
  .viewer button { position: absolute; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 22px;
    background: rgba(255, 255, 255, .14); color: #fff; cursor: pointer; }
  .viewer button:hover { background: rgba(255, 255, 255, .26); }
  .viewer .v-close { top: 14px; right: 14px; }
  .viewer .v-prev { left: 14px; top: 50%; margin-top: -22px; }
  .viewer .v-next { right: 14px; top: 50%; margin-top: -22px; }
  .viewer .v-count { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: #cfd6dd; font-size: 13px; }
  /* the map */
  .map-wrap { display: grid; grid-template-columns: 1fr 340px; height: calc(100dvh - 76px); border-top: 1px solid var(--line); }
  #map { height: 100%; }
  .map-side { border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px; background: var(--surface); font-size: 14px; }
  .map-side h2 { font-size: 20px; margin: 0 0 6px; }
  .map-side .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .map-side button { border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 5px 10px; cursor: pointer; }
  .map-side button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .bus-icon { background: #5f6b7a; color: #fff; font: 700 11px/20px var(--display, sans-serif); border-radius: 10px; text-align: center; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); white-space: nowrap; padding: 0 5px; }
  .bus-icon.live { background: #1E8A4C; }
  .bus-icon.late { background: #C77700; }
  .bus-icon.very { background: #C0392B; }
  .vertex { background: #fff; border: 2px solid #1D4FB8; border-radius: 50%; }
  .map-side h3 { font-size: 15px; margin: 16px 0 4px; }
  .map-side .input { padding: 5px 8px; font-size: 14px; min-width: 0; }
  .child-row { border-top: 1px solid var(--line); padding: 6px 0; display: grid; gap: 6px; }
  .place-row { border-top: 1px solid var(--line); padding: 6px 0; display: grid; gap: 6px; }
  .place-row .row { margin: 0; }
  .lines-pick { display: grid; gap: 4px; }
  #snap-progress progress { width: 100%; height: 10px; accent-color: var(--ink); }
  .lines-pick details { border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; background: var(--paper); }
  .lines-pick summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  .lines-pick details[open] { max-height: 280px; overflow-y: auto; }
  .pick { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 14px; }
  .pick input { flex: none; }
  .pick-tools { display: flex; gap: 6px; margin: 6px 0; }
  @media (max-width: 900px) {
    /* Phones: the map stays at the top (pinned, over the menu) while the panel under it scrolls. */
    .map-wrap { display: block; height: auto; }
    #map { position: sticky; top: 0; z-index: 6; height: 46dvh; border-bottom: 2px solid var(--line); }
    .map-side { border-left: 0; overflow: visible; min-height: 60dvh; }
    .page-head .legend { display: flex; flex-wrap: wrap; gap: 4px 0; }
    .map-side .row { flex-wrap: wrap; }
    .map-side button { padding: 8px 12px; }
    .map-side .input { font-size: 16px; } /* phones zoom into smaller fields */
    .leaflet-touch .leaflet-control-zoom a { width: 36px; height: 36px; line-height: 36px; }
  }
  .child-row p { margin: 4px 0; }
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
<aside class="rail">
  <div class="rail-brand"><strong>emhub</strong><span>Plan&amp;Ride operations</span></div>
  <nav>
    <a href="#bugs" data-nav="bugs">Bugs <span class="count" id="count-new" hidden></span></a>
    <a href="#ideas" data-nav="ideas">Suggestions <span class="count" id="count-ideas" hidden></span></a>
    <a href="#community" data-nav="community">Community</a>
    <a href="#timetable" data-nav="timetable">Timetable</a>
    <a href="#map" data-nav="map">Map</a>
    <a href="#site" data-nav="site">Website</a>
    <a href="#settings" data-nav="settings">Settings</a>
  </nav>
  <div class="rail-foot">
    <div class="who">Signed in as <strong id="me-name"></strong></div>
    <form method="post" action="/auth/logout"><button type="submit">Sign out</button></form>
  </div>
</aside>
<main id="view"></main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="viewer" id="viewer" hidden role="dialog" aria-label="Image">
  <img alt="Image from the reporter">
  <button class="v-close" type="button" aria-label="Close">&times;</button>
  <button class="v-prev" type="button" aria-label="Previous">&#8249;</button>
  <button class="v-next" type="button" aria-label="Next">&#8250;</button>
  <div class="v-count"></div>
</div>

<script>
"use strict";
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = $("#view");
const STATUSES = ["new", "triaged", "in_progress", "resolved", "closed"];
const label = (s) => s.replace("_", " ").replace(/^./, (c) => c.toUpperCase());
let me = null;
let bugFilter = { status: "open", q: "" };

async function api(path, body) {
  const res = await fetch("/admin/api/" + path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (res.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

function toast(text) {
  const el = $("#toast");
  el.textContent = text; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3500);
}

function ago(seconds) {
  const d = Math.max(0, Date.now() / 1000 - seconds);
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + " min ago";
  if (d < 86400) return Math.floor(d / 3600) + " h ago";
  return new Date(seconds * 1000).toLocaleDateString();
}
const when = (s) => new Date(s * 1000).toLocaleString();

function delayText(sec) {
  if (sec == null) return { text: "–", cls: "" };
  const m = Math.round(sec / 60);
  if (m <= 0 && m >= -1) return { text: m < 0 ? m + " min" : "on time", cls: "on" };
  if (m < 0) return { text: m + " min", cls: "on" };
  return { text: "+" + m + " min", cls: m >= 10 ? "very" : "late" };
}

// ------------------------------------------------------------------ router

async function route() {
  const [page, arg] = location.hash.slice(1).split("/");
  document.querySelectorAll("[data-nav]").forEach((a) =>
    a.setAttribute("aria-current", (a.dataset.nav === ({ bug: "bugs", idea: "ideas", templates: "settings" }[page] || page || "bugs")) ? "page" : "false"));
  try {
    if (page === "community") return await renderCommunity(arg);
    if (page === "timetable") return await renderTimetable();
    if (page === "map") return renderMap(arg ? decodeURIComponent(arg) : null);
    if (page === "settings") return await renderSettings(arg);
    if (page === "templates") return await renderTemplates(arg);
    if (page === "site") return await renderSite(arg);
    if (page === "ideas" || page === "idea") return await renderBugs(page === "idea" ? Number(arg) : null, "feature");
    return await renderBugs(page === "bug" ? Number(arg) : null, "bug");
  } catch (e) {
    if (e.message !== "signed out") view.innerHTML = `<div class="empty"><h2>Couldn't load this page</h2><p>${esc(e.message)}</p></div>`;
  }
}
addEventListener("hashchange", route);

async function refreshCounts() {
  const s = await api("stats");
  const n = s.bugs.new || 0;
  const el = $("#count-new");
  el.textContent = n; el.hidden = !n;
  const ideas = $("#count-ideas"), i = (s.ideas || {}).new || 0;
  ideas.textContent = i; ideas.hidden = !i;
  return s;
}

// ------------------------------------------------------------------ bugs

// kind: "bug" (Bugs) or "feature" (Suggestions); both are reports with the same detail view.
async function renderBugs(selectedId, kind = "bug") {
  const ideas = kind === "feature";
  const params = new URLSearchParams({ kind });
  if (bugFilter.status !== "all") params.set("status", bugFilter.status);
  if (bugFilter.q) params.set("q", bugFilter.q);
  const [bugs] = await Promise.all([api("bugs?" + params), refreshCounts()]);
  const filters = [["open", "Open"], ...STATUSES.map((s) => [s, label(s)]), ["all", "All"]];
  view.innerHTML = `
    <div class="page-head"><h1>${ideas ? "Suggestions" : "Bugs"}</h1><span class="muted small">${bugs.length} shown</span></div>
    <div class="split ${selectedId ? "has-detail" : ""}">
      <div class="list">
        <div class="filters">
          ${filters.map(([v, l]) => `<button type="button" data-status="${v}" aria-pressed="${bugFilter.status === v}">${l}</button>`).join("")}
          <input class="input" type="search" placeholder="Search title, text, name or email" value="${esc(bugFilter.q)}" aria-label="Search bugs">
        </div>
        ${bugs.length ? bugs.map((b) => `
          <a class="bug-row" href="#${ideas ? "idea" : "bug"}/${b.id}" aria-current="${b.id === selectedId}">
            <span class="plate">${b.code}</span>
            <span class="t">${esc(b.title)}</span>
            <span class="m"><span class="status ${b.status}">${label(b.status)}</span><span>${esc(b.category)}</span><span>${esc(b.platform)}</span><span>${ago(b.updated_at)}</span></span>
          </a>`).join("") : `<div class="empty"><h2>No ${ideas ? "suggestions" : "reports"} here</h2><p>${ideas ? "Feature ideas" : "Reports"} sent from the app and the web version appear in this list. Try another filter.</p></div>`}
      </div>
      <section class="detail" id="detail">${selectedId ? "" : `<div class="empty"><h2>Pick a report</h2><p>Select ${ideas ? "a suggestion" : "a bug"} on the left to read it${ideas ? "" : ", look at the logs"} and reply to the reporter.</p></div>`}</section>
    </div>`;
  view.querySelectorAll("[data-status]").forEach((b) => b.onclick = () => { bugFilter.status = b.dataset.status; renderBugs(selectedId, kind); });
  const search = $(".filters input", view);
  search.oninput = () => { clearTimeout(search.t); search.t = setTimeout(() => { bugFilter.q = search.value.trim(); renderBugs(selectedId, kind).then(() => { const s = $(".filters input"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }); }, 300); };
  if (selectedId) await renderBug(selectedId);
}

function highlightLogs(text, needle) {
  return text.split("\n").filter((l) => !needle || l.toLowerCase().includes(needle.toLowerCase())).map((line) => {
    let h = esc(line);
    if (needle) h = h.replace(new RegExp(esc(needle).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
    const cls = /\bE\/|\bERROR\b|Exception|FATAL/.test(line) ? "e" : /\bW\/|\bWARN/.test(line) ? "w" : "";
    return cls ? `<span class="${cls}">${h}</span>` : h;
  }).join("\n");
}

// ------------------------------------------------------------------ community

function tripParts(key) {
  // City/regional buses from sadzv: sadzv|lineId|trip|date|line; planner trips: line|first stop|first departure (ms)
  const parts = key.split("|");
  if (parts[0] === "sadzv") return { line: parts[4] || "", first: "trip " + parts[2], start: parts[3] };
  const [line, first, ms] = parts;
  const t = Number(ms);
  return { line, first, start: t ? new Date(t).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "" };
}
const kindLabel = { gps: "rider's phone", departed: "left the stop (phone)", passed: "drove past (phone)", arrival: "at the stop", position: "tap" };
const dayTypeLabel = { workday: "workdays", saturday: "Saturdays", sunday: "Sundays" };
// Which buses the table shows: the last 6 hours (no day) or any day, optionally one line.
let communityFilter = { day: "", line: "" };

// Long lists show the newest LIST_LIMIT rows (phones: tens of thousands of pixels otherwise), then a button.
const LIST_LIMIT = 50, showAll = { reports: false, trips: false };
const more = (key, n) => n > LIST_LIMIT && !showAll[key]
  ? `<button class="btn quiet more" type="button" data-more="${key}">Show all ${n}</button>` : "";

              <button class="btn danger" data-block="${esc(r.reporter)}" data-unblock="${r.blocked ? 1 : ""}" type="button">${r.blocked ? "Unblock" : "Block rider"}</button></td></tr>`;
        }).join("")}</tbody></table></div>${more("reports", reports.length)}` : `<p class="muted">No reports.</p>`}
    </div>`;
  $("#c-filter").onsubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    communityFilter = { day: f.get("day") || "", line: (f.get("line") || "").trim() };
    renderCommunity(selected);
  };
  $("#c-reset") && ($("#c-reset").onclick = () => { communityFilter = { day: "", line: "" }; renderCommunity(selected); });
  view.querySelectorAll("[data-more]").forEach((b) => b.onclick = () => { showAll[b.dataset.more] = true; renderCommunity(selected); });
  view.querySelectorAll("[data-trip]").forEach((tr) => {
    const go = () => location.hash = "community/" + encodeURIComponent(tr.dataset.trip);
    tr.onclick = go; tr.onkeydown = (e) => e.key === "Enter" && go();
  });
  view.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {

  });
  view.querySelectorAll("[data-block]").forEach((b) => b.onclick = async () => {

}

// ------------------------------------------------------------------ timetable

const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const dayClock = (ms) => new Date(ms).toLocaleString([], { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
const localInput = (d = new Date()) => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
const kb = (n) => n == null ? "–" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " kB";
const epochOf = (v) => Math.floor(new Date(v || Date.now()).getTime() / 1000);
let ttPoll = null;

// ------------------------------------------------------------------ map: stops, buses now, editing stops and road traces

let mapState = null;

function renderMap(stationId = null) {
  // Changing only the station in the address (#map/<id>) keeps the map, and opens that station.
  if (stationId && mapState && $("#map")) return showStation(stationId, true);
  clearInterval(mapState?.timer);
  view.innerHTML = `
    <div class="page-head"><h1>Map</h1><span class="muted small legend">
      <span><i class="dot" style="background:#1E8A4C"></i>live (riders' phones or reports)</span>
      <span><i class="dot" style="background:#5f6b7a"></i>by the timetable</span>
      <span><i class="dot" style="background:#C77700"></i>late</span>
      <span><i class="dot" style="background:#1D4FB8"></i>stop (amber: moved by hand)</span></span></div>
    <div class="map-wrap"><div id="map"></div><aside class="map-side" id="map-side"></aside></div>`;
  const map = L.map("map", { preferCanvas: true }).setView([48.736, 19.146], 13);
  // OpenStreetMap's tile servers refuse requests without a Referer (403): send our origin with them.
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors",
    referrerPolicy: "strict-origin-when-cross-origin" }).addTo(map);
  mapState = { map, stops: L.layerGroup().addTo(map), buses: L.layerGroup().addTo(map), trip: L.layerGroup().addTo(map), tripId: null, edit: null };
  sideHelp();
  const load = () => { loadStops(); loadBuses(); };
  map.on("moveend", load);
  if (stationId) showStation(stationId, true);
  map.on("click", (e) => mapState.mapClick?.(e));
  load();
  // Buses move: refresh while the map is the page shown.
  mapState.timer = setInterval(() => { if (location.hash.startsWith("#map")) loadBuses(); else clearInterval(mapState.timer); }, 10000);
}

function bbox() {
  const b = mapState.map.getBounds();
  return [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map((x) => x.toFixed(5)).join(",");
}

function sideHelp() {
  $("#map-side").innerHTML = `<h2>Map</h2>
    <p class="muted">Buses on the road now: green ones are where riders' phones or reports put them, grey ones where the timetable does. Stops show from zoom 14.</p>
    <p class="muted"><b>A stop:</b> click it to move it, give it more places (with the lines that stop at each), a zone (circle or shape), or make it a central station whose platforms are other stops. All of it is kept through every timetable update.</p>
    <p class="muted small">Purple dots: extra places. Green ring: central station; green dots and dashed lines: its platforms. Shaded: zones.</p>
    <p class="muted"><b>Road traces:</b> click a bus to see its trip. Snap it to the roads (OpenStreetMap routing), or click a part between two stops to draw it by hand: drag the points, click the map to add one, right-click a point to remove it.</p>`;
}

async function loadStops() {
  const { map, stops } = mapState;
  stops.clearLayers();
  if (map.getZoom() < 14) return;
  const r = await api("map/stations?bbox=" + bbox());
  const at = Object.fromEntries(r.stations.map((s) => [s.id, s]));
  for (const s of r.stations) {
    // What was set up by hand: the zone, extra places, and the line to the central station.
    if (s.zone) stops.addLayer(zoneLayer(s.zone, { interactive: false }));
    for (const p of s.places || []) {
      stops.addLayer(L.circleMarker([p.lat, p.lon], { radius: 4, color: "#fff", weight: 1, fillColor: "#7C3AED", fillOpacity: 1 })
        .bindTooltip(esc([s.name, p.label, (p.lines || []).join(", ")].filter(Boolean).join(" · "))));
      stops.addLayer(L.polyline([[s.lat, s.lon], [p.lat, p.lon]], { color: "#7C3AED", weight: 1, dashArray: "3 4", interactive: false }));
    }
    if (s.parent && at[s.parent]) stops.addLayer(L.polyline([[s.lat, s.lon], [at[s.parent].lat, at[s.parent].lon]], { color: "#0F766E", weight: 2, dashArray: "6 5", interactive: false }));
    // bubblingMouseEvents: a click on a stop isn't also a click on the map (adding a place, a zone corner).
    const m = L.circleMarker([s.lat, s.lon], { bubblingMouseEvents: false, radius: s.central ? 9 : 6, color: s.central ? "#0F766E" : "#fff", weight: s.central ? 4 : 2,
      fillColor: s.moved ? "#FFB21E" : s.parent ? "#0F766E" : "#1D4FB8", fillOpacity: 1 });
    m.bindTooltip(esc(s.name) + (s.central ? " (central)" : "") + (s.parent && at[s.parent] ? ` (platform of ${esc(at[s.parent].name)})` : ""));
    m.on("click", () => stopClicked(s));
    stops.addLayer(m);
  }
}

function zoneLayer(z, options = {}) {
  const style = { color: "#0F766E", weight: 2, fillOpacity: 0.12, ...options };
  return z.type === "circle" ? L.circle([z.lat, z.lon], { radius: z.radius, ...style }) : L.polygon(z.points, style);
}

/** A stop clicked: its panel, or (choosing a sub-station for a central station) that stop becomes one. */
function stopClicked(s) {
  if (mapState.pick) return mapState.pick(s);
  showStation(s.id);
}

/**
 * A station's panel: move it; extra places (each may say which lines board there); a zone (circle or drawn shape);
 * central station with sub-stations (other stops that are its platforms for some lines). Everything survives timetable updates.
 */

  const layer = L.layerGroup().addTo(map);

  const side = $("#map-side");
  const lines = (l) => (l || []).join(", ");
  side.innerHTML = `<h2>${esc(st.name)}</h2>
    <p class="muted small">${esc(st.id)}${st.moved ? " · moved by hand" : ""}${st.central ? " · central station" : ""}${st.parent ? ` · platform of <a href="#" data-open="${esc(st.parent.id)}">${esc(st.parent.name)}</a>` : ""}</p>
    <h3>Position</h3>
    <div class="row"><button id="st-move">Move</button>${st.moved ? '<button id="st-unmove">Back to the timetable\'s place</button>' : ""}</div>

    <h3>Zone</h3>
    <p class="muted small">The area that counts as this station (being in it is being at the stop).</p>
    <div class="row"><button data-zone="circle">Circle</button><button data-zone="polygon">Draw a shape</button>${st.zone ? '<button data-zone="none">Remove zone</button>' : ""}</div>
    <div id="st-zone-edit"></div>
    <h3>Central station</h3>
    <label class="row"><input type="checkbox" id="st-central" ${st.central ? "checked" : ""} ${st.parent ? "disabled" : ""}> Central station: other stops are its platforms</label>
    <div id="st-children">${st.central ? `<p class="muted small">${st.children.length} sub-station(s)</p>${st.children.map((c) => childRow(c, st.serving)).join("") || '<p class="muted small">No sub-stations yet.</p>'}
      <div class="row"><button id="st-add-child">Add a sub-station (click a stop on the map)</button></div>` : ""}</div>
    <div class="row"><button id="st-close">Close</button></div>`;

  // Draw what's set up, editable.
  const placeMarkers = [];
  const addPlaceMarker = (p) => {
    const m = L.marker([p.lat, p.lng ?? p.lon], { draggable: true, icon: L.divIcon({ className: "vertex", iconSize: [14, 14] }) }).addTo(layer);
    placeMarkers.push(m);
    return m;
  };
  st.places.forEach((p) => addPlaceMarker(p));
  if (st.zone) layer.addLayer(zoneLayer(st.zone));
  L.circleMarker([st.lat, st.lon], { radius: 10, color: "#FFB21E", weight: 3, fill: false }).addTo(layer);

  side.querySelectorAll("[data-open]").forEach((a) => a.onclick = (e) => { e.preventDefault(); showStation(a.dataset.open); });
  bindLinePickers(side);
  // On a phone the panel is under the pinned map: scroll so the panel starts right under it.
  if (matchMedia("(max-width: 900px)").matches) window.scrollTo({ top: side.getBoundingClientRect().top + scrollY - $("#map").offsetHeight, behavior: "smooth" });
  $("#st-close").onclick = () => { endEditing(); sideHelp(); history.replaceState(null, "", "#map"); };

  // Position
  $("#st-move").onclick = () => {
    const m = L.marker([st.lat, st.lon], { draggable: true }).addTo(layer);
    $("#st-move").outerHTML = '<button class="primary" id="st-move-save">Save position</button>';
    $("#st-move-save").onclick = async () => { const p = m.getLatLng(); await api("map/stop", { id: st.id, lat: p.lat, lon: p.lng }); toast("Position saved"); loadStops(); showStation(st.id); };
  };
  if (st.moved) $("#st-unmove").onclick = async () => { await api("map/stop/reset", { id: st.id }); toast("Back where the timetable has it"); loadStops(); showStation(st.id); };

  // Places
  const placesBox = $("#st-places");
  placesBox.onclick = (e) => {
    const del = e.target.closest("[data-del-place]");
    if (!del) return;
    const i = Number(del.dataset.delPlace);
    layer.removeLayer(placeMarkers[i]); placeMarkers[i] = null;
    del.closest(".place-row").remove();
  };
  $("#st-add-place").onclick = () => {
    toast("Click the map where the place is");
    mapState.mapClick = (e) => {
      mapState.mapClick = null;
      const i = placeMarkers.length;
      addPlaceMarker(e.latlng);
      placesBox.insertAdjacentHTML("beforeend", placeRow({ label: "", lines: [] }, i, st.serving));
    };
  };
  $("#st-save-places").onclick = async () => {
    const places = [];
    placesBox.querySelectorAll(".place-row").forEach((row) => {
      const m = placeMarkers[Number(row.dataset.i)];
      if (!m) return;
      const p = m.getLatLng();
      places.push({ lat: p.lat, lon: p.lng, label: $("[data-label]", row).value, lines: $("[data-lines]", row).value });
    });
    await api("map/station", { id: st.id, places });
    toast("Places saved"); loadStops(); showStation(st.id);
  };

  // Zone
  side.querySelectorAll("[data-zone]").forEach((b) => b.onclick = () => editZone(st, b.dataset.zone, layer));

  // Central and sub-stations
  $("#st-central").onchange = async (e) => {
    if (!e.target.checked && st.children.length && !confirm("Its sub-stations become ordinary stops again. Continue?")) { e.target.checked = true; return; }
    await api("map/station", { id: st.id, central: e.target.checked });
    loadStops(); showStation(st.id);
  };
  if (st.central) {
    $("#st-add-child").onclick = () => {
      toast("Click the stop that is one of its platforms");
      mapState.pick = async (child) => {
        mapState.pick = null;
        if (child.id === st.id) return toast("That's the central station itself");
        await api("map/child", { parent: st.id, child: child.id, label: "", lines: "" });
        toast(child.name + " is now a platform of " + st.name); loadStops(); showStation(st.id);
      };
    };
    $("#st-children").onclick = async (e) => {
      const row = e.target.closest(".child-row");
      if (!row) return;
      if (e.target.closest("[data-child-save]")) {
        await api("map/child", { parent: st.id, child: row.dataset.id, label: $("[data-label]", row).value, lines: $("[data-lines]", row).value });
        toast("Saved"); loadStops();
      }
      if (e.target.closest("[data-child-remove]")) { await api("map/child/remove", { child: row.dataset.id }); loadStops(); showStation(st.id); }
      if (e.target.closest("[data-open]")) { e.preventDefault(); showStation(row.dataset.id); }
    };
  }
}

/**
 * Lines as a writable field plus a tick list of the lines that stop there (with where they go); ticking adds or
 * removes a line in the field, typing works too.
 */
function linesPicker(chosen, serving) {
  const picked = new Set(chosen || []);
  const extra = [...picked].filter((l) => !serving.lines.some((x) => x.line === l));
  const options = [...serving.lines, ...extra.map((line) => ({ line, headsigns: [] }))];
  return `<div class="lines-pick"><input class="input" data-lines placeholder="Lines (34, 60101)" value="${esc([...picked].join(", "))}">
    <details><summary>Choose lines${options.length ? ` (${options.length})` : ""}</summary>
      <div class="pick-tools"><button type="button" data-all>All</button><button type="button" data-none>None</button></div>
      ${options.map((o) => `<label class="pick"><input type="checkbox" value="${esc(o.line)}" ${picked.has(o.line) ? "checked" : ""}>
        <b>${esc(o.line)}</b> <span class="muted small">${esc(o.headsigns.join(", "))}</span></label>`).join("") || '<p class="muted small">No timetable lines stop here.</p>'}
    </details></div>`;
}

/** Keeps a lines picker's field and ticks in step (one handler for the whole panel). */
function bindLinePickers(root) {
  const sync = (box) => {
    const field = $("[data-lines]", box);
    const typed = field.value.split(/[,\s]+/).filter(Boolean);
    const listed = [...box.querySelectorAll(".pick input")].map((c) => c.value);
    const ticked = [...box.querySelectorAll(".pick input:checked")].map((c) => c.value);
    field.value = [...typed.filter((l) => !listed.includes(l)), ...ticked].join(", ");
  };
  root.addEventListener("change", (e) => {
    const box = e.target.closest(".lines-pick");
    if (!box) return;
    if (e.target.matches("[data-lines]")) {
      const typed = new Set(e.target.value.split(/[,\s]+/).filter(Boolean));
      box.querySelectorAll(".pick input").forEach((c) => (c.checked = typed.has(c.value)));
    } else sync(box);
  });
  root.addEventListener("click", (e) => {
    const box = e.target.closest(".lines-pick");
    if (!box || !e.target.matches("[data-all], [data-none]")) return;
    box.querySelectorAll(".pick input").forEach((c) => (c.checked = e.target.matches("[data-all]")));
    sync(box);
  });
}

/** Suggestions for a place's name: "Smer <where its buses go>". */
function directionOptions(serving) {
  const towns = new Set();
  serving.lines.forEach((l) => l.headsigns.forEach((h) => towns.add(h)));
  return [...towns].sort().map((h) => `<option value="Smer ${esc(h)}">`).join("");
}

/** Platform suggestions: the timetable's platform numbers here, then 1 to 30. */
function platformOptions(...servings) {
  const codes = new Set(servings.flatMap((x) => x.platforms));
  for (let n = 1; n <= 30; n++) codes.add(String(n));
  return [...codes].sort((a, b) => a.padStart(4, "0").localeCompare(b.padStart(4, "0"))).map((c) => `<option value="Nástupište ${esc(c)}">`).join("");
}

function placeRow(p, i, serving) {
  return `<div class="place-row" data-i="${i}">
    <div class="row"><input class="input" data-label list="dir-options" placeholder="Name (e.g. Smer centrum)" value="${esc(p.label)}" style="flex:1">
      <button data-del-place="${i}" title="Remove this place">✕</button></div>
    ${linesPicker(p.lines, serving)}</div>`;
}

function childRow(c, parentServing) {
  return `<div class="child-row" data-id="${esc(c.id)}"><p><a href="#" data-open>${esc(c.name)}</a></p>
    <input class="input" data-label list="pf-${esc(c.id)}" placeholder="Platform (e.g. Nástupište 5)" value="${esc(c.label)}">
    <datalist id="pf-${esc(c.id)}">${platformOptions(c.serving, parentServing)}</datalist>
    ${linesPicker(c.lines, c.serving.lines.length ? c.serving : parentServing)}
    <div class="row"><button class="primary" data-child-save>Save</button><button data-child-remove>Remove</button></div></div>`;
}

/** The station's zone: a circle (drag its centre, set the radius) or a shape (click the map for each corner). */
function editZone(st, kind, layer) {
  const box = $("#st-zone-edit");
  if (kind === "none") {
    api("map/station", { id: st.id, zone: null }).then(() => { toast("Zone removed"); loadStops(); showStation(st.id); });
    return;
  }
  if (kind === "circle") {
    const z = st.zone?.type === "circle" ? st.zone : { lat: st.lat, lon: st.lon, radius: 80 };
    const circle = L.circle([z.lat, z.lon], { radius: z.radius, color: "#0F766E", fillOpacity: 0.15 }).addTo(layer);
    const center = L.marker([z.lat, z.lon], { draggable: true }).addTo(layer);
    center.on("drag", () => circle.setLatLng(center.getLatLng()));
    box.innerHTML = `<div class="row"><label>Radius <input class="input" type="number" id="zone-r" min="10" max="3000" value="${z.radius}" style="width:90px"> m</label>
      <button class="primary" id="zone-save">Save circle</button></div>`;
    $("#zone-r").oninput = (e) => circle.setRadius(Number(e.target.value) || 10);
    $("#zone-save").onclick = async () => {
      const c = center.getLatLng();
      await api("map/station", { id: st.id, zone: { type: "circle", lat: c.lat, lon: c.lng, radius: Number($("#zone-r").value) } });
      toast("Zone saved"); loadStops(); showStation(st.id);
    };
    return;
  }
  const points = (st.zone?.type === "polygon" ? st.zone.points : []).map((p) => L.latLng(p[0], p[1]));
  const shape = L.polygon(points, { color: "#0F766E", fillOpacity: 0.15 }).addTo(layer);
  const corners = L.layerGroup().addTo(layer);
  const redraw = () => {
    shape.setLatLngs(points);
    corners.clearLayers();
    points.forEach((p, i) => {
      const v = L.marker(p, { draggable: true, icon: L.divIcon({ className: "vertex", iconSize: [12, 12] }) }).addTo(corners);
      v.on("drag", (e) => { points[i] = e.target.getLatLng(); shape.setLatLngs(points); });
      v.on("contextmenu", () => { points.splice(i, 1); redraw(); });
    });
  };
  redraw();
  mapState.mapClick = (e) => { points.push(e.latlng); redraw(); };
  box.innerHTML = `<p class="muted small">Click the map for each corner; drag corners; right-click one to remove it.</p>
    <div class="row"><button class="primary" id="zone-save">Save shape</button><button id="zone-clear">Start over</button></div>`;
  $("#zone-clear").onclick = () => { points.length = 0; redraw(); };
  $("#zone-save").onclick = async () => {
    if (points.length < 3) return toast("A shape needs at least 3 corners");
    mapState.mapClick = null;
    await api("map/station", { id: st.id, zone: { type: "polygon", points: points.map((p) => [p.lat, p.lng]) } });
    toast("Zone saved"); loadStops(); showStation(st.id);
  };
}

/** Leave whatever the station panel was editing. */
function endEditing() {
  if (!mapState) return;
  mapState.mapClick = null;
  mapState.pick = null;
  if (mapState.editing) { mapState.map.removeLayer(mapState.editing.layer); mapState.editing = null; }
}

async function loadBuses() {
  const r = await api("map/vehicles?bbox=" + bbox());
  const { buses } = mapState;
  buses.clearLayers();
  for (const v of r.vehicles) {
    const late = v.delay != null && v.delay >= 600 ? "very" : v.delay != null && v.delay >= 180 ? "late" : "";
    const icon = L.divIcon({ className: "", html: `<div class="bus-icon ${v.live ? "live" : ""} ${late}">${esc(v.line)}</div>`, iconSize: null });
    const m = L.marker([v.lat, v.lon], { icon });
    const d = delayText(v.delay);
    m.bindTooltip(`${esc(v.line)} → ${esc(v.headsign)}<br>next: ${esc(v.next)}<br>${v.live ? `${d.text} (${v.source === "gps" ? "riders' phones" : "reports"})` : "timetable"}`);
    m.on("click", () => showTripOnMap(v.tripId));
    buses.addLayer(m);
  }
}

async function showTripOnMap(tripId) {
  const t = await api("map/trip?id=" + encodeURIComponent(tripId));
  mapState.tripId = tripId;
  drawTrip(t);
  const side = $("#map-side");
  side.innerHTML = `<h2>${esc(t.line)} → ${esc(t.headsign)}</h2><p class="muted small">${esc(t.operator)} · ${esc(tripId)}</p>
    <p class="muted">${t.segments.filter((s) => s.traced).length} of ${t.segments.length} parts follow the roads. Click a part to draw it by hand.</p>
    <div class="row"><button class="primary" id="snap">Snap to roads</button><button id="snap-missing">Snap only the straight parts</button><button id="trip-close">Close</button></div>
    <div id="snap-progress"></div>
    <ol class="small">${t.stops.map((s) => `<li>${esc(s.name)} <span class="muted">${new Date(s.departure).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span></li>`).join("")}</ol>`;
  // Part by part, with a progress bar: it takes about a second a part, and it should be clear it's working.
  const snap = async (keep) => {
    const todo = t.segments.filter((x) => x.points.length >= 2 && !(keep && x.traced));
    if (!todo.length) return toast("Every part already follows the roads");
    side.querySelectorAll("button").forEach((b) => (b.disabled = true));
    $("#snap-progress").innerHTML = `<p class="small"><span id="snap-text"></span></p><progress id="snap-bar" max="${todo.length}" value="0"></progress>`;
    let done = 0, failed = 0, skipped = 0;
    for (const [i, seg] of todo.entries()) {
      $("#snap-text").textContent = `Snapping to roads: part ${i + 1} of ${todo.length}…`;
      try {
        const r = await api("map/snap", { id: tripId, keep, from: seg.from, to: seg.to });
        done += r.snapped; failed += r.failed; skipped += r.snapped || r.failed ? 0 : 1;
        if (r.trip) drawTrip(r.trip, false); // each part shows on the map as it's done
      } catch (e) { failed++; }
      $("#snap-bar").value = i + 1;
    }
    toast(`Snapped ${done} part(s)` + (failed ? `, ${failed} couldn't be routed` : "") + (skipped ? `, ${skipped} drawn by hand kept` : ""));
    showTripOnMap(tripId);
  };
  $("#snap").onclick = () => snap(false);
  $("#snap-missing").onclick = () => snap(true);
  $("#trip-close").onclick = () => { mapState.trip.clearLayers(); mapState.tripId = null; sideHelp(); };
}

function drawTrip(t, fit = true) {
  const { map, trip } = mapState;
  trip.clearLayers();
  const bounds = [];
  t.segments.forEach((seg) => {
    if (seg.points.length < 2) return;
    const line = L.polyline(seg.points, { color: seg.traced ? "#1D4FB8" : "#8A94A6", weight: 6, opacity: 0.85, dashArray: seg.traced ? null : "8 8" });
    line.on("click", () => editSegment(t, seg));
    trip.addLayer(line);
    bounds.push(...seg.points);
  });
  t.stops.forEach((s) => { if (s.lat != null) trip.addLayer(L.circleMarker([s.lat, s.lon], { radius: 5, color: "#fff", weight: 2, fillColor: "#14213D", fillOpacity: 1 }).bindTooltip(esc(s.name))); });
  if (bounds.length && fit) map.fitBounds(bounds, { padding: [30, 30] });
}

/** Draw one stop-to-stop part by hand: its inner points can be dragged, added (click the map) or removed (right-click). */
function editSegment(t, seg) {
  const { map, trip } = mapState;
  const ends = [seg.points[0], seg.points.at(-1)];
  let inner = seg.points.slice(1, -1).map((p) => L.latLng(p[0], p[1]));
  const layer = L.layerGroup().addTo(map);
  const redraw = () => {
    layer.clearLayers();
    layer.addLayer(L.polyline([ends[0], ...inner, ends[1]], { color: "#FFB21E", weight: 5 }));
    inner.forEach((p, i) => {
      const v = L.marker(p, { draggable: true, icon: L.divIcon({ className: "vertex", iconSize: [12, 12] }) });
      v.on("drag", (e) => { inner[i] = e.target.getLatLng(); layer.getLayers()[0].setLatLngs([ends[0], ...inner, ends[1]]); });
      v.on("contextmenu", () => { inner.splice(i, 1); redraw(); });
      layer.addLayer(v);
    });
  };
  // A click on the map adds a point where it fits best (between the two nearest neighbours along the line).
  const add = (e) => {
    const all = [L.latLng(...ends[0]), ...inner, L.latLng(...ends[1])];
    let best = 0, bestCost = Infinity;
    for (let i = 0; i < all.length - 1; i++) {
      const cost = map.distance(all[i], e.latlng) + map.distance(e.latlng, all[i + 1]) - map.distance(all[i], all[i + 1]);
      if (cost < bestCost) { bestCost = cost; best = i; }
    }
    inner.splice(best, 0, e.latlng);
    redraw();
  };
  map.on("click", add);
  trip.eachLayer((l) => l.setStyle && l.setStyle({ opacity: 0.3 }));
  redraw();
  const side = $("#map-side");
  side.innerHTML = `<h2>Drawing a part by hand</h2><p class="muted">Drag the points along the road; click the map to add one; right-click a point to remove it.</p>
    <div class="row"><button class="primary" id="seg-save">Save</button><button id="seg-reset">Straight line again</button><button id="seg-cancel">Cancel</button></div>`;
  const end = () => { map.off("click", add); map.removeLayer(layer); showTripOnMap(mapState.tripId); };
  $("#seg-cancel").onclick = end;
  $("#seg-save").onclick = async () => { await api("map/segment", { from: seg.from, to: seg.to, points: inner.map((p) => [p.lat, p.lng]) }); toast("Saved"); end(); };
  $("#seg-reset").onclick = async () => { await api("map/segment/reset", { from: seg.from, to: seg.to }); toast("Straight again"); end(); };
}

  })(e);
  view.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
    view.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", x === b));
    $("#tt-stops").hidden = b.dataset.tab !== "stops";
    $("#tt-plan").hidden = b.dataset.tab !== "plan";
  });
  const stopForm = $("#tt-stop-form");
  const bindTrips = () => view.querySelectorAll("[data-trip]").forEach((el) => {
    const open = () => showTrip(el.dataset.trip).catch((err) => toast(err.message));
    el.onclick = open; el.onkeydown = (e) => e.key === "Enter" && open();
  });
  const board = async (id, name) => {
    const r = await api(`timetable/departures?stop=${encodeURIComponent(id)}&n=40&time=${epochOf(new FormData(stopForm).get("time"))}`);
    const s = r.stops[0] || {};
    $("#tt-board").innerHTML = `<h3 style="margin:6px 0">${esc(name)} <span class="muted small">${s.lat != null ? s.lat.toFixed(5) + ", " + s.lon.toFixed(5) : "no position"} · id <code>${esc(id)}</code></span></h3>
      ${r.departures.length ? `<div class="table-wrap"><table class="grid"><thead><tr><th>Departs</th><th>Line</th><th>To</th><th>Operator</th><th>Feed</th></tr></thead>
      <tbody>${r.departures.map((d) => `<tr class="click" data-trip="${esc(d.tripId)}" tabindex="0"><td>${dayClock(d.at)}</td>
        <td><span class="plate line">${esc(d.line)}</span></td><td>${esc(d.headsign)}</td><td>${esc(d.operator)}</td><td><code>${esc(d.feed)}</code></td></tr>`).join("")}</tbody></table></div>`
        : '<p class="muted">No departures after this time.</p>'}`;
    bindTrips();
  };
  const search = async () => {
    const q = new FormData(stopForm).get("q").trim();
    if (!q) { $("#tt-stop-list").innerHTML = ""; return; }
    const r = await api("timetable/stops?q=" + encodeURIComponent(q));
    $("#tt-stop-list").innerHTML = r.stops.length ? `<div class="row" style="gap:6px;margin-bottom:12px">${r.stops.map((s) =>
      `<button class="btn quiet" type="button" data-stop="${esc(s.id)}">${esc(s.name)}</button>`).join("")}</div>` : '<p class="muted">No stop matches.</p>';
    view.querySelectorAll("[data-stop]").forEach((b) => b.onclick = () => board(b.dataset.stop, b.textContent).catch((err) => toast(err.message)));
  };
  let timer;
  stopForm.oninput = () => { clearTimeout(timer); timer = setTimeout(() => search().catch((err) => toast(err.message)), 200); };
  stopForm.onsubmit = (e) => e.preventDefault();
  $("#tt-plan-form").onsubmit = (e) => run(e.submitter, async () => {
    const f = new FormData(e.target);
    const q = new URLSearchParams({ from: f.get("from"), to: f.get("to"), time: epochOf(f.get("time")), n: 6, direct: f.get("direct") ? 1 : 0 });
    const r = await api("timetable/plan?" + q);
    $("#tt-plan-out").innerHTML = `<p class="muted small">${esc(r.from.name)} → ${esc(r.to.name)}</p>` + (r.connections.length ? r.connections.map((c) => `
      <div class="card" style="margin-bottom:10px"><div><strong>${dayClock(c.departure)} → ${clock(c.arrival)}</strong>
        <span class="muted small">${Math.round((c.arrival - c.departure) / 60000)} min</span></div>
        ${c.legs.map((l) => l.type === "walk"
          ? `<div class="muted small">walk ${esc(l.from.name)} → ${esc(l.to.name)}, ${Math.round((l.arrival - l.departure) / 60000)} min</div>`
          : `<div data-trip="${esc(l.tripId)}" tabindex="0" style="cursor:pointer"><span class="plate line">${esc(l.line)}</span>
             ${clock(l.departure)} ${esc(l.from.name)} → ${clock(l.arrival)} ${esc(l.to.name)} <span class="muted small">${esc(l.operator)}</span></div>`).join("")}
      </div>`).join("") : '<p class="muted">No connection found in the next two days.</p>');
    bindTrips();
  })(e);
}

async function showTrip(id) {
  const t = await api("timetable/trip?id=" + encodeURIComponent(id));
  const box = $("#tt-trip");
  box.innerHTML = `<h3 style="margin:18px 0 6px"><span class="plate line">${esc(t.line)}</span> to ${esc(t.headsign)}
      <span class="muted small">${esc(t.operator)} · <code>${esc(id)}</code></span></h3>
    <div class="table-wrap"><table class="grid"><thead><tr><th>#</th><th>Stop</th><th>Arrives</th><th>Departs</th><th>Position</th></tr></thead>
    <tbody>${t.stops.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)}</td><td>${clock(s.arrival)}</td><td>${clock(s.departure)}</td>

const run = (btn, fn) => async (e) => {
  e?.preventDefault();
  btn.disabled = true;
  try { await fn(); } catch (err) { toast(err.message); } finally { btn.disabled = false; }
};
const field = (name, label, value, attrs = "") =>
  `<label class="field">${label}<input name="${name}" value="${esc(value)}" ${attrs}></label>`;
const secretField = (name, label, isSet) => `
  <label class="field">${label}<input name="${name}" type="password" autocomplete="new-password" placeholder="${isSet ? "Saved. Leave blank to keep it" : "Not set"}"></label>
  ${isSet ? `<label class="small"><input type="checkbox" name="${name}_clear"> Remove the saved value</label>` : ""}`;

/** Invite link for when the email didn't go out. */
function showInviteLink(r, who) {

    ? `<p class="error-text">The invitation email to ${esc(who)} didn't go out: ${esc(r.mailError)}</p>

          <span class="plate line">${x.lang.toUpperCase()}</span>
          <span class="t">${esc(x.label)}</span>
          <span class="m">${x.custom ? `Edited${x.updated_by ? " by " + esc(x.updated_by) : ""} ${ago(x.updated_at)}` : "Default"}</span></a>`).join("")}
      </div>
      <section class="detail">
        <h2 style="font-size:24px">${esc(current.label)} <span class="muted small">(${current.lang.toUpperCase()})</span></h2>
        <p class="muted small">The page content in HTML; the header, menu and footer are added around it.

          <iframe id="tpl-preview" class="preview" title="Preview" sandbox></iframe>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn" id="tpl-save" type="button">Publish</button>

  $("#tpl-reset").onclick = run($("#tpl-reset"), async () => {
    if (!confirm("Replace your edits with the default page?")) return;
    await api(`site/${key}/reset`, {});
    toast("Page reset");
    renderSite(sel);
  });
  preview();
}

// New bug reports and rider reports appear without reloading. While you type (a reply,
// a filter) the page is left alone and only the counters update.
function liveUpdates() {
  const events = new EventSource("/admin/api/events");
  let timer;
  const changed = (kind) => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const page = location.hash.slice(1).split("/")[0] || "bugs";
      const shown = kind === "community" ? page === "community" : ["bugs", "bug", "ideas", "idea"].includes(page);
      const typing = document.activeElement?.matches("input, textarea, select") ||
        [...document.querySelectorAll("textarea")].some((t) => t.value.trim());
      if (shown && !typing) {
        const y = scrollY;
        route().then(() => scrollTo(0, y));
      } else {
        refreshCounts();
        if (kind === "bugs") toast("New report");
      }
    }, 1000);
  };
  events.addEventListener("bugs", () => changed("bugs"));
  events.addEventListener("community", () => changed("community"));
}

// ---- phone tables: give each cell its column name, shown before the value when rows become cards
new MutationObserver(() => {
  view.querySelectorAll("table.grid").forEach((table) => {
    const heads = [...table.querySelectorAll("thead th")].map((th) => th.textContent.trim());
    if (!heads.length) return;
    table.querySelectorAll("tbody tr").forEach((tr) => [...tr.children].forEach((td, i) => {
      if (heads[i] && td.dataset.label !== heads[i]) td.dataset.label = heads[i];
    }));
  });
}).observe(view, { childList: true, subtree: true });

// ---- image viewer: reporters' photos open over the page (not a new tab), with zoom and pan
(() => {
  const box = document.getElementById("viewer"), img = box.querySelector("img");
  let list = [], at = 0, scale = 1, x = 0, y = 0;
  const pointers = new Map();
  let pinch = null, drag = null, swipeX = null, lastTap = 0;
  const draw = () => {
    img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;
    box.classList.toggle("zoomed", scale > 1);
  };
  const reset = () => { scale = 1; x = 0; y = 0; draw(); };
  const show = (i) => {
    at = (i + list.length) % list.length;
    img.src = list[at];
    box.querySelector(".v-count").textContent = list.length > 1 ? `${at + 1} / ${list.length}` : "";
    box.querySelector(".v-prev").hidden = box.querySelector(".v-next").hidden = list.length < 2;
    reset();
  };
  const close = () => { box.hidden = true; img.removeAttribute("src"); };
  const zoomAt = (factor, cx, cy) => {
    const next = Math.min(8, Math.max(1, scale * factor));
    // keep the point under the finger/cursor where it is
    const ox = cx - window.innerWidth / 2 - x, oy = cy - window.innerHeight / 2 - y;
    x -= ox * (next / scale - 1); y -= oy * (next / scale - 1);
    scale = next;
    if (scale === 1) { x = 0; y = 0; }
    draw();
  };
  document.addEventListener("click", (e) => {
    const link = e.target.closest("a[data-view]");
    if (!link || e.ctrlKey || e.metaKey || e.button !== 0) return; // ctrl/middle click: a new tab, as before
    e.preventDefault();
    list = [...link.parentElement.querySelectorAll("a[data-view]")].map((a) => a.href);
    box.hidden = false;
    show(list.indexOf(link.href));
  });
  box.querySelector(".v-close").onclick = close;
  box.querySelector(".v-prev").onclick = () => show(at - 1);
  box.querySelector(".v-next").onclick = () => show(at + 1);
  box.addEventListener("click", (e) => { if (e.target === box) close(); });
  document.addEventListener("keydown", (e) => {
    if (box.hidden) return;
    if (e.key === "Escape") close();
    if (e.key === "ArrowLeft") show(at - 1);
    if (e.key === "ArrowRight") show(at + 1);
  });
  box.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
  img.addEventListener("dblclick", (e) => { scale > 1 ? reset() : zoomAt(2.5, e.clientX, e.clientY); });
  img.addEventListener("pointerdown", (e) => {
    img.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), scale };
      drag = swipeX = null;
    } else {
      drag = { x: e.clientX - x, y: e.clientY - y };
      swipeX = scale === 1 ? e.clientX : null;
      // double tap on touch screens (dblclick isn't sent for touch everywhere)
      if (e.pointerType === "touch") {
        if (Date.now() - lastTap < 300) { scale > 1 ? reset() : zoomAt(2.5, e.clientX, e.clientY); drag = swipeX = null; }
        lastTap = Date.now();
      }
    }
    e.preventDefault();
  });
  img.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      zoomAt((pinch.scale * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d) / scale, (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else if (drag && scale > 1) {
      x = e.clientX - drag.x; y = e.clientY - drag.y; draw();
    }
  });
  const up = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (swipeX !== null && list.length > 1 && Math.abs(e.clientX - swipeX) > 60) show(at + (e.clientX < swipeX ? 1 : -1));
    swipeX = null;
    if (!pointers.size) drag = null;
  };
  img.addEventListener("pointerup", up);
  img.addEventListener("pointercancel", up);
})();
</script>
</body>
</html>
