<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emHUB</title>
<link rel="icon" href="/favicon.svg?v=1.18">
<link rel="stylesheet" href="/brand.css?v=1.31">
<style>
  body { display: grid; grid-template-columns: 220px 1fr; min-height: 100dvh; }

  /* ---- rail */
  .rail { background: var(--rail); color: var(--rail-text); display: flex; flex-direction: column; padding: 22px 12px 16px; position: sticky; top: 0; height: 100dvh; box-sizing: border-box; }
  .rail-brand { padding: 0 10px 20px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
  .rail-brand svg { grid-row: span 2; }
  .rail-brand strong { font-family: var(--display); font-size: 28px; color: #fff; display: block; line-height: 1; }
  .rail-brand span { font-size: 13px; }
  .rail nav { display: flex; flex-direction: column; }
  .rail nav a {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; color: inherit; text-decoration: none; font-weight: 500; border-radius: 12px;
  }
  .rail nav a:hover { color: #fff; background: rgba(255,255,255,0.04); }
  .rail nav a[aria-current="page"] { color: #fff; background: #1E4A2D; }
  .rail .count { font-family: var(--display); font-weight: 700; font-size: 14px; background: var(--amber); color: #0B3D1C; border-radius: 6px; padding: 0 7px; }
  .rail-foot { margin-top: auto; padding: 14px; font-size: 13px; background: var(--surface); border-radius: 14px; }
  .rail-foot button { background: none; border: 0; color: var(--rail-text); padding: 0; cursor: pointer; text-decoration: underline; }

  main { min-width: 0; }
  .page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 22px 28px 14px; }
  .page-head h1 { font-size: 30px; }

  /* ---- bugs */
  .split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; border-top: 1px solid var(--line); min-height: calc(100dvh - 76px); }
  .list { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100dvh - 76px); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 1; }
  .filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .filters input { flex: 1 1 100%; }
  .bug-row { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .bug-row:hover { background: var(--surface); }
  .bug-row[aria-current="true"] { background: var(--surface); box-shadow: inset 4px 0 0 var(--sign); }
  .bug-row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bug-row .m { grid-column: 2; font-size: 13px; color: var(--muted); display: flex; gap: 10px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--muted); }
  .status.new::before { background: var(--amber); }
  .status.triaged::before { background: var(--sign); }
  .status.in_progress::before { background: var(--late); }
  .status.awaiting_release::before { background: var(--amber); border-radius: 50%; }
  .status.resolved::before { background: var(--ok); }

  .detail { padding: 22px 28px 40px; min-width: 0; }
  .detail-head { display: flex; gap: 14px; align-items: flex-start; }
  .detail-head h2 { font-size: 26px; overflow-wrap: anywhere; }
  .meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px 20px; margin: 18px 0; padding: 14px 0; border-block: 1px solid var(--line); font-size: 14px; }
  .meta dt { color: var(--muted); font-size: 13px; }
  .meta dd { margin: 0; overflow-wrap: anywhere; }
  .status-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--sign); }
  .desc { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 75ch; }
  .logs-tools { display: flex; gap: 8px; margin-bottom: 8px; }
  .logs { background: #08130E; color: #D6E8DD; font: 12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 14px; border-radius: 4px; max-height: 480px; overflow: auto; white-space: pre; }
  .logs mark { background: var(--amber); color: #0B3D1C; }
  .logs .e { color: #FF9A8C; }
  .logs .w { color: #FFD27A; }

  .thread { list-style: none; margin: 24px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-width: 75ch; }
  .msg { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; }
  .msg header { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .msg.reply { border-left: 4px solid var(--sign); }
  .msg.note { border-left: 4px solid var(--amber); background: color-mix(in srgb, var(--amber) 8%, var(--surface)); }
  .msg.system, .msg.status { background: transparent; border-style: dashed; font-size: 14px; }
  .msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .mail-failed { color: var(--bad); }
  .composer { margin-top: 18px; max-width: 75ch; display: flex; flex-direction: column; gap: 10px; }
  .composer-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .preview { border: 1px solid var(--line); border-radius: 4px; width: 100%; height: 520px; background: #fff; }

  .empty { padding: 60px 28px; color: var(--muted); max-width: 48ch; }
  .empty h2 { color: var(--ink); margin-bottom: 6px; }

  /* ---- community */
  .section { padding: 0 28px 28px; }
  .section h2 { font-size: 20px; margin: 10px 0 10px; }
  table.grid { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
  table.grid th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  table.grid td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.grid tr.click { cursor: pointer; }
  table.grid tr.click:hover td { background: color-mix(in srgb, var(--sign) 5%, var(--surface)); }
  table.grid tr[aria-selected="true"] td { background: color-mix(in srgb, var(--sign) 10%, var(--surface)); }
  .delay { font-family: var(--display); font-weight: 700; font-size: 17px; }
  .delay.on { color: var(--ok); }
  .delay.late { color: var(--late); }
  .delay.very { color: var(--bad); }
  .table-wrap { overflow-x: auto; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat b { font-family: var(--display); font-size: 26px; display: block; line-height: 1; }
  .stat span { font-size: 13px; color: var(--muted); }

  /* ---- settings */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; padding: 0 28px 40px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-size: 20px; }
  .card p { margin: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .kv { font-size: 14px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--paper); padding: 1px 5px; border-radius: 3px; }
  .stack-form { display: flex; flex-direction: column; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wide-card { grid-column: 1 / -1; }
  .wide-card > form, .wide-card > p, .wide-card > .row, .wide-card > #invite-result { max-width: 760px; }
  #invite-result { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  #invite-result p { margin: 0; }
  table.grid td .btn { padding: 5px 10px; font-size: 14px; }
  .templates .list { max-height: none; }
  .editor { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .editor textarea { width: 100%; min-height: 560px; font: 12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 12px; tab-size: 2; }
  .editor .preview { height: 560px; }
  @media (max-width: 1100px) { .editor { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 4px; font-size: 14px; z-index: 10; max-width: calc(100vw - 32px); }

  @media (max-width: 900px) {
    /* Phones: one column that never gets wider than the screen (EM: the rail made pages 564 px wide). */
    /* The header row keeps its own height; short pages (Submissions, Lines) used to stretch it to fill the screen. */
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .rail { position: sticky; top: 0; z-index: 5; height: auto; display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 10px 14px 0; }
    .rail-brand { padding: 0; }
    .rail-brand strong { font-size: 22px; }
    .rail-brand span { display: none; }
    .rail nav { grid-column: 1 / -1; flex-direction: row; overflow-x: auto; scrollbar-width: none; margin: 6px -14px 0; padding: 0 6px; }
    .rail nav::-webkit-scrollbar { display: none; }
    .rail nav a { padding: 10px 10px 9px; border-left: 0; border-bottom: 3px solid transparent; gap: 6px; white-space: nowrap; flex: none; }
    .rail nav a[aria-current="page"] { border-bottom-color: var(--amber); }
    .rail-foot { margin: 0; padding: 0; grid-column: 2; grid-row: 1; }
    .rail-foot .who { display: none; }
    /* 16 px text fields: iPhones zoom into anything smaller and stay zoomed. */
    input, select, textarea { font-size: 16px !important; }
    .page-head { padding-top: 16px; }
    .page-head h1 { font-size: 24px; }
    .detail-head h2 { font-size: 21px; }
    .filters button { padding: 7px 12px; }
    .btn { min-height: 40px; }
    .meta { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .logs { max-height: 60vh; }
    .preview, .editor .preview { height: 420px; }
    .editor textarea { min-height: 360px; }
    .stats { gap: 18px; }
    main img { max-width: 100%; }
    .split { grid-template-columns: 1fr; }
    .list { max-height: none; border-right: 0; }
    .split.has-detail .list { display: none; }
    .split:not(.has-detail) .detail { display: none; }
    .page-head, .detail, .section { padding-left: 16px; padding-right: 16px; }
    .cards { padding: 0 16px 32px; grid-template-columns: 1fr; }
  }
  .back { display: none; }
  @media (max-width: 900px) { .back { display: inline-flex; margin-bottom: 12px; } }
  /* Narrow screens: every table row becomes a small card of "label  value" lines (labels from the header). */
  @media (max-width: 700px) {
    table.grid thead { display: none; }
    table.grid, table.grid tbody, table.grid tr, table.grid td { display: block; width: 100%; }
    table.grid { border-width: 1px 1px 0; }
    table.grid tr { border-bottom: 1px solid var(--line); padding: 6px 0; }
    table.grid td { border: 0; padding: 5px 12px; text-align: right; overflow-wrap: anywhere; position: relative; }
    table.grid td[data-label] { padding-left: 42%; min-height: 30px; }
    table.grid td[data-label]::before { content: attr(data-label); position: absolute; left: 12px; top: 6px; max-width: 38%;
      color: var(--muted); font-size: 13px; text-align: left; }
    table.grid td.row { justify-content: flex-end; }
    table.grid td:empty { display: none; }
  }
  .more { margin-top: 10px; }
  /* Image viewer for reporters' photos: zoom (pinch, wheel, double tap), pan, swipe between them. */
  .viewer { position: fixed; inset: 0; z-index: 1000; background: rgba(8, 10, 12, .94); touch-action: none; overflow: hidden; }
  .viewer[hidden] { display: none; }
  .viewer img { position: absolute; left: 50%; top: 50%; max-width: 96vw; max-height: 88vh; transform-origin: center;
    user-select: none; -webkit-user-drag: none; cursor: zoom-in; }
  .viewer.zoomed img { cursor: grab; }
  .viewer button { position: absolute; border: 0; border-radius: 999px; width: 44px; height: 44px; font-size: 22px;
    background: rgba(255, 255, 255, .14); color: #fff; cursor: pointer; }
  .viewer button:hover { background: rgba(255, 255, 255, .26); }
  .viewer .v-close { top: 14px; right: 14px; }
  .viewer .v-prev { left: 14px; top: 50%; margin-top: -22px; }
  .viewer .v-next { right: 14px; top: 50%; margin-top: -22px; }
  .viewer .v-count { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: #cfd6dd; font-size: 13px; }
  /* the map */
  .map-wrap { display: grid; grid-template-columns: 1fr 390px; height: calc(100dvh - 76px); border-top: 1px solid var(--line); }
  #map { height: 100%; }
  .busy-note { background: #5a3a00; color: #ffd28a; border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .own-stops li { display: flex; gap: 6px; align-items: center; }
  .sub { max-width: 760px; padding: 16px 0 18px; border-bottom: 1px solid var(--line); }
  .map-tools { gap: 6px; }
  .notice-card.warning { border-left: 4px solid var(--late); }
  .error-log { border-top: 1px solid var(--line); padding: 8px 0; }
  .error-log summary { cursor: pointer; }
  .error-log pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; margin: 8px 0 0; }
  .warn-text { color: var(--late); }
  .notice-card .line-card-head { flex-wrap: wrap; }
  .spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 24px; }
  .spark i { width: 6px; background: var(--sign); border-radius: 1px; display: block; }
  .spark i.none { background: var(--line); }
  .spark i.bad { background: var(--bad); }
  .spark i.warn { background: var(--late); }
  .build { border-bottom: 1px solid var(--line); padding: 8px 0; max-width: 900px; }
  .build summary { cursor: pointer; }
  .build p { margin: 6px 0 0 16px; }
  .todo-list, .hist-list { margin: 8px 0; padding-left: 20px; display: grid; gap: 8px; }
  .todo-list li button.link { text-align: left; color: var(--ink); padding: 0; font-weight: 600; }
  .hist-list { list-style: none; padding: 0; }
  .hist-list li { border-bottom: 1px solid var(--line); padding: 6px 0 8px; display: grid; gap: 4px; }
  .hist-list li button { justify-self: start; }
  .hist-list li.undone { opacity: .55; }
  .tag { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
  button.tag { cursor: pointer; font: inherit; font-size: 12px; }
  button.tag[aria-pressed="true"] { background: var(--amber); color: #0B3D1C; border-color: var(--amber); }
  .label-filter { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
  .bug-row .tags { gap: 4px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 3px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--sign); color: var(--sign-ink); font-weight: 600; }
  .fix-row { align-items: flex-end; gap: 12px; margin: 0 0 16px; max-width: 75ch; }
  .similar { border-left: 3px solid var(--amber); padding: 6px 12px; margin: 0 0 16px; max-width: 75ch; }
  .similar h3 { font-size: 15px; margin: 0 0 4px; }
  .similar ul { margin: 0; padding-left: 18px; }
  .rel-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .rel { display: flex; flex-direction: column; padding: 8px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); text-decoration: none; background: var(--surface); }
  .rel.on { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
  .rel b { font-family: var(--display); font-size: 18px; }
  .rel-items { max-width: 75ch; padding-left: 18px; }
  .notes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; max-width: 900px; }
  .notes-grid textarea { width: 100%; font: 14px/1.5 var(--body); }
  .count-chars { float: right; font-size: 12px; color: var(--muted); }
  .count-chars.over { color: var(--bad); font-weight: 600; }
  .release-box { margin-top: 22px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); max-width: 900px; }
  .release-box p { margin: 0 0 10px; }
  .reply-form { max-width: 900px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 0 0 24px; display: grid; gap: 12px; }
  .reply-form h2 { margin: 0; }
  /* Phones: forms never wider than the screen (grid items would grow to their text boxes' own width). */
  .reply-form, .line-form { grid-template-columns: minmax(0, 1fr); }
  .notes-grid { grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); }
  .reply-form .input, .line-form .input { min-width: 0; max-width: 100%; box-sizing: border-box; }
  .line-form { max-width: 860px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin: 0 0 28px; display: grid; gap: 12px; }
  .line-form h2 { margin: 0; } .line-form h3 { margin: 6px 0 0; font-size: 16px; }
  .line-grid { display: grid; grid-template-columns: 140px 1fr 1fr; gap: 12px; }
  .line-days { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .line-days legend { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .line-days .day { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .day-presets { display: inline-flex; gap: 10px; margin-left: 8px; }
  .line-stops { margin: 0; padding-left: 26px; display: grid; gap: 6px; }
  .line-stops li { display: flex; gap: 8px; align-items: center; }
  .line-stops .stop-name { flex: 1; min-width: 0; }
  .line-stops .mins { width: 84px; padding: 5px 8px; }
  .stop-hits { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 6px; }
  .gen { gap: 8px; } .gen .input { width: auto; padding: 6px 8px; } #gen-every { width: 76px; }
  .line-list { display: grid; gap: 12px; max-width: 860px; }
  .line-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .line-card-head { display: flex; gap: 10px; align-items: center; }
  .line-card p { margin: 6px 0 10px; }
  button.link { background: none; border: 0; color: var(--sign); cursor: pointer; padding: 2px 4px; font: inherit; }
  button.link:disabled { opacity: .35; cursor: default; }
  @media (max-width: 700px) { .line-grid { grid-template-columns: 1fr; } }
  .sub header { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 6px; }
  .sub h3 { font-size: 18px; margin: 0; }
  .sub-stops { margin: 6px 0 10px; padding-left: 22px; columns: 2 260px; }
  .sub-stops b { font-variant-numeric: tabular-nums; margin-right: 6px; }
  .sub-actions { gap: 8px; flex-wrap: wrap; }
  .sub-actions .input { flex: 1 1 220px; }
  .op-filter { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin: 0 0 8px; padding: 0 28px; }
  @media (max-width: 900px) { .op-filter { padding: 0 16px; } }
  .op-filter label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  button { transition: transform .06s, filter .12s; }
  button:hover:not(:disabled) { filter: brightness(1.12); }
  button:active:not(:disabled) { transform: scale(.96); filter: brightness(1.25); }
  button.working { opacity: .6; cursor: progress; pointer-events: none; }
  button.working::after { content: " …"; }
  .via-pin { background: #F59E0B; color: #111; font-weight: 700; font-size: 11px; border: 2px solid #fff; border-radius: 50%;
    width: 20px; height: 20px; display: grid; place-items: center; transform: translate(-10px, -10px); }
  .own-stops li span { flex: 1; }
  .map-side { border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px; background: var(--surface); font-size: 14px; }
  .line-routes { list-style: none; padding: 0; margin: 8px 0; }
  .line-routes button { width: 100%; text-align: left; margin: 0 0 6px; white-space: normal; }
  #line-find input { flex: 1; min-width: 0; }
  .map-side h2 { font-size: 20px; margin: 0 0 6px; }
  .map-side .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .map-side button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 7px 12px;
    min-height: 34px; font: 600 13.5px/1.25 var(--body, inherit); cursor: pointer; }
  .map-side button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  /* A row of buttons only: an even grid (2, 3, or 2 per line with an odd last one across), never 3 and then 1 on its own. */
  .map-side .row:not(:has(> :not(button))) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .map-side .row:not(:has(> :not(button))):has(> button:nth-child(3):last-child) { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  /* Small icon actions in lists (remove, add after): no box until hovered. */

  .own-stops { padding-left: 22px; }

  .bus-icon.live { background: #1E8A4C; }
  .bus-icon.late { background: #C77700; }

  .vertex { background: #fff; border: 2px solid #1D4FB8; border-radius: 50%; }

  .place-row { border-top: 1px solid var(--line); padding: 6px 0; display: grid; gap: 6px; }

  .lines-pick details[open] { max-height: 280px; overflow-y: auto; }
  .pick { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 14px; }
  .pick input { flex: none; }
  .pick-tools { display: flex; gap: 6px; margin: 6px 0; }
  @media (max-width: 900px) {
    /* Phones: the map stays at the top (pinned, over the menu) while the panel under it scrolls. */

    #map { position: sticky; top: 0; z-index: 6; height: 46dvh; border-bottom: 2px solid var(--line); }
    .map-side { border-left: 0; overflow: visible; min-height: 60dvh; }
    .map-panel { border-left: 0; }
    .page-head .legend { display: flex; flex-wrap: wrap; gap: 4px 0; }
    .map-side .row { flex-wrap: wrap; }
    .map-side button { padding: 8px 12px; }
    .map-side .input { font-size: 16px; } /* phones zoom into smaller fields */
    .leaflet-touch .leaflet-control-zoom a { width: 36px; height: 36px; line-height: 36px; }
  }

  /* 1.19: the panel closes for a full-screen map; places and sub-stations are numbered cards with their directions. */
  .map-wrap.closed { grid-template-columns: 1fr; }
  .map-wrap.closed .map-panel { display: none; }
  .map-panel { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: var(--surface); }
  .map-panel .map-side { border-left: 0; flex: 1; min-height: 0; }
  .side-x { position: absolute; top: 10px; right: 10px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; font-size: 15px; }
  .map-side h2 { padding-right: 40px; }
  .map-toggle { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #6EE7A8; background: #0C1A14; color: #6EE7A8; font: 700 20px/1 var(--display); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .spot { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 8px 0; display: grid; gap: 8px; background: var(--paper); }
  .spot.on { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
  .spot-head { display: flex; gap: 6px; align-items: center; }
  .pnum-badge { flex: none; min-width: 26px; height: 26px; border-radius: 13px; background: #7C3AED; color: #fff; font: 700 14px/26px var(--display); text-align: center; padding: 0 6px; cursor: pointer; border: 0; }
  .child-row .pnum-badge { background: #0F766E; }
  .pnum { background: #7C3AED; color: #fff; border: 2px solid #fff; border-radius: 50%; font: 700 12px/18px var(--display, sans-serif); text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .pnum.child { background: #0F766E; }
  .pnum.on { background: #6EE7A8; color: #0B3D1C; outline: 3px solid #6EE7A8; outline-offset: 2px; }
  .dir { border-left: 3px solid var(--line); padding-left: 8px; display: grid; gap: 6px; }
  .map-side { overflow-x: hidden; }
  .spot, .dir, .dirs, .lines-pick { min-width: 0; }
  .spot, .dir { grid-template-columns: minmax(0, 1fr); }
  .spot select.input { width: 100%; }
  .dirs { display: grid; gap: 12px; }
  .spot .input { box-sizing: border-box; max-width: 100%; }
  .dir > .input, .lines-pick > .input, .child-row > .input { width: 100%; }
  .spot-head .input { min-width: 0; }
  .dir .row { margin: 0; }
  .unassigned { color: var(--late); }
</style>

<script>
"use strict";
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = $("#view");
const STATUSES = ["new", "triaged", "in_progress", "awaiting_release", "resolved", "closed"];
const label = (s) => s === "awaiting_release" ? "Waiting for update" : s.replace("_", " ").replace(/^./, (c) => c.toUpperCase());
let me = null;
let bugFilter = { status: "open", q: "" };

const MAP_TAB = Math.random().toString(36).slice(2) + Date.now().toString(36);

async function api(path, body) {
  // A button that sends something shows it's working until the answer is back (so a click is seen, and not repeated).
  const pressed = body !== undefined && document.activeElement?.tagName === "BUTTON" ? document.activeElement : null;
  pressed?.classList.add("working");
  const res = await fetch("/admin/api/" + path, body === undefined ? { headers: { "X-Map-Tab": MAP_TAB } } : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Map-Tab": MAP_TAB }, body: JSON.stringify(body),
  }).finally(() => pressed?.classList.remove("working"));
  if (res.status === 401) { location.href = "/login"; throw new Error("signed out"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed (" + res.status + ")");
  return data;
}

function toast(text) {
  const el = $("#toast");
  el.textContent = text; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 3500);
}

function ago(seconds) {
  const d = Math.max(0, Date.now() / 1000 - seconds);
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + " min ago";
  if (d < 86400) return Math.floor(d / 3600) + " h ago";
  return new Date(seconds * 1000).toLocaleDateString();
}
const when = (s) => new Date(s * 1000).toLocaleString();

function delayText(sec) {
  if (sec == null) return { text: "–", cls: "" };
  const m = Math.round(sec / 60);
  if (m <= 0 && m >= -1) return { text: m < 0 ? m + " min" : "on time", cls: "on" };
  if (m < 0) return { text: m + " min", cls: "on" };
  return { text: "+" + m + " min", cls: m >= 10 ? "very" : "late" };
}

// ------------------------------------------------------------------ router

async function route() {
  const [page, arg] = location.hash.slice(1).split("/");
  document.querySelectorAll("[data-nav]").forEach((a) =>
    a.setAttribute("aria-current", (a.dataset.nav === ({ bug: "bugs", idea: "ideas", templates: "settings", replies: "settings", activity: "settings" }[page] || page || "bugs")) ? "page" : "false"));
  try {
    if (page === "community") return await renderCommunity(arg);
    if (page === "submissions") return await renderSubmissions();
    if (page === "lines") return await renderLines();
    if (page === "releases") return await renderReleases(arg);
    if (page === "notices") return await renderNotices(arg);
    if (page === "replies") return await renderReplies(arg);
    if (page === "activity") return await renderActivity();
    if (page === "server") return await renderServer();
    if (page === "timetable") return await renderTimetable();
    if (page === "map") return renderMap(arg ? decodeURIComponent(arg) : null);
    if (page === "settings") return await renderSettings(arg);
    if (page === "templates") return await renderTemplates(arg);
    if (page === "site") return await renderSite(arg);
    if (page === "ideas" || page === "idea") return await renderBugs(page === "idea" ? Number(arg) : null, "feature");
    return await renderBugs(page === "bug" ? Number(arg) : null, "bug");
  } catch (e) {
    if (e.message !== "signed out") view.innerHTML = `<div class="empty"><h2>Couldn't load this page</h2><p>${esc(e.message)}</p></div>`;
  }
}
addEventListener("hashchange", route);

async function refreshCounts() {
  const s = await api("stats");
  const n = s.bugs.new || 0;
  const el = $("#count-new");
  el.textContent = n; el.hidden = !n;
  const ideas = $("#count-ideas"), i = (s.ideas || {}).new || 0;
  ideas.textContent = i; ideas.hidden = !i;
  const subs = $("#count-subs");
  subs.textContent = s.submissions || 0; subs.hidden = !s.submissions;
  return s;
}

// ------------------------------------------------------------------ lines added here (city and intercity)

/** "6:05" from seconds of the day; and the other way, null when it isn't a time. */
const hhmm = (secs) => `${Math.floor(secs / 3600)}:${String(Math.floor(secs % 3600 / 60)).padStart(2, "0")}`;
const secsOf = (text) => { const m = /^(\d{1,2}):(\d{2})$/.exec(text.trim()); return m && +m[2] < 60 ? +m[1] * 3600 + +m[2] * 60 : null; };
const WORKDAYS = [0, 1, 2, 3, 4], WEEKEND = [5, 6], EVERY_DAY = [0, 1, 2, 3, 4, 5, 6];
const daysText = (days) => days.length === 7 ? "every day" : days.join() === WORKDAYS.join() ? "workdays" : days.join() === WEEKEND.join() ? "weekends"
  : days.map((x) => DAY_NAMES[x]).join(", ");

/**
 * Lines added in the dashboard: a number, the days, the stops with the minutes after the first one, and the departures
 * from the first stop. Each departure is a trip of the timetable (planner, stop boards, following, offline packs).
 */
async function renderLines() {
  const { lines, operators } = await api("lines");
  view.innerHTML = `
    <div class="page-head"><h1>Lines</h1><button class="btn" id="line-new" type="button">Add a line</button></div>
    <div class="section">
      <p class="muted" style="max-width:72ch;margin:0 0 16px">City (MHD) and intercity lines the timetable doesn't have. Each departure becomes a bus
        in the apps' planner and stop boards, can be followed, and goes into the offline timetables, about half a minute after saving.
        A stop the timetable lacks: open the Map and use <em>New stop here</em> first.</p>
      <div id="line-editor"></div>
      <h2>${lines.length ? "Lines added here" : "No lines added yet"}</h2>
      <div class="line-list">${lines.map((x) => `<article class="line-card" data-id="${x.id}">
        <div class="line-card-head"><span class="plate line">${esc(x.data.line)}</span>
          <b>${esc(x.data.stopNames[0])} → ${esc(x.data.stopNames.at(-1))}</b></div>
        <p class="muted small">${esc(x.data.operator || "No operator")} · ${esc(daysText(x.data.weekdays))} · ${x.data.departures.length} departure${x.data.departures.length === 1 ? "" : "s"}
          (${x.data.departures.slice(0, 6).map(hhmm).join(", ")}${x.data.departures.length > 6 ? ", …" : ""}) · ${x.data.stops.length} stops · changed by ${esc(x.updated_by)} ${ago(x.updated_at)}</p>
        ${x.data.validFrom || x.data.validTo ? `<p class="small">Runs ${x.data.validFrom ? "from " + esc(x.data.validFrom) : ""}${x.data.validTo ? " until " + esc(x.data.validTo) : ""}</p>` : ""}
        <div class="row"><button class="btn quiet" data-act="edit" type="button">Edit</button><button class="btn quiet" data-act="copy" type="button">Copy</button><button class="btn quiet" data-act="back" type="button">Add the way back</button>
          <button class="btn danger" data-act="delete" type="button">Delete</button></div></article>`).join("")}</div>
    </div>`;
  $("#line-new").onclick = () => lineEditor(null, null, operators);
  view.querySelector(".line-list").onclick = async (e) => {
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const x = lines.find((l) => l.id === Number(b.closest("[data-id]").dataset.id));
    if (b.dataset.act === "edit") return lineEditor(x.id, x.data, operators);
    if (b.dataset.act === "copy") return lineEditor(null, x.data, operators); // a similar line: change what differs
    if (b.dataset.act === "back") {
      // The same stops the other way, each the same minutes from the end; departures are for you to fill in.
      const total = x.data.stops.at(-1)[1];
      const stops = [...x.data.stops].reverse().map(([id, m], i) => [id, total - m, [...x.data.stopNames].reverse()[i]]);
      return lineEditor(null, { ...x.data, headsign: "", stops, stopNames: stops.map((s) => s[2]), departures: [] }, operators);
    }
    if (!confirm(`Delete line ${x.data.line} (${x.data.departures.length} departures)? Its buses leave the timetable.`)) return;
    await api(`lines/${x.id}/delete`, {});
    toast("Deleted: gone from the timetable in about half a minute");
    renderLines();
  };
}

function lineEditor(id, d, operators) {
  const box = $("#line-editor");
  const data = d || { line: "", headsign: "", operator: "", weekdays: WORKDAYS, stops: [], stopNames: [], departures: [] };
  let stops = data.stops.map(([sid, minutes], i) => ({ id: sid, name: data.stopNames?.[i] || sid, minutes }));
  box.innerHTML = `<form class="line-form" autocomplete="off">
    <h2>${id ? `Edit line ${esc(data.line)}` : "New line"}</h2>
    <div class="line-grid">
      <label class="field">Line<input class="input" name="line" maxlength="12" required value="${esc(data.line)}" placeholder="12 or 60150"></label>
      <label class="field">Operator<input class="input" name="operator" maxlength="80" list="line-ops" value="${esc(data.operator)}" placeholder="MHD Banská Bystrica"></label>
      <label class="field">Destination shown<input class="input" name="headsign" maxlength="80" value="${esc(data.headsign)}" placeholder="The last stop"></label>
    </div>
    <datalist id="line-ops">${operators.map((o) => `<option value="${esc(o)}">`).join("")}</datalist>
    <div class="row" style="gap:12px">
      <label class="field">Valid from (optional)<input class="input" type="date" name="validFrom" value="${esc(data.validFrom || "")}"></label>
      <label class="field">Valid until (optional)<input class="input" type="date" name="validTo" value="${esc(data.validTo || "")}"></label>
    </div>
    <fieldset class="line-days"><legend>Runs on</legend>
      ${DAY_NAMES.map((n, i) => `<label class="day"><input type="checkbox" name="day" value="${i}" ${data.weekdays.includes(i) ? "checked" : ""}> ${n}</label>`).join("")}
      <span class="day-presets"><button type="button" class="link" data-days="w">Workdays</button><button type="button" class="link" data-days="e">Weekends</button>
        <button type="button" class="link" data-days="a">Every day</button></span></fieldset>
    <h3>Stops</h3>
    <p class="muted small">In order, each with the minutes after the first stop (the first is 0).</p>
    <ol class="line-stops" id="line-stops"></ol>
    <div class="stop-find"><input class="input" id="line-stop-q" placeholder="Add a stop: type its name" aria-label="Add a stop"><div id="line-stop-hits" class="stop-hits"></div></div>
    <h3>Departures from the first stop</h3>
    <textarea class="input" name="departures" rows="3" placeholder="6:05 6:35 7:05 14:40">${esc(data.departures.map(hhmm).join(" "))}</textarea>
    <div class="row gen"><span class="muted small">Or every</span><input class="input" type="number" min="1" max="240" id="gen-every" value="30" aria-label="Every how many minutes">
      <span class="muted small">min from</span><input class="input" type="time" id="gen-from" value="05:00" aria-label="From"><span class="muted small">to</span>
      <input class="input" type="time" id="gen-to" value="22:00" aria-label="To"><button type="button" class="btn quiet" id="gen-add">Add these times</button></div>
    <p class="error-text" id="line-error" hidden></p>
    <div class="row"><button class="btn" type="submit">${id ? "Save the line" : "Add the line"}</button><button class="btn quiet" type="button" id="line-cancel">Cancel</button></div>
  </form>`;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  const form = box.querySelector("form");
  const drawStops = () => {
    $("#line-stops").innerHTML = stops.map((x, i) => `<li data-i="${i}"><span class="stop-name">${esc(x.name)}</span>
      <input class="input mins" type="number" min="0" max="1440" value="${x.minutes}" ${i === 0 ? "disabled" : ""} aria-label="Minutes after the first stop"><span class="muted small">min</span>
      <button type="button" class="link" data-move="-1" ${i === 0 ? "disabled" : ""} title="Move up" aria-label="Move up">↑</button>
      <button type="button" class="link" data-move="1" ${i === stops.length - 1 ? "disabled" : ""} title="Move down" aria-label="Move down">↓</button>
      <button type="button" class="link" data-del title="Remove" aria-label="Remove">✕</button></li>`).join("")
      || `<li class="muted small">No stops yet: add the first one below.</li>`;
  };
  drawStops();
  $("#line-stops").oninput = (e) => {
    const li = e.target.closest("[data-i]");
    if (li && e.target.matches(".mins")) stops[Number(li.dataset.i)].minutes = Number(e.target.value);
  };
  $("#line-stops").onclick = (e) => {
    const li = e.target.closest("[data-i]");
    if (!li) return;
    const i = Number(li.dataset.i);
    if (e.target.closest("[data-del]")) stops.splice(i, 1);
    const mv = e.target.closest("[data-move]");
    if (mv) { const j = i + Number(mv.dataset.move); [stops[i], stops[j]] = [stops[j], stops[i]]; }
    if (stops[0]) stops[0].minutes = 0;
    drawStops();
  };
  let timer = null;
  $("#line-stop-q").oninput = (e) => {
    clearTimeout(timer);
    const q = e.target.value.trim();
    timer = setTimeout(async () => {
      if (q.length < 2) return ($("#line-stop-hits").innerHTML = "");
      const r = await api("timetable/stops?q=" + encodeURIComponent(q) + "&n=8");
      $("#line-stop-hits").innerHTML = r.stops.map((x, i) => `<button type="button" class="link" data-hit="${i}">${esc(x.name)}</button>`).join("")
        || `<span class="muted small">No such stop. Place it on the Map with <em>New stop here</em>.</span>`;
      $("#line-stop-hits").onclick = (ev) => {
        const b = ev.target.closest("[data-hit]");
        if (!b) return;
        const x = r.stops[Number(b.dataset.hit)];
        stops.push({ id: x.id, name: x.name, minutes: stops.length ? stops.at(-1).minutes + 2 : 0 });
        $("#line-stop-q").value = ""; $("#line-stop-hits").innerHTML = "";
        drawStops();
        $("#line-stop-q").focus();
      };
    }, 250);
  };
  form.querySelectorAll("[data-days]").forEach((b) => (b.onclick = () => {
    const want = { w: WORKDAYS, e: WEEKEND, a: EVERY_DAY }[b.dataset.days];
    form.querySelectorAll("[name=day]").forEach((c) => (c.checked = want.includes(Number(c.value))));
  }));
  $("#gen-add").onclick = () => {
    const every = Number($("#gen-every").value), from = secsOf($("#gen-from").value), to = secsOf($("#gen-to").value);
    if (!every || from == null || to == null || to < from) return toast("Set every how many minutes, and from and to");
    const times = [];
    for (let t = from; t <= to && times.length < 300; t += every * 60) times.push(hhmm(t));
    form.departures.value = (form.departures.value.trim() + " " + times.join(" ")).trim();
  };
  $("#line-cancel").onclick = () => (box.innerHTML = "");
  form.onsubmit = async (e) => {
    e.preventDefault();
    const words = form.departures.value.split(/[\s,;]+/).filter(Boolean);
    const wrong = words.filter((w) => secsOf(w) == null);
    const error = $("#line-error");
    if (wrong.length) { error.textContent = `Not a time: ${wrong.slice(0, 3).join(", ")}. Write times like 6:05.`; error.hidden = false; return; }
    const body = {
      line: form.line.value, operator: form.operator.value, headsign: form.headsign.value,
      weekdays: [...form.querySelectorAll("[name=day]:checked")].map((c) => Number(c.value)),
      stops: stops.map((x) => [x.id, x.minutes]), departures: words, validFrom: form.validFrom.value, validTo: form.validTo.value,
    };
    try {
      await api(id ? `lines/${id}` : "lines", body);
    } catch (err) { error.textContent = err.message; error.hidden = false; return; }
    toast(id ? "Saved: in the timetable in about half a minute" : "Added: in the timetable in about half a minute");
    renderLines();
  };
}

/** epoch seconds <-> the value of an <input type="datetime-local"> (local time). */
const toLocalInput = (sec) => { if (!sec) return ""; const d = new Date(sec * 1000); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fromLocalInput = (v) => (v ? Math.round(new Date(v).getTime() / 1000) : null);

          <label class="field">Title in English<input class="input" name="title_en" maxlength="120" value="${esc(editing.title_en)}" placeholder="Line 7 detour"></label>
          <label class="field">Text in Slovak<textarea class="input" name="body_sk" rows="4">${esc(editing.body_sk)}</textarea></label>
          <label class="field">Text in English<textarea class="input" name="body_en" rows="4">${esc(editing.body_en)}</textarea></label>
        </div>
        <div class="notes-grid">
          <label class="field">Lines (optional)<input class="input" name="lines" value="${esc(editing.lines)}" placeholder="7, 8, 60101"></label>
          <label class="field">Stops (optional, separated by ;)<input class="input" name="stops" value="${esc(editing.stops)}" placeholder="Zvolen, AS; Zvolen, Námestie SNP"></label>
          <label class="field">Shows from (empty: now)<input class="input" type="datetime-local" name="starts_at" value="${toLocalInput(editing.starts_at)}"></label>
          <label class="field">Until (empty: until you delete it)<input class="input" type="datetime-local" name="ends_at" value="${toLocalInput(editing.ends_at)}"></label>
        </div>
        <p class="muted small">A notice in one language only is shown in that language to everyone.</p>
        <p class="error-text" id="notice-error" hidden></p>
        <div class="row" style="gap:8px"><button class="btn" type="submit">${editing.id ? "Save" : "Publish"}</button><a class="btn quiet" href="#notices">Cancel</a>

// ------------------------------------------------------------------ timetable: feed health, what changed

/** Each feed's trips over the last days as small bars (red: couldn't be read, amber: a sharp drop), and the last builds' changes. */
async function renderFeedHealth() {
  const box = $("#tt-health");
  if (!box) return;
  const { days, feeds, builds } = await api("feeds/health");
  const names = Object.keys(feeds).sort();
  const bars = (feed) => {
    const vals = days.map((d) => feeds[feed][d]);
    const max = Math.max(1, ...vals.map((v) => v?.trips || 0));
    return `<span class="spark" aria-hidden="true">${vals.map((v, i) => `<i class="${!v ? "none" : v.trips == null ? "bad" : v.alerted ? "warn" : ""}"
      style="height:${!v ? 2 : v.trips == null ? 22 : Math.max(2, Math.round((v.trips / max) * 22))}px" title="${esc(days[i])}: ${v ? (v.trips ?? "could not be read") : "no build"}"></i>`).join("")}</span>`;
  };
  const latest = (feed) => feeds[feed][days[days.length - 1]];
  const summary = (c) => [c.newLines?.length && `${c.newLines.length} new line(s)`, c.goneLines?.length && `${c.goneLines.length} line(s) gone`,
    c.changedLines?.length && `${c.changedLines.length} line(s) with far fewer or more trips`, c.newStops?.length && `${c.newStops.length} new stop(s)`,
    c.goneStops?.length && `${c.goneStops.length} stop(s) gone`].filter(Boolean).join(", ") || "no changes worth noting";
  const list = (title, items) => items?.length ? `<p class="small"><b>${title}:</b> ${items.slice(0, 40).map(esc).join(", ")}${items.length > 40 ? `, and ${items.length - 40} more` : ""}</p>` : "";
  box.innerHTML = `
    <h2>Feed health</h2>
    <p class="muted" style="max-width:72ch;margin:0 0 12px">Trips each feed brought ${days.length > 1 ? `on each of the last ${days.length} days` : "today (each day is kept from now on)"}. Red: the feed couldn't be read.
      Amber: far fewer trips than before (admins got an email).</p>
    ${names.length ? `<div class="table-wrap"><table class="grid"><thead><tr><th>Feed</th><th>Last days</th><th>Trips now</th></tr></thead>
      <tbody>${names.map((f) => `<tr><td data-label="Feed"><code>${esc(f)}</code></td><td data-label="Last days">${bars(f)}</td>
        <td data-label="Trips now">${latest(f) ? (latest(f).trips ?? '<span class="error-text">could not be read</span>') : '<span class="muted">not today</span>'}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="muted">Recorded from the next timetable update on.</p>`}
    <h2 style="margin-top:24px">What changed</h2>
    ${builds.length ? builds.map((b) => `<details class="build"><summary><b>${when(b.built)}</b> <span class="muted">${esc(summary(b.changes))}</span></summary>
      ${list("New lines", b.changes.newLines)}${list("Lines gone", b.changes.goneLines)}
      ${list("Far fewer or more trips", (b.changes.changedLines || []).map((x) => `${x.line} ${x.before} → ${x.after}`))}
      ${list("New stops", b.changes.newStops)}${list("Stops gone", b.changes.goneStops)}</details>`).join("")
      : `<p class="muted">Compared from the next timetable update on.</p>`}`;
}

  view.innerHTML = `

      <p class="muted" style="max-width:72ch;margin:0 0 16px">Set "Fixed in version" on a bug or suggestion: it waits for that update. When the

      <form class="row" id="rel-new" style="gap:8px;margin-bottom:18px"><input class="input" name="v" placeholder="Version, e.g. 2.17.1" style="width:180px">
        <button class="btn quiet" type="submit">Open</button></form>

        <b>${esc(x.version)}</b><span class="muted small">${x.notified ? "released " + ago(x.released_at) : `${x.fixes} waiting`}</span></a>`).join("") || `<p class="muted">No versions yet. Set "Fixed in version" on a report first.</p>`}</div>
      ${draft ? `<h2>${esc(chosen)}</h2>
        <h3>In this version</h3>
        ${draft.items.length ? `<ul class="rel-items">${draft.items.map((x) => `<li><a href="#${x.kind === "feature" ? "idea" : "bug"}/${x.id}">${x.code}</a> ${esc(x.title)}
          <span class="muted small">${x.kind === "feature" ? "suggestion" : "bug"}, ${x.lang === "en" ? "English" : "Slovak"}</span></li>`).join("")}</ul>`
          : `<p class="muted">Nothing is marked as fixed in ${esc(chosen)} yet.</p>`}
        <h3>Release notes for Google Play</h3>
        <div class="notes-grid">
          <label class="field">English ${count(rel.notes_en || draft.en)}<textarea class="input" id="notes-en" rows="8">${esc(rel.notes_en || draft.en)}</textarea></label>
          <label class="field">Slovak ${count(rel.notes_sk || draft.sk)}<textarea class="input" id="notes-sk" rows="8">${esc(rel.notes_sk || draft.sk)}</textarea></label>
        </div>
        <div class="row" style="gap:8px;margin-top:10px">
          <button class="btn quiet" id="notes-save" type="button">Save notes</button>
          <button class="btn quiet" id="notes-copy" type="button">Copy for Play Console</button>
        </div>
        <div class="release-box">
          ${rel.notified ? `<p><b>Released ${when(rel.released_at)}.</b> Its reporters were told.</p>`
            : `<p>When ${esc(chosen)} is out in Google Play: ${draft.items.length} report(s) become resolved,
               ${rel.withEmail || 0} reporter(s) with an email get "Fixed in ${esc(chosen)}" in their language.</p>
               <button class="btn" id="release" type="button" ${draft.items.length ? "" : "disabled"}>Mark ${esc(chosen)} as released</button>`}
        </div>` : ""}
    </div>`;
  $("#rel-new").onsubmit = (e) => { e.preventDefault(); const v = e.target.v.value.trim(); if (/^\d+(\.\d+){1,3}$/.test(v)) location.hash = "#releases/" + v; else toast("A version looks like 2.17.1"); };
  if (!draft) return;
  view.querySelectorAll("#notes-en, #notes-sk").forEach((t) => t.oninput = () => { t.previousElementSibling.outerHTML = count(t.value); });
  $("#notes-save").onclick = async () => { await api(`releases/${encodeURIComponent(chosen)}/notes`, { en: $("#notes-en").value, sk: $("#notes-sk").value }); toast("Notes saved"); };
  $("#notes-copy").onclick = async () => {
    const text = `<en-US>\n${$("#notes-en").value.trim()}\n</en-US>\n<sk>\n${$("#notes-sk").value.trim()}\n</sk>`;
    try { await navigator.clipboard.writeText(text); toast("Copied: paste it into Play Console"); } catch { toast("Couldn't copy; select the text instead"); }
  };
  const btn = $("#release");
  if (btn) btn.onclick = async () => {
    if (!confirm(`Mark ${chosen} as released? ${draft.items.length} report(s) become resolved and their reporters get an email.`)) return;
    const r = await api(`releases/${encodeURIComponent(chosen)}/release`, {});
    toast(`Released: ${r.emailed} reporter(s) emailed`); renderReleases(chosen);
  };
}

// ------------------------------------------------------------------ server health and backups

const bytes = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + " GB" : n >= 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1e3) + " kB";
const duration = (s) => s >= 86400 ? `${Math.floor(s / 86400)} d ${Math.floor(s % 86400 / 3600)} h` : s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.floor(s % 3600 / 60)} min` : `${Math.floor(s / 60)} min`;

async function renderServer() {
  const h = await api("server");
  const memUsed = h.memTotal ? 1 - h.memAvailable / h.memTotal : null, diskUsed = 1 - h.disk.free / h.disk.total;

  const pct = (x) => Math.round(x * 100) + " %";
  view.innerHTML = `
    <div class="page-head"><h1>Server</h1>
      <div class="stats">
        <div class="stat"><b>${duration(h.now - h.started)}</b><span>running, version ${esc(h.version)}</span></div>
        ${h.rss ? `<div class="stat"><b>${bytes(h.rss)}</b><span>memory used by emHUB</span></div>` : ""}
        ${memUsed != null ? `<div class="stat"><b class="${memUsed > 0.9 ? "warn-text" : ""}">${pct(memUsed)}</b><span>of ${bytes(h.memTotal)} memory in use</span></div>` : ""}
        ${h.load ? `<div class="stat"><b>${h.load[0]}</b><span>load (${h.cpus} CPU), 15 min ${h.load[2]}</span></div>` : ""}
        <div class="stat"><b class="${diskUsed > 0.9 ? "warn-text" : ""}">${bytes(h.disk.free)}</b><span>disk free, database ${bytes(h.dbSize)}</span></div>
      </div>
    </div>
    <div class="section">
      <div class="row" style="justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><h2>Database backups</h2>
        <button class="btn" type="button" id="backup-now">Back up now</button></div>

          || `<tr><td colspan="4" class="muted">Nothing yet.</td></tr>`}</tbody></table></div>
    </div>
    <div class="section">
      <h2>App versions in use</h2>
      <p class="muted" style="max-width:72ch;margin:0 0 12px">Requests by app version since the last restart (sent by the app from 2.17.1 and by the web version), and the versions in bug reports from the last 90 days.</p>
      ${h.appVersions.length ? `<div class="table-wrap"><table class="grid"><thead><tr><th>Version</th><th>Requests</th></tr></thead>
        <tbody>${h.appVersions.map((v) => `<tr><td data-label="Version">${esc(v.version)}</td><td data-label="Requests">${v.requests}</td></tr>`).join("")}</tbody></table></div>` : ""}

}

// ------------------------------------------------------------------ riders' submissions (2.17.0)

const DAY_NAMES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const KIND_TITLE = { trip: "Missing connection", stop: "Missing stop", problem: "Problem at a stop" };
const clockOf = (secs) => `${Math.floor(secs / 3600)}:${String(Math.floor(secs % 3600 / 60)).padStart(2, "0")}`;

/** What a rider sent, shown the way it gets checked: a connection's stops and times, a stop on the map, a problem's text. */
function submissionBody(s) {
  const d = s.data;
  if (s.kind === "trip") {
    const days = d.weekdays.length === 7 ? "every day" : d.weekdays.map((x) => DAY_NAMES[x]).join(", ");
    return `<p><span class="plate line">${esc(d.line)}</span> ${d.headsign ? "to " + esc(d.headsign) : ""} <span class="muted">${esc(days)}${d.operator ? ", " + esc(d.operator) : ""}</span></p>
      <ol class="sub-stops">${d.stops.map(([, secs], i) => `<li><b>${clockOf(secs)}</b> ${esc((d.stopNames || [])[i] || d.stops[i][0])}</li>`).join("")}</ol>`;
  }
  if (s.kind === "stop") {
    return `<p><b>${esc(d.name)}</b> <a href="https://www.openstreetmap.org/?mlat=${d.lat}&mlon=${d.lon}#map=18/${d.lat}/${d.lon}" target="_blank" rel="noopener">See the place on a map</a></p>`;
  }
  return `<p class="desc">${esc(d.text)}</p>${d.station ? `<p class="muted small">Stop: ${esc(d.station)}</p>` : ""}`;
}

async function renderSubmissions() {
  const [{ submissions }] = await Promise.all([api("submissions"), refreshCounts()]);
  const waiting = submissions.filter((s) => s.status === "new"), handled = submissions.filter((s) => s.status !== "new");
  const card = (s) => `<article class="sub" data-id="${s.id}">
      <header><h3>${KIND_TITLE[s.kind]}</h3><span class="muted small">from ${esc(s.name)}${s.email ? ` (${esc(s.email)})` : ""}, ${ago(s.created_at)}</span></header>
      ${submissionBody(s)}
      ${s.status === "new" ? `<div class="row sub-actions">
          <input class="input" name="note" placeholder="Note for the record (optional)" maxlength="500">
          ${s.kind === "problem" ? `<button class="btn" data-act="done">Mark as handled</button>`
            : `<button class="btn" data-act="approve">Approve and add to the timetable</button>`}
          <button class="btn quiet" data-act="reject">Reject</button></div>`
        : `<p class="small"><span class="status ${s.status === "approved" || s.status === "done" ? "resolved" : ""}">${esc(s.status)}</span>
           <span class="muted">by ${esc(s.reviewed_by)}${s.note ? ": " + esc(s.note) : ""}</span></p>`}
    </article>`;
  view.innerHTML = `
    <div class="page-head"><h1>Submissions</h1></div>
    <div class="section">
      <p class="muted" style="max-width:70ch;margin:0 0 16px">Riders send stops and connections the timetable lacks, and problems at stops. Nothing changes the
        timetable until you approve it; an approved stop or connection is in the planner about half a minute later.</p>
      <h2>Waiting for you</h2>
      ${waiting.length ? waiting.map(card).join("") : `<p class="muted">Nothing new. Riders' submissions from the apps appear here.</p>`}
      ${handled.length ? `<h2 style="margin-top:28px">Handled</h2>${handled.map(card).join("")}` : ""}
    </div>`;
  view.querySelectorAll(".sub").forEach((el) => {
    el.onclick = async (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      await api(`submissions/${el.dataset.id}/${b.dataset.act}`, { note: el.querySelector("[name=note]")?.value || "" });
      toast({ approve: "Approved: in the timetable in about half a minute", reject: "Rejected", done: "Marked as handled" }[b.dataset.act]);
      renderSubmissions();
    };
  });
}

        </div>

            <span class="plate">${b.code}</span>

            <span class="m"><span class="status ${b.status}">${label(b.status)}${b.fixed_in ? " " + esc(b.fixed_in) : ""}</span><span>${esc(b.category)}</span><span>${esc(b.platform)} ${esc(b.app_version)}</span><span>${ago(b.updated_at)}</span></span>
            ${b.labels ? `<span class="m tags">${b.labels.split(",").map((l) => `<span class="tag">${esc(l)}</span>`).join("")}</span>` : ""}

function highlightLogs(text, needle) {
  return text.split("\n").filter((l) => !needle || l.toLowerCase().includes(needle.toLowerCase())).map((line) => {
    let h = esc(line);
    if (needle) h = h.replace(new RegExp(esc(needle).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
    const cls = /\bE\/|\bERROR\b|Exception|FATAL/.test(line) ? "e" : /\bW\/|\bWARN/.test(line) ? "w" : "";
    return cls ? `<span class="${cls}">${h}</span>` : h;
  }).join("\n");
}

    ${bug.similar.length ? `<div class="similar"><h3>Maybe the same problem</h3><ul>${bug.similar.map((x) =>
      `<li><a href="#${bug.kind === "feature" ? "idea" : "bug"}/${x.id}">${x.code}</a> ${esc(x.title)} <span class="muted small">${x.why}, ${label(x.status).toLowerCase()}</span></li>`).join("")}</ul></div>` : ""}
    <div class="status-bar">

    await api(`bugs/${id}/reply`, { body: body.value, status: $("#reply-status").value });

  act($("#preview"), async () => {
    const { html } = await api("preview", { bugId: id, body: body.value });
    const frame = $("#preview-frame"); frame.srcdoc = html; frame.hidden = false;
  });
}

// ------------------------------------------------------------------ community

function tripParts(key) {
  // City/regional buses from sadzv: sadzv|lineId|trip|date|line; planner trips: line|first stop|first departure (ms)
  const parts = key.split("|");
  if (parts[0] === "sadzv") return { line: parts[4] || "", first: "trip " + parts[2], start: parts[3] };
  const [line, first, ms] = parts;
  const t = Number(ms);
  return { line, first, start: t ? new Date(t).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "" };
}
const kindLabel = { gps: "rider's phone", departed: "left the stop (phone)", passed: "drove past (phone)", arrival: "at the stop", position: "tap" };
const dayTypeLabel = { workday: "workdays", saturday: "Saturdays", sunday: "Sundays" };
// Which buses the table shows: the last 6 hours (no day) or any day, optionally one line.
let communityFilter = { day: "", line: "" };

// Long lists show the newest LIST_LIMIT rows (phones: tens of thousands of pixels otherwise), then a button.
const LIST_LIMIT = 50, showAll = { reports: false, trips: false };
const more = (key, n) => n > LIST_LIMIT && !showAll[key]
  ? `<button class="btn quiet more" type="button" data-more="${key}">Show all ${n}</button>` : "";
