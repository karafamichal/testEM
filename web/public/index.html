<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Plan&amp;Ride</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0F1A30" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plan&amp;Ride" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Install gate: phones must open Plan&Ride from the Home Screen -->
  <div id="install-gate" class="center-view" hidden>
    <div class="narrow">
      <img src="/icons/icon-192.png" alt="" class="brand-logo" />
      <h1 data-i18n="install_title">Install Plan&amp;Ride</h1>
      <p class="hint" data-i18n="install_lead"></p>
      <ol id="ios-steps" class="steps" hidden>
        <li data-i18n="install_ios_1"></li><li data-i18n="install_ios_2"></li><li data-i18n="install_ios_3"></li>
      </ol>
      <div id="android-steps" hidden>
        <button id="install-btn" class="btn wide" data-i18n="install_button" hidden></button>
        <ol class="steps"><li data-i18n="install_android_1"></li><li data-i18n="install_android_2"></li><li data-i18n="install_ios_3"></li></ol>
      </div>
      <p class="hint small" data-i18n="install_note"></p>
    </div>
  </div>

  <!-- PIN setup: right after an account is added (its password is saved only encrypted) -->
  <div id="pin-view" class="center-view" hidden>
    <form id="pin-form" class="narrow stack">
      <img src="/icons/icon-192.png" alt="" class="brand-logo" />
      <h1 id="pin-title" data-i18n="pin_setup_title"></h1>
      <p class="hint" data-i18n="pin_setup_body"></p>
      <label class="field"><span data-i18n="pin_new"></span><input name="pin" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="new-password" required /></label>
      <label class="field"><span data-i18n="pin_confirm"></span><input name="confirm" class="pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="new-password" required /></label>
      <p id="pin-error" class="error-text" role="alert" hidden></p>
      <button class="btn wide" type="submit" data-i18n="save"></button>
      <button class="text-btn" type="button" id="pin-cancel" data-i18n="pin_setup_cancel"></button>
    </form>
  </div>

  <!-- Sign in -->
  <div id="login-view" class="center-view" hidden>
    <div class="narrow">
      <div class="brand"><img src="/icons/icon-192.png" alt="" class="brand-logo" /><h1 id="login-title">Plan&amp;Ride</h1><p class="hint" id="login-sub"></p></div>
      <form id="login-form" class="stack" autocomplete="on">
        <div class="segmented" id="login-kind" role="radiogroup">
          <button type="button" role="radio" aria-checked="true" data-kind="sadzv">SAD Zvolen</button>
          <button type="button" role="radio" aria-checked="false" data-kind="ids">IDS BBSK</button>
        </div>
        <label class="field"><span data-i18n="email">Email</span><input id="email" type="email" inputmode="email" autocomplete="username" required /></label>
        <label class="field"><span data-i18n="password">Password</span><input id="password" type="password" autocomplete="current-password" required /></label>
        <button id="login-btn" type="submit" class="btn wide" data-i18n="login">Sign in</button>
        <p id="login-error" class="error-text" role="alert" hidden></p>
      </form>
      <button id="browse-btn" class="btn outline wide"></button>
      <p id="welcome-hint" class="hint small center" data-i18n="welcome_skip_hint" hidden></p>
      <p class="hint small center" data-i18n="login_disclaimer"></p>
    </div>
  </div>

  <!-- App -->
  <div id="app-view" hidden>
    <main class="tabs">
      <section id="tab-ticket" class="tab"></section>
      <section id="tab-departures" class="tab" hidden></section>
      <section id="tab-planner" class="tab" hidden></section>
      <section id="tab-history" class="tab" hidden></section>
      <section id="tab-account" class="tab" hidden></section>
    </main>
    <nav id="tabbar" class="tabbar">
      <button data-tab="ticket"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 10.5V21h6.5v-6h5v6H21V10.5z"/></svg><span data-i18n="tab_home"></span></button>
      <button data-tab="departures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span data-i18n="tab_departures"></span></button>
      <button data-tab="planner"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16V6c0-2.5 3-3 7-3s7 .5 7 3v10c0 .8-.4 1.5-1 1.9V20h-2.5v-1.5h-7V20H6v-2.1c-.6-.4-1-1.1-1-1.9Zm2-6h10V6H7v4Zm1.5 6a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Zm7 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4Z"/></svg><span data-i18n="tab_planner"></span></button>
      <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2Zm3 5v2h6V7H9Zm0 4v2h6v-2H9Z"/></svg><span data-i18n="tab_history"></span></button>
      <button data-tab="account"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 4a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm0 14a8 8 0 0 0 6-2.7C16.7 15.8 14.5 15 12 15s-4.7.8-6 2.3A8 8 0 0 0 12 20Z"/></svg><span data-i18n="tab_account"></span></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/qrcode.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
